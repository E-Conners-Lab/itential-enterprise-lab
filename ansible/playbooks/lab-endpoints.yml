---
# Phase 4: the Linux endpoints in EVE-NG (dc1-srv01, br*-host01) have no startup-config mechanism.
# ens3 (EVE-NG interface 0) is management with a DHCP reservation from oob-gw; this play sets the
# hostname and brings up ens4 (interface 1, the site data VLAN): DHCP from the site gateway at the
# branches, static in the DC (no relay in the fabric). Management keeps the default route; the
# in-band lab prefixes are routed via the site gateway. MTU 1400 keeps VXLAN + IPsec below the
# 1500-byte fabric/WAN links (vEOS-lab runs at 1500, AVD guidance). Inventory: NetBox devices with
# role server/client (active = built).
- name: Configure EVE-NG Linux endpoints
  hosts: server:client
  become: true
  gather_facts: false
  vars:
    ansible_user: automation
    # EVE-NG guests are re-cloned from the golden image (fresh host keys); lab-only relaxation
    ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null
    site: "{{ inventory_hostname.split('-')[0] }}"
    data:
      dc1: {gateway: 10.101.10.1, static: 10.101.10.10/24}
      br1: {gateway: 10.102.17.1}
      br2: {gateway: 10.102.33.1}
    lab_prefixes: [10.101.0.0/16, 10.102.0.0/16, 10.103.0.0/16]
  pre_tasks:
    - name: Only Ubuntu endpoints (Windows clients are handled by their golden image)
      ansible.builtin.meta: end_host
      when: platforms is defined and 'ubuntu-24-04' not in platforms  # group_names_raw: slugs

    - name: Wait for the guest to boot (make up runs this right after eve/build.py start)
      ansible.builtin.wait_for_connection:
        timeout: 900
        sleep: 15
  tasks:
    - name: Hostname from NetBox
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Data interface ens4
      ansible.builtin.copy:
        dest: /etc/netplan/60-data.yaml
        mode: "0600"
        content: |
          network:
            version: 2
            ethernets:
              # the golden image's 50-eve-dhcp.yaml matches en* for DHCP; networkd applies the lexically
              # first matching unit (all-en beats ens4), so narrow that definition to the management port
              all-en: {match: {name: ens3}, dhcp4: true}
              ens4:
                mtu: 1400
          {% if data[site].static is defined %}
                addresses: [{{ data[site].static }}]
          {% else %}
                dhcp4: true
                dhcp4-overrides: {use-routes: false, use-dns: false}
          {% endif %}
                routes:
          {% for p in lab_prefixes %}
                  - {to: {{ p }}, via: {{ data[site].gateway }}}
          {% endfor %}
      register: np

    - name: Apply netplan
      ansible.builtin.command: netplan apply
      when: np is changed
      changed_when: true

    - name: Tools for verification
      ansible.builtin.apt:
        name: [traceroute, iputils-ping, curl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Gateway 5 reaches the hosts as the automation user with its password (PID S4d.6, ADR 0047): the cloud
    # image's 60-cloudimg-settings.conf disables password login and sorts before EVE's 60-eve.conf, so a
    # drop-in that sorts first enables it for this one user (the key login of the play stays).
    - name: Automation account password from .env (the same lab account the network devices use; fixed salt keeps re-runs idempotent)
      ansible.builtin.user:
        name: automation
        password: "{{ lookup('ansible.builtin.env', 'AUTOMATION_PASSWORD') | password_hash('sha512', 'itentiallab24') }}"
      no_log: true

    - name: Password login for the automation user (Gateway 5 inventory nodes)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-lab-automation.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # itential-enterprise-lab (ansible/playbooks/lab-endpoints.yml): Gateway 5 send-command as automation
          Match User automation
              PasswordAuthentication yes
      notify: Reload sshd
  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: ssh
        state: reloaded
