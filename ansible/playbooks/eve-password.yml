---
# Phase 2, slice G: rotate the EVE-NG admin password off the factory default (assumption 12).
# EVE-NG Pro's API edits a user with PUT /api/users/<name> carrying the full user object
# (as the evengsdk client does). The new password is proven by a fresh login before .env is
# updated; if that login fails the old password is still valid and the play fails loud.
- name: EVE-NG admin password rotation
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    eve_host: "{{ lookup('ansible.builtin.env', 'EVE_HOST') }}"
    eve_user: "{{ lookup('ansible.builtin.env', 'EVE_USERNAME') }}"
    eve_pass: "{{ lookup('ansible.builtin.env', 'EVE_PASSWORD') }}"
    env_file: "{{ playbook_dir }}/../../.env"
    factory_password: eve
    new_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
  tasks:
    - name: Login with the current password
      ansible.builtin.uri:
        url: "https://{{ eve_host }}/api/auth/login"
        method: POST
        validate_certs: false
        body_format: json
        body: {username: "{{ eve_user }}", password: "{{ eve_pass }}", html5: "-1"}
      register: login
      no_log: true

    - name: Nothing to do unless the factory password is still in use
      ansible.builtin.meta: end_play
      when: eve_pass != factory_password

    - name: Read the admin user object
      ansible.builtin.uri:
        url: "https://{{ eve_host }}/api/users/{{ eve_user }}"
        validate_certs: false
        headers: {Cookie: "{{ login.cookies_string }}"}
      register: user_obj

    - name: Set the new password (full object, as the API expects)
      ansible.builtin.uri:
        url: "https://{{ eve_host }}/api/users/{{ eve_user }}"
        method: PUT
        validate_certs: false
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body: "{{ user_obj.json.data | combine({'password': new_password}) }}"
      register: put_user
      no_log: true
      failed_when: put_user.status != 200 or put_user.json.status != 'success'

    - name: Prove the new password with a fresh login
      ansible.builtin.uri:
        url: "https://{{ eve_host }}/api/auth/login"
        method: POST
        validate_certs: false
        body_format: json
        body: {username: "{{ eve_user }}", password: "{{ new_password }}", html5: "-1"}
      register: relogin
      no_log: true
      failed_when: relogin.status != 200 or relogin.json.status != 'success'

    - name: Store the new password in .env
      ansible.builtin.lineinfile:
        path: "{{ env_file }}"
        regexp: "^EVE_PASSWORD="
        line: "EVE_PASSWORD={{ new_password }}"
      no_log: true

    - name: Factory password must now be rejected
      ansible.builtin.uri:
        url: "https://{{ eve_host }}/api/auth/login"
        method: POST
        validate_certs: false
        body_format: json
        body: {username: "{{ eve_user }}", password: "{{ factory_password }}", html5: "-1"}
        status_code: [200, 400, 401, 403]
      register: old_login
      failed_when: old_login.status == 200 and old_login.json.status == 'success'
