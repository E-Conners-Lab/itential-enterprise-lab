---
# Phase 7 (PID S7, ADR 0051): the observability stack on k3s and its configuration, all from documents in
# the repo. Runs on the workstation with helm + kubectl against ~/.kube/lab-k3s.yaml. Idempotent.
# Order: secrets (generated once, persisted to .env before use) -> namespace, CA, secrets -> Zabbix removed (ADR
# 0071) -> charts (kube-prometheus-stack first: its CRDs carry the scrape objects) -> Traefik VIPs, Ingresses,
# gNMIc, the Platform exporter, scrape objects, rules (the lab's and the generated expiry rules), dashboards.
# Hosts (syslog forwarding) and devices (governed pushes) are observability-hosts.yml and observability-devices.yml.
- name: Phase 7 secrets, persisted before use
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    env_file: "{{ playbook_dir }}/../../.env"
    secret_keys: [GRAFANA_ADMIN_PASSWORD, SNMPV3_AUTH_PASSWORD, SNMPV3_PRIV_PASSWORD]
  tasks:
    - name: Current values from .env
      ansible.builtin.set_fact:
        obs_secrets: >-
          {{ obs_secrets | default({}) | combine({item: lookup('ansible.builtin.env', item)}) }}
      loop: "{{ secret_keys }}"
      no_log: true

    # lookup('password', '/dev/null') re-evaluates on every reference (lab-build-lessons): generate into a
    # fact exactly once per missing key, then persist.
    - name: Generate the missing ones (24 alphanumerics; SNMPv3 accepts 8-64)
      ansible.builtin.set_fact:
        obs_secrets: >-
          {{ obs_secrets | combine({item: lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits'])}) }}
      loop: "{{ secret_keys }}"
      when: obs_secrets[item] | length == 0
      no_log: true

    - name: Persist to .env before use
      ansible.builtin.lineinfile:
        path: "{{ env_file }}"
        regexp: "^{{ item }}="
        line: "{{ item }}={{ obs_secrets[item] }}"
      loop: "{{ secret_keys }}"
      no_log: true

- name: Observability stack on k3s
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../k8s/observability/versions.yaml
    - ../../observability/observability.yaml
  vars:
    ansible_python_interpreter: "{{ playbook_dir }}/../../.venv/bin/python"
    kubeconfig: >-
      {{ lookup('ansible.builtin.env', 'KUBECONFIG_PATH')
         | default(lookup('ansible.builtin.env', 'HOME') ~ '/.kube/lab-k3s.yaml', true) }}
    helm_bin: "{{ lookup('ansible.builtin.env', 'HELM3_BIN') | default('/opt/homebrew/opt/helm@3/bin/helm', true) }}"
    repo: "{{ playbook_dir }}/../.."
    k8s_dir: "{{ repo }}/k8s/observability"
    obs_dir: "{{ repo }}/observability"
    ca_file: "{{ repo }}/docs/lab-root-ca.crt"
    domain: lab.internal
    secrets: "{{ hostvars['localhost'].obs_secrets }}"
    netbox_url: "{{ lookup('ansible.builtin.env', 'NETBOX_URL') }}"
    netbox_headers: {Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"}
    itential_host: itential.{{ domain }}
    # The official dashboard's sources follow the production environment (ADR 0055, PID S11.7): the Platform's
    # own /prometheus_metrics on each node, node and process exporters on the Platform nodes, the Redis
    # exporter on each Redis server and the MongoDB exporter on each replica-set member - which is what
    # finally gives the dashboard's replica-set panels data. The dev-stack's `monitoring` Compose profile on
    # VM 205 is no longer scraped; it retires with the VM.
    ha2: "{{ lookup('ansible.builtin.file', repo ~ '/itential/ha2/versions.yaml') | from_yaml }}"
    platform_nodes: "{{ ha2.vms | selectattr('role', 'equalto', 'platform') | list }}"
    host_exporters:
      - {job: node_exporter, port: "{{ ha2.exporters.node }}", role: platform}
      - {job: process_exporter, port: "{{ ha2.exporters.process }}", role: platform}
      - {job: redis_exporter, port: "{{ ha2.exporters.redis }}", role: redis}
      - {job: mongo_exporter, port: "{{ ha2.exporters.mongodb }}", role: mongodb}
    itential_admin_user: "{{ lookup('ansible.builtin.env', 'ITENTIAL_ADMIN_USER') | default('admin@itential', true) }}"
    # release name -> chart key in versions.yaml, values file, and the image tags the oracle sets (`overrides`:
    # a key named `values` is the dict method in Jinja)
    charts:
      - {key: kube_prometheus_stack, release: kps, values_file: kube-prometheus-stack.yaml, overrides: {}}
      - key: snmp_exporter
        release: snmp-exporter
        values_file: snmp-exporter.yaml
        overrides: {image: {tag: "{{ components.snmp_exporter.app_version }}"}}
      - key: blackbox_exporter
        release: blackbox-exporter
        values_file: blackbox-exporter.yaml
        overrides: {image: {tag: "{{ components.blackbox_exporter.app_version }}"}}
      - {key: loki, release: loki, values_file: loki.yaml, overrides: {loki: {image: {tag: "{{ components.loki.app_version }}"}}}}
      - {key: alloy, release: alloy-logs, values_file: alloy-logs.yaml, overrides: {image: {tag: "{{ components.alloy.app_version }}"}}}
      - {key: alloy, release: alloy-syslog, values_file: alloy-syslog.yaml, overrides: {image: {tag: "{{ components.alloy.app_version }}"}}}
    ingresses:
      - {name: grafana, service: kps-grafana, port: 80}
      - {name: prometheus, service: kps-prometheus, port: 9090}
      - {name: alertmanager, service: kps-alertmanager, port: 9093}
      - {name: loki, service: loki, port: 3100}
      - {name: gnmic, service: gnmic, port: 9273}
    blackbox_service: blackbox-exporter-prometheus-blackbox-exporter
    snmp_service: snmp-exporter-prometheus-snmp-exporter
    service_monitors:
      - job: snmp-exporter
        selector: {app.kubernetes.io/name: prometheus-snmp-exporter, app.kubernetes.io/instance: snmp-exporter}
        port: http
      - job: blackbox-exporter
        selector: {app.kubernetes.io/name: prometheus-blackbox-exporter, app.kubernetes.io/instance: blackbox-exporter}
        port: http
      - {job: gnmic, selector: {app.kubernetes.io/name: gnmic}, port: metrics}
      - {job: loki, selector: {app.kubernetes.io/name: loki, app.kubernetes.io/instance: loki}, absent: [variant], port: http-metrics}
      - {job: alloy-logs, selector: {app.kubernetes.io/name: alloy, app.kubernetes.io/instance: alloy-logs}, port: http-metrics}
      - {job: alloy-syslog, selector: {app.kubernetes.io/name: alloy, app.kubernetes.io/instance: alloy-syslog}, port: http-metrics}
      - {job: itential-exporter, selector: {app.kubernetes.io/name: itential-exporter}, port: metrics}
  tasks:
    - name: Kubeconfig must exist
      ansible.builtin.stat:
        path: "{{ kubeconfig }}"
      register: kc
      failed_when: not kc.stat.exists

    # --- inventory from NetBox (PIS-15): active devices and VMs with a platform the documents know ---
    - name: NetBox active devices
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/dcim/devices/?status=active&limit=200"
        headers: "{{ netbox_headers }}"
      register: nb_devices

    - name: Monitored devices derived from NetBox
      ansible.builtin.set_fact:
        devices: >-
          {%- set out = [] -%}
          {%- for d in nb_devices.json.results if d.platform and d.platform.slug in ['ios-xe', 'eos'] -%}
            {%- set _ = out.append({'name': d.name, 'ip': d.primary_ip4.address | ansible.utils.ipaddr('address'),
                                    'platform': d.platform.slug, 'site': d.site.slug, 'role': d.role.slug}) -%}
          {%- endfor -%}
          {{ out }}

    - name: Twelve routers and switches expected (five C8000v, seven vEOS)
      ansible.builtin.assert:
        that:
          - devices | selectattr('platform', 'equalto', 'ios-xe') | list | length == 5
          - devices | selectattr('platform', 'equalto', 'eos') | list | length == 7
        quiet: true

    # --- namespace, CA, secrets --------------------------------------------------------------------
    - name: Namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata: {name: "{{ obs_namespace }}"}

    # force: replaced whole, so the hashed CApath copy only Zabbix read goes with it (ADR 0071)
    - name: Lab CA ConfigMap (public material)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        force: true
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata: {name: lab-ca, namespace: "{{ obs_namespace }}"}
          data: {ca.crt: "{{ ca_pem }}"}
      vars:
        ca_pem: "{{ lookup('ansible.builtin.file', ca_file) }}"

    - name: Secrets from .env (never in git)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata: {name: "{{ item.name }}", namespace: "{{ obs_namespace }}"}
          type: Opaque
          stringData: "{{ item.data }}"
      loop:
        - {name: grafana-admin, data: {admin-user: admin, admin-password: "{{ secrets.GRAFANA_ADMIN_PASSWORD }}"}}
        - name: snmpv3
          data: {SNMPV3_AUTH_PASSWORD: "{{ secrets.SNMPV3_AUTH_PASSWORD }}", SNMPV3_PRIV_PASSWORD: "{{ secrets.SNMPV3_PRIV_PASSWORD }}"}
        - name: gnmic
          data: {GNMIC_USERNAME: automation, GNMIC_PASSWORD: "{{ lookup('ansible.builtin.env', 'AUTOMATION_PASSWORD') }}"}
        - name: itential-exporter
          data:
            ITENTIAL_USER: "{{ itential_admin_user }}"
            ITENTIAL_PASSWORD: "{{ lookup('ansible.builtin.env', 'ITENTIAL_ADMIN_PASSWORD') }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    # --- Zabbix removed (ADR 0071) ------------------------------------------------------------------------
    # Dropping a chart, a manifest or a template entry deletes nothing live, so every Zabbix object is named here;
    # each task is a no-op once done. The release first (server, web and its zabbix-server LoadBalancer on .35),
    # then the database: CloudNativePG deletes the instance PVC and its secrets with the Cluster.
    - name: The Zabbix release uninstalled
      kubernetes.core.helm:
        binary_path: "{{ helm_bin }}"
        kubeconfig: "{{ kubeconfig }}"
        name: zabbix
        release_namespace: "{{ obs_namespace }}"
        state: absent
        wait: true

    - name: The zabbix-db Cluster deleted (CloudNativePG removes its PVC and secrets)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: postgresql.cnpg.io/v1
        kind: Cluster
        namespace: "{{ obs_namespace }}"
        name: zabbix-db
        wait: true

    - name: No zabbix-db volume left
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: PersistentVolumeClaim
        namespace: "{{ obs_namespace }}"
        label_selectors: [cnpg.io/cluster=zabbix-db]
      register: zdb_pvcs
      retries: 30
      delay: 10
      until: zdb_pvcs.resources | length == 0

    # The longhorn StorageClass reclaims with Retain, so the claim's deletion leaves its PV Released and the data on
    # disk (~21 GB, measured 2026-10-04). Only the PV that was bound to zabbix-db-1 is deleted, then its Longhorn volume.
    - name: PersistentVolumes now
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: PersistentVolume
      register: all_pvs

    - name: The retained zabbix-db PersistentVolume deleted
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: v1
        kind: PersistentVolume
        name: "{{ item.metadata.name }}"
        wait: true
      loop: "{{ zdb_pvs }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      vars:
        zdb_pvs: >-
          {{ all_pvs.resources | selectattr('spec.claimRef', 'defined')
             | selectattr('spec.claimRef.namespace', 'equalto', obs_namespace)
             | selectattr('spec.claimRef.name', 'equalto', 'zabbix-db-1') | list }}

    - name: Its Longhorn volume deleted
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: longhorn.io/v1beta2
        kind: Volume
        namespace: longhorn-system
        name: "{{ item.metadata.name }}"
      loop: "{{ zdb_pvs }}"
      loop_control:
        label: "{{ item.metadata.name }}"
      vars:
        zdb_pvs: >-
          {{ all_pvs.resources | selectattr('spec.claimRef', 'defined')
             | selectattr('spec.claimRef.namespace', 'equalto', obs_namespace)
             | selectattr('spec.claimRef.name', 'equalto', 'zabbix-db-1') | list }}

    # the Probe too: the scrape template stopped rendering http-zabbix, and an apply never deletes a document it no
    # longer renders (S7.2 counted 10 blackbox-http targets against 9 on 2026-10-05)
    - name: The Zabbix web Ingress, its Traefik VIP, its HTTP probe and Grafana's Zabbix password gone
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: "{{ item.api }}"
        kind: "{{ item.kind }}"
        namespace: "{{ item.namespace }}"
        name: "{{ item.name }}"
      loop:
        - {api: networking.k8s.io/v1, kind: Ingress, namespace: "{{ obs_namespace }}", name: zabbix}
        - {api: v1, kind: Service, namespace: "{{ traefik.namespace }}", name: traefik-vip-zabbix}
        - {api: v1, kind: Secret, namespace: "{{ obs_namespace }}", name: grafana-env}
        - {api: monitoring.coreos.com/v1, kind: Probe, namespace: "{{ obs_namespace }}", name: http-zabbix}
      loop_control:
        label: "{{ item.kind }} {{ item.name }}"

    # --- Traefik VIPs first: the alloy-syslog Service shares .38 with them and MetalLB assigns a shared address
    # only when every sharer carries the same externalTrafficPolicy ------------------------------------------
    - name: Traefik VIP Services (kube-system)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        template: templates/obs-traefik-vips.yaml.j2
        apply: true # keys the template drops are removed (a patch would keep them)

    # --- charts --------------------------------------------------------------------------------------
    - name: Helm repositories
      kubernetes.core.helm_repository:
        binary_path: "{{ helm_bin }}"
        name: "{{ item.key | replace('_', '-') }}"
        repo_url: "{{ components[item.key].chart_repo }}"
      loop: "{{ charts }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Charts, kube-prometheus-stack first (its CRDs carry every scrape object)
      kubernetes.core.helm:
        binary_path: "{{ helm_bin }}"
        kubeconfig: "{{ kubeconfig }}"
        name: "{{ item.release }}"
        chart_ref: "{{ item.key | replace('_', '-') }}/{{ components[item.key].chart_name }}"
        chart_version: "{{ components[item.key].chart_version }}"
        release_namespace: "{{ obs_namespace }}"
        values_files: ["{{ k8s_dir }}/values/{{ item.values_file }}"]
        values: "{{ item.overrides }}"
        wait: true
        timeout: 15m
      loop: "{{ charts }}"
      loop_control:
        label: "{{ item.release }} {{ components[item.key].chart_version }}"

    # --- Ingresses, gNMIc, the Platform exporter, scrape objects, rules, dashboards ---------------------
    - name: Ingresses behind the wildcard lab-CA certificate
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        template: templates/obs-ingress.yaml.j2
        apply: true # keys the template drops are removed (a patch would keep them)

    - name: GNMIc configuration rendered from NetBox (vEOS targets)
      ansible.builtin.set_fact:
        gnmic_config: "{{ lookup('ansible.builtin.template', obs_dir ~ '/gnmic/gnmic.yaml.j2') }}"
        eos_devices: "{{ devices | selectattr('platform', 'equalto', 'eos') | list }}"
      vars:
        eos_devices: "{{ devices | selectattr('platform', 'equalto', 'eos') | list }}"

    - name: GNMIc
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        template: templates/obs-gnmic.yaml.j2
        apply: true # keys the template drops are removed (a patch would keep them)

    - name: Platform exporter
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        template: templates/obs-itential-exporter.yaml.j2
        apply: true # keys the template drops are removed (a patch would keep them)
      vars:
        exporter_source: "{{ lookup('ansible.builtin.file', obs_dir ~ '/itential-exporter/exporter.py') }}"

    # R6 (ADR 0072): Alertmanager's webhook to Operations Manager, with the exporter's login (owner decision 2026-10-05)
    - name: Alert relay
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        template: templates/obs-alert-relay.yaml.j2
        apply: true # keys the template drops are removed (a patch would keep them)
      vars:
        relay_source: "{{ lookup('ansible.builtin.file', obs_dir ~ '/alert-relay/relay.py') }}"

    - name: Scrape objects (ServiceMonitors, Probes per device and UI, SNMP ScrapeConfigs)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        template: templates/obs-scrape.yaml.j2
        apply: true # keys the template drops are removed (a patch would keep them)

    # `apply` prunes keys inside a document but never removes a document the template stopped rendering: the
    # dev-stack's single iap-exporter ScrapeConfig became one per production node (ADR 0055) and would
    # otherwise keep scraping VM 205 and make the dashboard's Platform row read three nodes.
    # `apply` prunes keys inside a document but never a document that stopped being rendered, so every
    # scrape object this play no longer emits has to be named here: the dev-stack's single `iap-exporter`
    # (VM 205, retired at S11.8) and the per-node object for any Platform node that is parked, since only
    # the active one serves /prometheus_metrics (ADR 0055 decision 9). Left behind, a parked node's object
    # keeps a target permanently down and fails S7.2 while saying nothing true about the estate.
    - name: Superseded scrape objects removed
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        api_version: monitoring.coreos.com/v1alpha1
        kind: ScrapeConfig
        namespace: "{{ obs_namespace }}"
        name: "{{ item }}"
      loop: >-
        {{ ['iap-exporter']
           + (platform_nodes | rejectattr('name', 'equalto', ha2.platform.nodes[0])
              | map(attribute='name') | map('regex_replace', '^', 'iap-exporter-') | list) }}

    - name: Lab alert rules
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ k8s_dir }}/manifests/prometheus-rules.yaml"
        apply: true

    # one days-left series per observability/expiries.yaml entry and LabExpirySoon (ADR 0071; generated, tested)
    - name: Expiry rules
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ k8s_dir }}/manifests/expiry-rules.yaml"
        apply: true

    # R10: LabBgpSessionDown from gNMIc (vEOS) and SNMP (C8000v) for the sessions the topology declares (generated, tested)
    - name: BGP session rules
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        src: "{{ k8s_dir }}/manifests/bgp-rules.yaml"
        apply: true

    - name: Grafana dashboards from observability/grafana/dashboards (sidecar ConfigMaps)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "dashboard-{{ item | basename | regex_replace('\\.json$', '') }}"
            namespace: "{{ obs_namespace }}"
            labels: {grafana_dashboard: "1"}
            annotations: {grafana_folder: Lab}
          data: "{{ {item | basename: lookup('ansible.builtin.file', item)} }}"
      with_fileglob: "{{ obs_dir }}/grafana/dashboards/*.json"
      loop_control:
        label: "{{ item | basename }}"

    # --- the Zabbix app's files (ADR 0071 amendment) ---------------------------------------------------------------
    # `plugins: []` stops new installs but Grafana loads whatever is already on its volume, and the image has no shell:
    # Grafana's own CLI lists and removes the app, then the pod is replaced (Recreate) so it starts without it.
    - name: Grafana's pod
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Pod
        namespace: "{{ obs_namespace }}"
        label_selectors: [app.kubernetes.io/name=grafana]
        field_selectors: [status.phase=Running]
      register: grafana_pod

    - name: The Zabbix app on Grafana's volume
      kubernetes.core.k8s_exec:
        kubeconfig: "{{ kubeconfig }}"
        namespace: "{{ obs_namespace }}"
        pod: "{{ grafana_pod.resources[0].metadata.name }}"
        container: grafana
        command: grafana cli --pluginsDir /var/lib/grafana/plugins plugins ls
      register: zbx_app
      changed_when: false

    - name: The Zabbix app removed from Grafana's volume
      kubernetes.core.k8s_exec:
        kubeconfig: "{{ kubeconfig }}"
        namespace: "{{ obs_namespace }}"
        pod: "{{ grafana_pod.resources[0].metadata.name }}"
        container: grafana
        command: grafana cli --pluginsDir /var/lib/grafana/plugins plugins remove alexanderzobnin-zabbix-app
      when: "'alexanderzobnin-zabbix-app' in zbx_app.stdout"
      register: zbx_app_removed

    - name: Grafana restarted without it (the Deployment replaces the pod)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        state: absent
        kind: Pod
        namespace: "{{ obs_namespace }}"
        name: "{{ grafana_pod.resources[0].metadata.name }}"
        wait: true
      when: zbx_app_removed is changed

    - name: Grafana ready again
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Deployment
        namespace: "{{ obs_namespace }}"
        name: kps-grafana
      register: grafana_deploy
      retries: 30
      delay: 10
      until: (grafana_deploy.resources[0].status.readyReplicas | default(0)) == 1
      when: zbx_app_removed is changed
