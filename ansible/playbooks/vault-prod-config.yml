---
# Phase 9a step 3 (ADR 0065): configure production's Vault - `make vault-config`. The KV v2 mount, the two read-only
# AppRoles and the PSK writer (ADR 0068) bound to their own hosts' addresses (topology/ipam.yaml), and the seeds from
# .env, all through the task file the dev tier proved (tasks/vault-config.yml). Then the binding is proven on the real
# path instead of assumed: a one-use, five-minute secret ID per role and host must log in from that host, and one from
# this workstation must be refused. The token is the root token from the owner's init file (VAULT_INIT_FILE), read
# without printing it; VAULT_TOKEN overrides it (for example the owner's lab-admin login, now that root is revoked).
- name: Configure production's Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../itential/versions.yaml
    - ../../topology/ipam.yaml
  vars:
    ansible_python_interpreter: "{{ playbook_dir }}/../../.venv/bin/python"
    vault_addr: "{{ vault.prod.url }}"
    vault_env: prod
    init_file: >-
      {{ lookup('ansible.builtin.env', 'VAULT_INIT_FILE')
         | default(lookup('ansible.builtin.env', 'HOME') ~ '/.config/itential-enterprise-lab/vault-init.json', true) }}
    host_ip: "{{ dict(addresses | map(attribute='hostname') | zip(addresses | map(attribute='address'))) }}"
    # each reader role may be used only from its hosts (ADR 0065 decisions 5 and 6)
    vault_role_cidrs: >-
      {%- set out = {} -%}
      {%- for role, r in vault.approles.items() -%}
        {%- set _ = out.update({role: r.bound_hosts | map('extract', host_ip) | map('regex_replace', '$', '/32') | list}) -%}
      {%- endfor -%}
      {{ out }}
    # one test per (role, host) plus one per role from this workstation, which must be refused
    binding_plan: >-
      {%- set out = [] -%}
      {%- for role, r in vault.approles.items() -%}
        {%- for h in r.bound_hosts -%}{%- set _ = out.append({'role': role, 'host': h}) -%}{%- endfor -%}
        {%- set _ = out.append({'role': role, 'host': 'workstation'}) -%}
      {%- endfor -%}
      {{ out }}
  tasks:
    - name: Production only
      ansible.builtin.assert:
        that: not (dev_overlay | default(false) | bool)
        fail_msg: "vault-prod-config.yml configures production's Vault; the dev tier has make vault-dev"
        quiet: true

    - name: Token to configure with (VAULT_TOKEN, else the root token in the owner's init file)
      ansible.builtin.set_fact:
        vault_token: >-
          {{ lookup('ansible.builtin.env', 'VAULT_TOKEN')
             | default((lookup('ansible.builtin.file', init_file) | from_json).root_token, true) }}
      no_log: true

    - name: Which token this run holds (root at first configuration, the owner's lab-admin login after)
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/token/lookup-self"
        ca_path: "{{ playbook_dir }}/../../docs/lab-root-ca.crt"
        headers: {X-Vault-Token: "{{ vault_token }}"}
      register: vault_self
      no_log: true

    - name: Root or not
      ansible.builtin.set_fact:
        vault_token_is_root: "{{ 'root' in vault_self.json.data.policies }}"

    - name: Where each role may be used from
      ansible.builtin.debug:
        msg: "{{ vault_role_cidrs }}"

    - name: Configure it
      ansible.builtin.include_tasks: tasks/vault-config.yml

    # --- the owner's administrator login (versions.yaml vault.prod.admin), least privilege ---------------------
    # Vault 2.0 requires a token for generate-root, so this login is the admin path once the root token is revoked.
    # It can do the lab's admin jobs and nothing else: issue and destroy the readers' secret IDs, manage the reader
    # roles and their policies (not its own), the lab/ secrets, snapshots, and short-lived tokens carrying a reader
    # policy through one token role (the verify's policy check). It cannot seal Vault, change auth methods or mounts,
    # or widen itself. The play makes the mount, the policy and the token role; the owner sets the password.
    - name: Auth methods now (for the owner's login)
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/auth"
        ca_path: "{{ playbook_dir }}/../../docs/lab-root-ca.crt"
        headers: {X-Vault-Token: "{{ vault_token }}"}
      register: vault_auths
      no_log: true

    - name: Userpass auth for the owner at {{ vault.prod.admin.auth_mount }}
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/auth/{{ vault.prod.admin.auth_mount }}"
        ca_path: "{{ playbook_dir }}/../../docs/lab-root-ca.crt"
        method: POST
        headers: {X-Vault-Token: "{{ vault_token }}"}
        body_format: json
        body: {type: userpass, description: "the owner's administrator login (ADR 0065)"}
        status_code: [204]
      when: vault_token_is_root and (vault.prod.admin.auth_mount ~ '/') not in vault_auths.json.data
      changed_when: true
      no_log: true

    - name: Token role for the verify's short-lived reader tokens
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/token/roles/verify-readers"
        ca_path: "{{ playbook_dir }}/../../docs/lab-root-ca.crt"
        method: POST
        headers: {X-Vault-Token: "{{ vault_token }}"}
        body_format: json
        body:
          allowed_policies: "{{ vault.approles.keys() | list }}"
          orphan: true
          renewable: false
          token_explicit_max_ttl: 120
        status_code: [204]
      changed_when: false
      when: vault_token_is_root
      no_log: true

    - name: Least-privilege administrator policy {{ vault.prod.admin.policy }}
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/policies/acl/{{ vault.prod.admin.policy }}"
        ca_path: "{{ playbook_dir }}/../../docs/lab-root-ca.crt"
        method: PUT
        headers: {X-Vault-Token: "{{ vault_token }}"}
        body_format: json
        body:
          policy: |
            # the owner's administrator login (ADR 0065): the lab's admin jobs only
            path "auth/{{ vault.approle_mount }}/role/+/role-id" { capabilities = ["read"] }
            path "auth/{{ vault.approle_mount }}/role/+/secret-id" { capabilities = ["create", "update", "list"] }
            path "auth/{{ vault.approle_mount }}/role/+/secret-id/lookup" { capabilities = ["update"] }
            path "auth/{{ vault.approle_mount }}/role/+/secret-id-accessor/lookup" { capabilities = ["update"] }
            path "auth/{{ vault.approle_mount }}/role/+/secret-id-accessor/destroy" { capabilities = ["update"] }
            path "auth/{{ vault.approle_mount }}/role/*" { capabilities = ["create", "read", "update", "list"] }
            path "auth/{{ vault.approle_mount }}/role" { capabilities = ["list"] }
            path "sys/policies/acl/itential-*" { capabilities = ["create", "read", "update", "delete", "list"] }
            path "sys/policies/acl" { capabilities = ["list"] }
            path "{{ vault.kv_mount }}/*" { capabilities = ["create", "read", "update", "patch", "delete", "list"] }
            path "sys/storage/raft/snapshot" { capabilities = ["read"] }
            path "sys/mounts" { capabilities = ["read"] }
            path "sys/auth" { capabilities = ["read"] }
            path "auth/token/create/verify-readers" { capabilities = ["update"] }
        status_code: [204]
      changed_when: false
      when: vault_token_is_root
      no_log: true

    # --- prove the binding on the real path -------------------------------------------------------------------------
    - name: One-use, five-minute secret IDs to test each reader host, and one per role for this workstation
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/{{ vault.approle_mount }}/role/{{ item.role }}/secret-id"
        ca_path: "{{ playbook_dir }}/../../docs/lab-root-ca.crt"
        method: POST
        headers: {X-Vault-Token: "{{ vault_token }}"}
        body_format: json
        body: {ttl: 300, num_uses: 1, metadata: '{"issued_by": "vault-prod-config.yml binding test"}'}
      loop: "{{ binding_plan }}"
      loop_control:
        label: "{{ item.role }} for {{ item.host }}"
      register: test_ids
      no_log: true

    - name: Test credentials per host
      ansible.builtin.set_fact:
        binding_tests: >-
          {{ test_ids.results | map(attribute='item') | zip(test_ids.results | map(attribute='json.data'))
             | map('combine') | list }}
      no_log: true

    - name: A login from this workstation is refused for every role
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/{{ vault.approle_mount }}/login"
        ca_path: "{{ playbook_dir }}/../../docs/lab-root-ca.crt"
        method: POST
        body_format: json
        body: {role_id: "{{ vault_role_ids[item.role] }}", secret_id: "{{ item.secret_id }}"}
        status_code: [400, 403]
      loop: "{{ binding_tests | selectattr('host', 'equalto', 'workstation') | list }}"
      loop_control:
        label: "{{ item.role }} from this workstation"
      no_log: true

    - name: The reader hosts versions.yaml names, for the next play
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: vault_readers
      loop: "{{ vault.approles.values() | map(attribute='bound_hosts') | flatten | unique }}"

    - name: The workstation's test secret IDs destroyed
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/{{ vault.approle_mount }}/role/{{ item.role }}/secret-id-accessor/destroy"
        ca_path: "{{ playbook_dir }}/../../docs/lab-root-ca.crt"
        method: POST
        headers: {X-Vault-Token: "{{ vault_token }}"}
        body_format: json
        body: {secret_id_accessor: "{{ item.secret_id_accessor }}"}
        status_code: [204, 500]
      loop: "{{ binding_tests | selectattr('host', 'equalto', 'workstation') | list }}"
      loop_control:
        label: "{{ item.role }}"
      register: ws_destroy
      # A refused login still spends a one-use secret ID (measured 2026-09-24), and Vault answers a destroy of a spent
      # one with 500 "failed to find accessor entry". That is the outcome wanted; any other 500 is a failure.
      failed_when: >-
        ws_destroy.status == 500 and 'failed to find accessor entry' not in (ws_destroy.json.errors | default([]) | join(' '))
      no_log: true

- name: Each reader host can log in to its role
  hosts: vault_readers
  gather_facts: false
  vars_files:
    - ../../itential/versions.yaml
  vars:
    tests: "{{ hostvars['localhost'].binding_tests | selectattr('host', 'equalto', inventory_hostname) | list }}"
    vault_addr: "{{ vault.prod.url }}"
    role_ids: "{{ hostvars['localhost'].vault_role_ids }}"
  tasks:
    - name: Login from {{ inventory_hostname }}
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/{{ vault.approle_mount }}/login"
        validate_certs: true
        ca_path: /usr/local/share/ca-certificates/lab-root-ca.crt
        method: POST
        body_format: json
        body: {role_id: "{{ role_ids[item.role] }}", secret_id: "{{ item.secret_id }}"}
        status_code: [200]
      loop: "{{ tests }}"
      loop_control:
        label: "{{ item.role }} from {{ inventory_hostname }}"
      register: host_login
      no_log: true

    - name: Accepted, with the token bound to this host's address
      ansible.builtin.debug:
        msg: "{{ item.item.role }} login from {{ inventory_hostname }}: accepted (the one-use secret ID is now spent)"
      loop: "{{ host_login.results }}"
      loop_control:
        label: "{{ item.item.role }}"

    # ADR 0068 P6, on the real path: the PSK writer's token may create and update the PSK and never read it, and the
    # Gateway's read-only token may read it. Asked of Vault with each role's own token (sys/capabilities-self), so
    # nothing is written and no PSK is needed.
    - name: What each token may do with the PSK path, {{ vault.kv_mount ~ '/data/' ~ vault.aws.psk_path }}
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/sys/capabilities-self"
        ca_path: /usr/local/share/ca-certificates/lab-root-ca.crt
        method: POST
        headers: {X-Vault-Token: "{{ item.json.auth.client_token }}"}
        body_format: json
        body: {paths: ["{{ vault.kv_mount }}/data/{{ vault.aws.psk_path }}"]}
      loop: "{{ host_login.results | selectattr('item.role', 'in', psk_roles) | list }}"
      loop_control:
        label: "{{ item.item.role }}"
      vars:
        psk_roles: [itential-aws-psk-writer, itential-gateway]
      register: psk_caps
      no_log: true

    # The registered results hold the login tokens and the test secret IDs, so they are reduced to (role, capabilities)
    # out of sight first: a task that loops over the raw results prints each whole result, tokens included
    # (measured on production 2026-09-29 - those tokens were revoked by the next task, but never again).
    - name: Each role's capabilities on the PSK path, nothing else
      ansible.builtin.set_fact:
        psk_caps_seen: >-
          {{ psk_caps.results | map(attribute='item.item.role')
             | zip(psk_caps.results | map(attribute='json.capabilities')) | list }}
      no_log: true

    - name: The writer creates and updates only, the Gateway reads only
      ansible.builtin.assert:
        that: (item.1 | sort) == want[item.0]
        fail_msg: "{{ item.0 }} may {{ item.1 }} on the PSK path, want {{ want[item.0] }}"
        success_msg: "{{ item.0 }} may {{ item.1 }} on the PSK path"
      loop: "{{ psk_caps_seen }}"
      loop_control:
        label: "{{ item.0 }}"
      vars:
        want:
          itential-aws-psk-writer: [create, update]
          itential-gateway: [read]

    - name: The test logins' tokens revoked
      ansible.builtin.uri:
        url: "{{ vault_addr }}/v1/auth/token/revoke-self"
        ca_path: /usr/local/share/ca-certificates/lab-root-ca.crt
        method: POST
        headers: {X-Vault-Token: "{{ item.json.auth.client_token }}"}
        status_code: [204]
      loop: "{{ host_login.results }}"
      loop_control:
        label: "{{ item.item.role }}"
      changed_when: false
      no_log: true
