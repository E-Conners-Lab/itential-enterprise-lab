---
# Register the VMs this repo creates as NetBox virtual machines (ADR 0002: NetBox is the
# inventory; Ansible reads it back through inventory/netbox.yml). Idempotent, create/update only.
- name: Register lab VMs in NetBox
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../topology/ipam.yaml
    - ../../k8s/platform/versions.yaml
  vars:
    ansible_python_interpreter: "{{ playbook_dir }}/../../.venv/bin/python"
    nb:
      netbox_url: "{{ lookup('ansible.builtin.env', 'NETBOX_URL') }}"
      netbox_token: "{{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"
    vms:
      - {name: oob-gw, vcpus: 1, memory: 1024, disk: 16, role: oob-gateway, ips: [10.100.0.1], tags: [phase-2]}
      - {name: k3s-01, vcpus: 4, memory: 12288, disk: 80, role: k3s-server, ips: [10.100.0.16], tags: [phase-3, k3s]}
      - {name: k3s-02, vcpus: 4, memory: 12288, disk: 80, role: k3s-server, ips: [10.100.0.17], tags: [phase-3, k3s]}
      - {name: k3s-03, vcpus: 4, memory: 12288, disk: 80, role: k3s-server, ips: [10.100.0.18], tags: [phase-3, k3s]}
  tasks:
    - name: Site
      netbox.netbox.netbox_site:
        netbox_url: "{{ nb.netbox_url }}"
        netbox_token: "{{ nb.netbox_token }}"
        validate_certs: false
        data: {name: homelab, slug: homelab, status: active, description: "Dell R640, Proxmox VE 9.2"}

    - name: Cluster type and cluster
      netbox.netbox.netbox_cluster_type:
        netbox_url: "{{ nb.netbox_url }}"
        netbox_token: "{{ nb.netbox_token }}"
        validate_certs: false
        data: {name: Proxmox VE, slug: proxmox-ve}

    - name: Cluster homelab
      netbox.netbox.netbox_cluster:
        netbox_url: "{{ nb.netbox_url }}"
        netbox_token: "{{ nb.netbox_token }}"
        validate_certs: false
        data: {name: homelab, cluster_type: proxmox-ve, site: homelab, status: active}

    - name: Tags used as inventory groups
      netbox.netbox.netbox_tag:
        netbox_url: "{{ nb.netbox_url }}"
        netbox_token: "{{ nb.netbox_token }}"
        validate_certs: false
        data: {name: "{{ item }}", slug: "{{ item }}"}
      loop: [k3s, phase-3, oob-gateway, k3s-server]

    - name: Device roles for VMs
      netbox.netbox.netbox_device_role:
        netbox_url: "{{ nb.netbox_url }}"
        netbox_token: "{{ nb.netbox_token }}"
        validate_certs: false
        data: {name: "{{ item }}", slug: "{{ item }}", vm_role: true, color: "2196f3"}
      loop: "{{ vms | map(attribute='role') | unique | list }}"

    - name: Platform ubuntu-24.04
      netbox.netbox.netbox_platform:
        netbox_url: "{{ nb.netbox_url }}"
        netbox_token: "{{ nb.netbox_token }}"
        validate_certs: false
        data: {name: ubuntu-24.04, slug: ubuntu-24-04}

    - name: Virtual machines
      netbox.netbox.netbox_virtual_machine:
        netbox_url: "{{ nb.netbox_url }}"
        netbox_token: "{{ nb.netbox_token }}"
        validate_certs: false
        data:
          name: "{{ item.name }}"
          cluster: homelab
          site: homelab
          status: active
          vcpus: "{{ item.vcpus }}"
          memory: "{{ item.memory }}"
          disk: "{{ item.disk }}"
          virtual_machine_role: "{{ item.role }}"
          platform: ubuntu-24.04
          tags: "{{ item.tags + [item.role] }}"
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: VM interfaces (eth0 on vmbr1)
      netbox.netbox.netbox_vm_interface:
        netbox_url: "{{ nb.netbox_url }}"
        netbox_token: "{{ nb.netbox_token }}"
        validate_certs: false
        data: {virtual_machine: "{{ item.name }}", name: eth0, enabled: true, description: vmbr1}
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assign the OOB address to eth0 and make it primary
      netbox.netbox.netbox_ip_address:
        netbox_url: "{{ nb.netbox_url }}"
        netbox_token: "{{ nb.netbox_token }}"
        validate_certs: false
        data:
          address: "{{ item.ips[0] }}/24"
          assigned_object: {virtual_machine: "{{ item.name }}", name: eth0}
          primary_ip4: true
      loop: "{{ vms }}"
      loop_control:
        label: "{{ item.name }} {{ item.ips[0] }}"
