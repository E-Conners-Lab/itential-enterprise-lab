---
# Phase 8, slice E (PID S11, ADR 0053/0055): the tools VM. Neither the MCP server, the in-lab Ollama nor the
# directory is an Itential Platform component, so the guide's "one component per server" rule moves them off
# the Platform nodes onto tools-01. It runs before platform-ha2-identity.yml, which needs the directory, and
# therefore before platform-ha2-gateway.yml, whose Gateway Manager calls need the directory account.
# ADR 0083 decision 6: the MCP server's certificate, from the lab CA on k3s (ClusterIssuer lab-ca) as
# platform-ha2-hosts.yml issues the Platform's: tools-01's own name, its aliases (mcp.lab.internal) and its address.
- name: The MCP server's certificate from the lab CA
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../itential/ha2/versions.yaml
    - ../../topology/ipam.yaml
  vars:
    ansible_python_interpreter: "{{ playbook_dir }}/../../.venv/bin/python"
    kubeconfig: >-
      {{ lookup('ansible.builtin.env', 'KUBECONFIG_PATH')
         | default(lookup('ansible.builtin.env', 'HOME') ~ '/.kube/lab-k3s.yaml', true) }}
    tools_vm: "{{ vms | selectattr('role', 'equalto', 'tools') | first }}"
    tools_row: "{{ addresses | selectattr('hostname', 'equalto', tools_vm.name) | first }}"
    mcp_dns: "{{ [tools_vm.name ~ '.' ~ domain] + (tools_row.aliases | default([]) | map('regex_replace', '$', '.' ~ domain) | list) }}"
  tasks:
    - name: Namespace itential-ha2 (holds the production hosts' certificates)
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition: {apiVersion: v1, kind: Namespace, metadata: {name: itential-ha2}}

    - name: Certificate for the MCP server, from ClusterIssuer lab-ca
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: cert-manager.io/v1
          kind: Certificate
          metadata: {name: "{{ tools_vm.name }}", namespace: itential-ha2}
          spec:
            secretName: "{{ tools_vm.name }}-tls"
            duration: 8760h # one year; this play copies the renewed one and restarts the server
            renewBefore: 720h
            commonName: "{{ mcp_dns[-1] }}"
            dnsNames: "{{ mcp_dns }}"
            ipAddresses: ["{{ tools_vm.ip }}"]
            usages: [server auth, digital signature, key encipherment]
            issuerRef: {name: lab-ca, kind: ClusterIssuer}
        wait: true
        wait_condition: {type: Ready, status: "True"}
        wait_timeout: 180

    - name: The issued secret
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig }}"
        kind: Secret
        namespace: itential-ha2
        name: "{{ tools_vm.name }}-tls"
      register: mcp_tls_secret
      failed_when: mcp_tls_secret.resources | default([]) | length != 1
      no_log: true

    - name: Hand the PEMs to the tools play
      ansible.builtin.set_fact:
        mcp_tls:
          cert: "{{ mcp_tls_secret.resources[0].data['tls.crt'] | b64decode }}"
          key: "{{ mcp_tls_secret.resources[0].data['tls.key'] | b64decode }}"
          ca: "{{ mcp_tls_secret.resources[0].data['ca.crt'] | b64decode }}"
      no_log: true

- name: The tools VM (MCP, Ollama and the directory)
  hosts: ha2-tools
  become: true
  gather_facts: false
  vars_files:
    - ../../itential/ha2/versions.yaml
    - ../../itential/versions.yaml
  vars:
    ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null
    dir: /opt/itential
    ip: "{{ (vms | selectattr('name', 'equalto', inventory_hostname) | first).ip }}"
    # the load balancer's own name: the service name still points at the dev-stack until the cut-over
    service_name: "{{ (vms | selectattr('role', 'equalto', 'loadbalancer') | first).name }}"
    # R7 (ADR 0076 decision 1): who may reach Batfish's unauthenticated API - the Gateway VM, whose runner asks
    batfish_allow: "{{ vms | selectattr('role', 'equalto', 'gateway') | map(attribute='ip') | list }}"
    # ADR 0083: who may reach the MCP server - the client machines in versions.yaml tools.mcp_allow
    mcp_allow: "{{ tools.mcp_allow }}"
    env_file: "{{ playbook_dir }}/../../.env"
    # the name every client uses (.mcp.json); the certificate carries it
    mcp_url: "https://mcp.{{ domain }}:{{ tools.mcp_port }}/mcp"
    mcp_initialize:
      jsonrpc: "2.0"
      id: 1
      method: initialize
      params: {protocolVersion: "2025-03-26", capabilities: {}, clientInfo: {name: platform-ha2-tools.yml, version: "1"}}
  tasks:
    - name: Compose file
      ansible.builtin.template:
        src: ../../itential/ha2/tools.compose.yml.j2
        dest: "{{ dir }}/docker-compose.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Lab CA for the containers
      ansible.builtin.file:
        path: "{{ dir }}/tls"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: CA certificate (this VM terminates no TLS, so the host play left it none)
      ansible.builtin.copy:
        src: ../../docs/lab-root-ca.crt
        dest: "{{ dir }}/tls/ca.crt"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    # the container runs as root (its image sets no user), so the key is root's and no one else's on the VM
    - name: The MCP server's certificate and key (ADR 0083 decision 6)
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ dir }}/tls/{{ item.name }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
      loop:
        - {name: mcp.crt, content: "{{ pem.cert }}{{ pem.ca }}", mode: "0644"}
        - {name: mcp.key, content: "{{ pem.key }}", mode: "0600"}
      loop_control:
        label: "{{ item.name }}"
      vars:
        pem: "{{ hostvars['localhost'].mcp_tls }}"
      register: mcp_tls_files
      no_log: true

    - name: Break-glass override beside the compose file (ADR 0083 decision 7; used only by hand)
      ansible.builtin.copy:
        src: ../../itential/ha2/tools.compose.breakglass.yml
        dest: "{{ dir }}/docker-compose.breakglass.yml"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Directory bootstrap directory
      ansible.builtin.file:
        path: "{{ dir }}/ldap"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: OpenLDAP bootstrap (admin@itential and the admins group, the same upstream LDIF the dev-stack uses)
      ansible.builtin.copy:
        src: "../../{{ ldap.ldif }}"
        dest: "{{ dir }}/ldap/openldap.ldif"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    # ADR 0083: the MCP server logs in as svc-mcp. On a fresh build this play runs before the replay makes the account,
    # so the password is generated here when none exists and persisted to .env before anything uses it; the replay's
    # tasks/ldap-service-account.yml then reads the same value (lab-build-lessons: persist before use).
    - name: The svc-mcp password (the environment, else .env, else a new one)
      ansible.builtin.set_fact:
        mcp_pw: >-
          {{ lookup('ansible.builtin.env', mcp_access.password_env)
             | default((lookup('ansible.builtin.file', env_file, errors='ignore') | default('', true)
                        | regex_findall('^' ~ mcp_access.password_env ~ '=([A-Za-z0-9]+)', multiline=True) or [''])[0], true)
             | default(lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']), true) }}
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true

    - name: The svc-mcp password persisted to .env before use
      ansible.builtin.lineinfile:
        path: "{{ env_file }}"
        regexp: "^{{ mcp_access.password_env }}="
        line: "{{ mcp_access.password_env }}={{ mcp_pw }}"
        create: false
      delegate_to: localhost
      become: false
      run_once: true
      no_log: true

    - name: Environment for compose
      ansible.builtin.copy:
        dest: "{{ dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
        content: |
          # Rendered by ansible/playbooks/platform-ha2-tools.yml; do not edit.
          ITENTIAL_ADMIN_USER={{ platform.admin_user }}
          ITENTIAL_ADMIN_PASSWORD={{ lookup('ansible.builtin.env', 'ITENTIAL_ADMIN_PASSWORD') }}
          SVC_MCP_PASSWORD={{ mcp_pw }}
      no_log: true

    - name: Containers up
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ dir }}"
      register: up
      changed_when: "'Started' in up.stderr or 'Created' in up.stderr or 'Recreated' in up.stderr"

    # compose recreates the container when its own definition changes, not when a mounted file does
    - name: MCP restarted for a new certificate
      ansible.builtin.command:
        cmd: docker compose restart mcp
        chdir: "{{ dir }}"
      when: mcp_tls_files is changed
      changed_when: true

    # ADR 0060 moved every local model to the Mac Mini: tools-01 has no GPU and its Ollama ran at
    # 91% of a 6 GiB cap until llama-server crashed mid-verify. Nothing to pull here any more; the
    # model lives on the Mac and flowai.yml asserts it is present before touching an agent.
    - name: No Ollama container is left on tools-01
      ansible.builtin.command:
        cmd: docker rm -f ollama
      register: ollama_gone
      # `docker rm -f` exits 0 with or without the container; it prints the name only when it removed one (measured on
      # the dev host 2026-10-01), so only that counts as a change
      changed_when: ollama_gone.rc == 0 and ollama_gone.stdout | trim == 'ollama'
      failed_when: false

    # R7 (ADR 0076 decision 1): Batfish answers anyone who can reach port 9996, so only the Gateway VM may. Persisted
    # as a script plus a unit bound to docker.service, because Docker rebuilds its FORWARD chains on every start
    # (the clab host's pattern, ADR 0063).
    - name: DOCKER-USER allowlist for Batfish (itential/ha2/batfish-access.sh.j2)
      ansible.builtin.template:
        src: ../../itential/ha2/batfish-access.sh.j2
        dest: /usr/local/sbin/batfish-access.sh
        mode: "0755"
      register: batfish_script

    - name: Unit that re-applies the Batfish allowlist whenever Docker starts
      ansible.builtin.copy:
        dest: /etc/systemd/system/batfish-access.service
        mode: "0644"
        content: |
          [Unit]
          Description=DOCKER-USER allowlist for Batfish on the tools VM (ADR 0076)
          After=docker.service
          Requires=docker.service
          PartOf=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=true
          ExecStart=/usr/local/sbin/batfish-access.sh

          [Install]
          WantedBy=docker.service
      register: batfish_unit

    - name: Batfish allowlist unit enabled and applied now
      ansible.builtin.systemd:
        name: batfish-access
        enabled: true
        state: "{{ 'restarted' if (batfish_script is changed or batfish_unit is changed) else 'started' }}"
        daemon_reload: "{{ batfish_unit is changed }}"

    - name: The Batfish allowlist is live (jump first in DOCKER-USER, one ACCEPT per allowed source)
      ansible.builtin.command: iptables -w -S TOOLS-BATFISH
      register: batfish_rules
      changed_when: false
      # No backreference: inside a conditional the Jinja string literal '\1' is not the group but a control
      # character, so the old form failed on a correct chain (first production run, 2026-10-09). The expected
      # lines are built from the allowlist instead and compared whole, in order.
      failed_when: >-
        (batfish_rules.stdout_lines | select('search', ' -s .* -j ACCEPT') | list)
        != (batfish_allow | map('regex_replace', '^', '-A TOOLS-BATFISH -s ')
            | map('regex_replace', '$', '/32 -j ACCEPT') | list)

    # ADR 0083: the MCP server's port admits only tools.mcp_allow, the same mechanism as Batfish's above (a script plus
    # a unit bound to docker.service, which rebuilds its FORWARD chains on every start)
    - name: DOCKER-USER allowlist for the MCP server (itential/ha2/mcp-access.sh.j2)
      ansible.builtin.template:
        src: ../../itential/ha2/mcp-access.sh.j2
        dest: /usr/local/sbin/mcp-access.sh
        mode: "0755"
      register: mcp_script

    - name: Unit that re-applies the MCP allowlist whenever Docker starts
      ansible.builtin.copy:
        dest: /etc/systemd/system/mcp-access.service
        mode: "0644"
        content: |
          [Unit]
          Description=DOCKER-USER allowlist for the MCP server on the tools VM (ADR 0083)
          After=docker.service
          Requires=docker.service
          PartOf=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=true
          ExecStart=/usr/local/sbin/mcp-access.sh

          [Install]
          WantedBy=docker.service
      register: mcp_unit

    - name: MCP allowlist unit enabled and applied now
      ansible.builtin.systemd:
        name: mcp-access
        enabled: true
        state: "{{ 'restarted' if (mcp_script is changed or mcp_unit is changed) else 'started' }}"
        daemon_reload: "{{ mcp_unit is changed }}"

    # Both halves are read: the chain's rules alone would still look right with DOCKER-USER flushed or the jump gone
    - name: The MCP allowlist's rules (one ACCEPT per allowed source, then DROP) and DOCKER-USER's jump to them
      ansible.builtin.command: "iptables -w -S {{ item }}"
      loop: [TOOLS-MCP, DOCKER-USER]
      register: mcp_rules
      changed_when: false

    - name: The MCP allowlist is live (DOCKER-USER sends port 8000 to it exactly once; it admits only tools.mcp_allow)
      ansible.builtin.assert:
        that:
          - (chain | select('search', ' -s .* -j ACCEPT') | list) == want
          - (chain | last) == '-A TOOLS-MCP -j DROP'
          - (user | select('equalto', '-A DOCKER-USER -p tcp -m tcp --dport 8000 -j TOOLS-MCP') | list | length) == 1
        fail_msg: "TOOLS-MCP: {{ chain }}; DOCKER-USER: {{ user }}"
        quiet: true
      vars:
        chain: "{{ mcp_rules.results[0].stdout_lines }}"
        user: "{{ mcp_rules.results[1].stdout_lines }}"
        want: "{{ mcp_allow | map('regex_replace', '^', '-A TOOLS-MCP -s ') | map('regex_replace', '$', ' -j ACCEPT') | list }}"

    - name: Batfish answers (its v2 API lists the networks it holds; from this VM the allowlist does not apply)
      ansible.builtin.uri:
        url: "http://{{ ip }}:{{ tools.batfish_port }}/v2/networks"
        method: GET
        status_code: [200]
      register: batfish_up
      retries: 30
      delay: 5
      until: batfish_up.status is defined and batfish_up.status == 200

    - name: MCP answers over TLS, with the lab CA (its health route)
      ansible.builtin.uri:
        url: "https://{{ ip }}:{{ tools.mcp_port }}/status/healthz"
        ca_path: "{{ dir }}/tls/ca.crt"
        status_code: [200, 401]
      register: mcp
      retries: 20
      delay: 5
      until: mcp.status is defined and mcp.status in [200, 401]

    # ADR 0083 decision 5 on the real path, from this Mac (in tools.mcp_allow), the way Claude Code calls it
    - name: MCP refuses an initialize without a token
      ansible.builtin.uri:
        url: "{{ mcp_url }}"
        ca_path: "{{ playbook_dir }}/../../docs/lab-root-ca.crt"
        method: POST
        headers: {Accept: "application/json, text/event-stream"}
        body_format: json
        body: "{{ mcp_initialize }}"
        status_code: [401]
      delegate_to: localhost
      become: false

    - name: A token from this Mac's own Vault login (scripts/mcp-client.sh token, Claude Code's headersHelper)
      ansible.builtin.command:
        cmd: "{{ playbook_dir }}/../../scripts/mcp-client.sh token"
      delegate_to: localhost
      become: false
      register: mcp_headers
      changed_when: false
      failed_when: false
      no_log: true

    # the script never writes the token to stderr, so its message can be shown
    - name: This Mac holds a working MCP login
      ansible.builtin.assert:
        that: mcp_headers.rc == 0
        fail_msg: "{{ mcp_headers.stderr }} (enrol this Mac: make mcp-enrol NAME=mac-mini)"
        quiet: true

    - name: MCP answers an initialize with that token
      ansible.builtin.uri:
        url: "{{ mcp_url }}"
        ca_path: "{{ playbook_dir }}/../../docs/lab-root-ca.crt"
        method: POST
        headers: "{{ mcp_headers.stdout | from_json | combine({'Accept': 'application/json, text/event-stream'}) }}"
        body_format: json
        body: "{{ mcp_initialize }}"
        status_code: [200]
      delegate_to: localhost
      become: false
      no_log: true
