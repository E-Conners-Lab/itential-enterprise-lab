---
# Phase 7 (PID S7.1, ADR 0051 decision 6; Zabbix removed by ADR 0071): an rsyslog forward (RFC 5424 over TCP to
# the Alloy receiver on the loki VIP) on every Ubuntu machine, and the Zabbix agent 2 the play used to install
# removed. Inventory: the NetBox VMs and the Ubuntu EVE-NG endpoints (-i inventory/netbox.yml) plus the two
# pre-existing machines the phase-2 inventory knows (-i inventory/phase2.yml: eve-ng, netbox-vm). Idempotent.
- name: Syslog forwarding on every Ubuntu machine, and no Zabbix agent
  # ADR 0063: the sandbox VMs (NetBox roles itential-host, clab-host) are not monitored, so they are left alone
  hosts: ubuntu-24-04:ubuntu-22-04:eve:netbox:!itential-host:!clab-host
  become: true
  gather_facts: false
  vars_files:
    - ../../k8s/observability/versions.yaml # vips.loki, the syslog receiver
  vars:
    # EVE-NG guests are re-cloned from the golden image (fresh host keys); lab-only relaxation, as lab-endpoints.yml
    ansible_ssh_common_args: -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null
  pre_tasks:
    # The EVE-NG endpoints (NetBox devices with role server/client) carry the golden image's automation user;
    # the Proxmox VMs log in as ubuntu (nb_inventory compose) and the phase-2 hosts as their inventory says.
    - name: Automation user on the EVE-NG endpoints
      ansible.builtin.set_fact:
        ansible_user: automation
      when: "'server' in group_names or 'client' in group_names"
  tasks:
    # --- the Zabbix agent removed (ADR 0071): released from its hold, purged with its configuration and the
    # zabbix-release package that added the repository (purging that package removes the repository file) ---
    - name: Zabbix agent 2 released from its hold
      ansible.builtin.dpkg_selections:
        name: zabbix-agent2
        selection: install
      failed_when: false # absent already: nothing held

    - name: Zabbix agent 2 and the Zabbix repository package purged
      ansible.builtin.apt:
        name: [zabbix-agent2, zabbix-release]
        state: absent
        purge: true

    - name: Zabbix agent configuration and the cached release package gone
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: [/etc/zabbix, /var/cache/apt/zabbix-release_latest_7.0+ubuntu24.04_all.deb,
             /var/cache/apt/zabbix-release_latest_7.0+ubuntu22.04_all.deb]

    - name: Rsyslog
      ansible.builtin.apt:
        name: rsyslog

    - name: Rsyslog forward to the Alloy receiver (RFC 5424 over TCP)
      ansible.builtin.copy:
        dest: /etc/rsyslog.d/60-loki.conf
        mode: "0644"
        content: |
          # ansible/playbooks/observability-hosts.yml (ADR 0051): every message to the lab's syslog receiver.
          action(type="omfwd" target="{{ vips.loki }}" port="514" protocol="tcp"
                 template="RSYSLOG_SyslogProtocol23Format"
                 action.resumeRetryCount="-1" queue.type="LinkedList" queue.size="10000")
      notify: Restart rsyslog

    - name: Rsyslog enabled and running
      ansible.builtin.service:
        name: rsyslog
        state: started
        enabled: true
  handlers:
    - name: Restart rsyslog
      ansible.builtin.service:
        name: rsyslog
        state: restarted
