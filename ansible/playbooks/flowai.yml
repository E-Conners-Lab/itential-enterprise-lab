---
# Phase 6: FlowAI agents over the lab topology (PID S4c, ADR 0037). Runs after itential.yml.
# Order: in-lab Ollama + pinned model -> Model Registry provider profiles (keys from .env, stored
# write-only) -> tool discovery -> agent project and agents from itential/agents/*.yaml.
# Everything is created through the API; re-runs update in place.
- name: FlowAI on the itential VM
  hosts: "{{ platform_target | default('itential-host') }}"
  become: true
  gather_facts: false
  vars_files:
    - ../../itential/versions.yaml
  vars:
    stack_dir: /opt/itential
    profiles: "{{ stack.profiles | map('regex_replace', '^', '--profile ') | join(' ') }}"
    compose: "docker compose -f docker-compose.yml -f compose.override.yml {{ profiles }}"
    platform_local: "{{ platform_api | default('http://127.0.0.1:3000') }}"
    tool_registry_base: tools # app-tool_registry mounts under its pronghorn title
    admin_user: >-
      {{ platform_admin_user | default(lookup('ansible.builtin.env', 'ITENTIAL_ADMIN_USER')
         | default('admin@itential', true)) }}
    admin_pw: "{{ lookup('ansible.builtin.env', 'ITENTIAL_ADMIN_PASSWORD') }}"
    required_profiles: "{{ llm.profiles | rejectattr('optional', 'defined') | list }}"
    optional_profiles: "{{ llm.profiles | selectattr('optional', 'defined') | list }}"
    agent_docs: "{{ lookup('ansible.builtin.fileglob', playbook_dir ~ '/../../' ~ agents.documents ~ '/*.yaml', wantlist=True) | sort }}"
  tasks:
    # --- local models: not in the lab any more -----------------------------------------------
    # ADR 0060: every local model runs on the Mac Mini. The lab has no GPU, and tools-01's Ollama
    # container ran at 91% of a 6 GiB cap until llama-server crashed mid-verify. Nothing is started
    # here; the Model Registry reaches ollama.lab.internal, which unbound points at the Mac
    # (topology/ipam.yaml home_lan.inference_host). The compose file no longer defines the service.
    - name: Compose files current
      ansible.builtin.copy:
        src: "../../itential/{{ item }}"
        dest: "{{ stack_dir }}/{{ item }}"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      loop: [docker-compose.yml, compose.override.yml]

    - name: No Ollama container is left running on the Platform host
      ansible.builtin.command:
        cmd: docker rm -f ollama
      register: ollama_gone
      changed_when: ollama_gone.rc == 0
      failed_when: false

    # Optional endpoints (the owner's Mac) join only when they answer from the VM right now.
    # The Mac is required now, not optional (ADR 0060), so an unreachable one fails the play with a
    # message that names the cause instead of leaving six agents pointing at nothing. There is no
    # in-lab fallback by design: the owner chose to run no inference on the server.
    # Retried on purpose: the first connection after a DNS change or a cold Mac has been seen to
    # time out and then succeed immediately (measured twice, 2026-09-11). One attempt would turn a
    # warm-up into a failed play.
    - name: Every Ollama endpoint answers
      ansible.builtin.uri:
        url: "{{ item.base_url }}/api/tags"
        timeout: 10
      loop: "{{ required_profiles | selectattr('provider', 'equalto', 'ollama') | list }}"
      loop_control:
        label: "{{ item.name }} {{ item.base_url }}"
      register: ollama_probe
      until: ollama_probe.status | default(0) == 200
      retries: 5
      delay: 3
      failed_when: false

    - name: An unreachable inference host is the whole local fleet
      ansible.builtin.assert:
        that: "item.status | default(0) == 200"
        fail_msg: >-
          {{ item.item.name }} did not answer at {{ item.item.base_url }}.
          Inference runs on the Mac Mini (ADR 0060) and the lab keeps no fallback, so every
          ollama-mac agent is down until it answers. Check: the Mac is awake; `ollama serve` is
          running (scripts/mac-ollama.sh); the Homebrew ollama binary is allowed through the macOS
          firewall; and ollama.lab.internal still resolves to its address
          (topology/ipam.yaml home_lan.inference_host - the router reservation may have moved).
        success_msg: "{{ item.item.name }} answers at {{ item.item.base_url }}"
      loop: "{{ ollama_probe.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Profiles to manage this run
      ansible.builtin.set_fact:
        llm_profiles: "{{ required_profiles }}"

    - name: Pinned local models present on the inference host
      ansible.builtin.assert:
        that: "item.model in (probe.json.models | default([]) | map(attribute='name') | list)"
        fail_msg: >-
          {{ item.model }} is not on {{ item.base_url }}. Pull it on the Mac:
          `ollama pull {{ item.model }}` (scripts/mac-ollama.sh does it).
        success_msg: "{{ item.model }} present on {{ item.name }}"
      loop: "{{ required_profiles | selectattr('provider', 'equalto', 'ollama') | list }}"
      loop_control:
        label: "{{ item.model }}"
      vars:
        probe: "{{ ollama_probe.results | selectattr('item.name', 'equalto', item.name) | first }}"

    - name: Profiles this run
      ansible.builtin.debug:
        msg: "{{ llm_profiles | map(attribute='name') | list }}"

    - name: The FlowAI assets of phase 6 (shared with the production replay, ADR 0055)
      ansible.builtin.import_tasks: tasks/flowai-assets.yml
