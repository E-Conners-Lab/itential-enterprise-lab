---
# Phase 7 (ADR 0051 decision 7): the observability lines reach the running routers and switches only through
# wf-config-push-v1 with a Work Center approval (ADR 0040/0041). For every active C8000v/vEOS in NetBox the
# play renders the same snippet the startup config carries (eve/build.py snippet, plus the SNMPv3 user with
# its passphrases from .env), reads the running config from Configuration Manager, skips devices that already
# carry every non-secret line, and starts one push job for each of the others. It then waits for the jobs:
# the owner approves the cards in Work Center (the play never approves). Idempotent: a second run starts nothing.
- name: Observability lines on every router and switch through the governed push
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../itential/versions.yaml
  vars:
    ansible_python_interpreter: "{{ playbook_dir }}/../../.venv/bin/python"
    repo: "{{ playbook_dir }}/../.."
    ca_file: "{{ repo }}/docs/lab-root-ca.crt"
    platform_url: "https://{{ vm.ip }}"
    platform_host: itential.lab.internal
    admin_user: "{{ lookup('ansible.builtin.env', 'ITENTIAL_ADMIN_USER') | default('admin@itential', true) }}"
    admin_pw: "{{ lookup('ansible.builtin.env', 'ITENTIAL_ADMIN_PASSWORD') }}"
    netbox_url: "{{ lookup('ansible.builtin.env', 'NETBOX_URL') }}"
    netbox_headers: {Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"}
    push_workflow: "{{ workflows.config_push }}"
    wait_minutes: "{{ lookup('ansible.builtin.env', 'OBS_PUSH_WAIT_MINUTES') | default(120, true) }}"
  tasks:
    - name: SNMPv3 passphrases must be in .env (generated by observability.yml)
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'SNMPV3_AUTH_PASSWORD') | length >= 8
          - lookup('ansible.builtin.env', 'SNMPV3_PRIV_PASSWORD') | length >= 8
        quiet: true

    - name: Platform login (the certificate is the lab CA; the name resolves through oob-gw)
      ansible.builtin.uri:
        url: "https://{{ platform_host }}/login"
        method: POST
        body_format: json
        body: {username: "{{ admin_user }}", password: "{{ admin_pw }}"}
        ca_path: "{{ ca_file }}"
        return_content: true
      register: login
      no_log: true

    - name: Session cookie
      ansible.builtin.set_fact:
        cookie: "{{ login.cookies_string }}"
      no_log: true

    - name: NetBox active routers and switches
      ansible.builtin.uri:
        url: "{{ netbox_url }}/api/dcim/devices/?status=active&platform=ios-xe&platform=eos&limit=200"
        headers: "{{ netbox_headers }}"
      register: nb_devices

    - name: Device names
      ansible.builtin.set_fact:
        device_names: "{{ nb_devices.json.results | map(attribute='name') | sort }}"

    - name: Snippet per device (non-secret lines decide idempotency; the SNMPv3 user rides along)
      ansible.builtin.command:
        argv: ["{{ ansible_python_interpreter }}", "{{ repo }}/eve/build.py", snippet, --only, "{{ item }}", --with-snmpv3]
      environment:
        SNMPV3_AUTH_PASSWORD: "{{ lookup('ansible.builtin.env', 'SNMPV3_AUTH_PASSWORD') }}"
        SNMPV3_PRIV_PASSWORD: "{{ lookup('ansible.builtin.env', 'SNMPV3_PRIV_PASSWORD') }}"
      loop: "{{ device_names }}"
      register: snippets
      changed_when: false
      no_log: true

    - name: Running configuration from Configuration Manager
      ansible.builtin.uri:
        url: "https://{{ platform_host }}/configuration_manager/devices/{{ item }}/configuration"
        headers: {Cookie: "{{ cookie }}"}
        ca_path: "{{ ca_file }}"
        timeout: 120
      loop: "{{ device_names }}"
      register: running
      no_log: true

    # A card may still be waiting from an earlier run (the play waits at most wait_minutes): never start a second
    # job for a device whose phase-7 push is still running. The jobs API ignores its status filter (measured), so
    # the status is checked here.
    - name: Recent jobs
      ansible.builtin.uri:
        url: "https://{{ platform_host }}/operations-manager/jobs?limit=100"
        headers: {Cookie: "{{ cookie }}"}
        ca_path: "{{ ca_file }}"
      register: recent_jobs

    - name: Devices with a push job still running (card waiting in Work Center)
      ansible.builtin.set_fact:
        already_waiting: >-
          {{ recent_jobs.json.data | selectattr('name', 'equalto', push_workflow) | selectattr('status', 'equalto', 'running')
             | map(attribute='description') | select('defined') | select('match', '^phase 7 observability lines for ')
             | map('regex_replace', '^phase 7 observability lines for (\S+).*$', '\1') | list }}

    - name: Devices whose running config lacks a line of the snippet (and have no card waiting)
      ansible.builtin.set_fact:
        pending: >-
          {%- set out = [] -%}
          {%- for i in range(device_names | length) if device_names[i] not in already_waiting -%}
            {%- set cfg = running.results[i].json.config -%}
            {%- set want = snippets.results[i].stdout_lines | reject('match', '^\s*(!|snmp-server user .*)?$') | map('trim') | list -%}
            {%- set missing = want | reject('in', cfg | regex_findall('(?m)^\s*(.+?)\s*$')) | list -%}
            {%- if missing -%}
              {%- set _ = out.append({'name': device_names[i], 'missing': missing, 'config': snippets.results[i].stdout}) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}
      no_log: true

    - name: Devices whose push card is still waiting in Work Center
      ansible.builtin.debug:
        msg: "{{ already_waiting }}"

    - name: Devices already carrying the observability lines
      ansible.builtin.debug:
        msg: "{{ device_names | difference(pending | map(attribute='name') | list) | difference(already_waiting) }}"

    - name: Lines still missing per device
      ansible.builtin.debug:
        msg: "{{ pending | map(attribute='name') | zip(pending | map(attribute='missing')) | list }}"

    - name: Start one wf-config-push-v1 job per device that needs the lines
      ansible.builtin.uri:
        url: "https://{{ platform_host }}/operations-manager/jobs/start"
        method: POST
        headers: {Cookie: "{{ cookie }}"}
        body_format: json
        body:
          workflow: "{{ push_workflow }}"
          options:
            type: automation
            description: "phase 7 observability lines for {{ item.name }} (ADR 0051)"
            variables:
              device: "{{ item.name }}"
              config: "{{ item.config }}"
              reason: "observability-devices.yml: SNMPv3 view/group/user, syslog, gNMI (ADR 0051)"
        ca_path: "{{ ca_file }}"
      loop: "{{ pending }}"
      loop_control:
        label: "{{ item.name }}"
      register: started
      changed_when: true
      no_log: true

    - name: Jobs waiting for the owner's approval in Work Center
      ansible.builtin.debug:
        msg: >-
          {{ started.results | map(attribute='json.data._id') | zip(pending | map(attribute='name')) | list }}
          -> approve each card in Work Center (Operations Manager); the play waits up to {{ wait_minutes }} minutes
      when: pending | length > 0

    - name: Wait for every job to complete (approval + push)
      ansible.builtin.uri:
        url: "https://{{ platform_host }}/operations-manager/jobs/{{ item.json.data._id }}"
        headers: {Cookie: "{{ cookie }}"}
        ca_path: "{{ ca_file }}"
      loop: "{{ started.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      register: job
      retries: "{{ (wait_minutes | int) * 2 }}"
      delay: 30
      until: job.json.data.status in ['complete', 'error', 'canceled', 'cancelled']
      when: pending | length > 0

    - name: Every push completed
      ansible.builtin.assert:
        that: >-
          job.results | selectattr('json', 'defined') | map(attribute='json.data.status')
          | reject('equalto', 'complete') | list | length == 0
        fail_msg: "a push did not complete: {{ job.results | selectattr('json', 'defined') | map(attribute='json.data.status') | list }}"
        quiet: true
      when: pending | length > 0
