---
# ADR 0068 step 4: the Gateway's secrets encryption key (GATEWAY_SECRETS_ENCRYPT_KEY_FILE). With distributed execution
# the server encrypts what it resolves - a repository's deploy key, a service's secrets - before it hands a run to the
# runner, and the runner refuses to clone without the same key ("can't clone repository without the
# GATEWAY_SECRETS_ENCRYPT_KEY_FILE", measured on the dev tier 2026-09-29). Itential: every server and runner node
# needs the same key file (docs.itential.com/itential-gateway/configure-secret-store).
#
# Generated once on this host (openssl rand -base64 256, the documented form) and never in the repo or .env. The lab
# keeps no secret in the Gateway's own store (every credential comes from Vault), so a lost key is regenerated, not
# recovered. The two containers run as different users (server uid 100, runner uid 1001, measured), so each gets its
# own copy, readable by that user only.
#
# Run it BEFORE anything runs `compose up`: Docker creates a missing bind-mount source as an empty directory. A
# directory found in a key's place (an earlier run in the wrong order) is removed, and when the key is new while the
# containers exist, the server and then the runner are recreated - a restart keeps the old directory mount, and the
# server must be up before the runner (tasks/gateway-vault.yml). Caller supplies gw_stack_dir (the Compose project
# directory) and gw_compose (its compose command).
- name: Gateway secrets key directory, root only
  ansible.builtin.file:
    path: "{{ gw_stack_dir }}/volumes/gateway5/secrets"
    state: directory
    owner: root
    group: root
    mode: "0711" # traversable, not listable: each container reads only its own file

- name: What sits where the key files go
  ansible.builtin.stat:
    path: "{{ gw_stack_dir }}/volumes/gateway5/secrets/{{ item }}"
  loop: [server.key, runner.key]
  register: gw_key_paths

- name: Empty directories Docker made in a key's place are removed (only empty ones, depth first)
  ansible.builtin.command: find {{ item.stat.path }} -depth -type d -empty -delete
  loop: "{{ gw_key_paths.results | selectattr('stat.isdir', 'defined') | selectattr('stat.isdir') | list }}"
  loop_control:
    label: "{{ item.item }}"
  changed_when: true

- name: What sits there now
  ansible.builtin.stat:
    path: "{{ gw_stack_dir }}/volumes/gateway5/secrets/{{ item }}"
  loop: [server.key, runner.key]
  register: gw_key_paths_now

- name: Each key path is absent or a regular file (anything else stops the play; nothing but empty dirs is removed)
  ansible.builtin.assert:
    that: not item.stat.exists or item.stat.isreg
    fail_msg: "{{ item.item }} is neither absent nor a file - look at it by hand"
    quiet: true
  loop: "{{ gw_key_paths_now.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Gateway secrets encryption key, generated once
  ansible.builtin.shell:
    cmd: umask 077 && openssl rand -base64 256 > server.key
    chdir: "{{ gw_stack_dir }}/volumes/gateway5/secrets"
    creates: "{{ gw_stack_dir }}/volumes/gateway5/secrets/server.key"
  register: gw_key_new

- name: The server's copy, readable by the server user only
  ansible.builtin.file:
    path: "{{ gw_stack_dir }}/volumes/gateway5/secrets/server.key"
    owner: "100"
    group: "101"
    mode: "0400"

- name: The runner's copy of the same key, readable by the runner user only
  ansible.builtin.copy:
    src: "{{ gw_stack_dir }}/volumes/gateway5/secrets/server.key"
    dest: "{{ gw_stack_dir }}/volumes/gateway5/secrets/runner.key"
    remote_src: true
    owner: "1001"
    group: "1001"
    mode: "0400"
  register: gw_key_runner_copy

- name: Both copies are files holding the same key
  ansible.builtin.command: cmp {{ gw_stack_dir }}/volumes/gateway5/secrets/server.key {{ gw_stack_dir }}/volumes/gateway5/secrets/runner.key
  changed_when: false

- name: Do the Gateway containers exist yet
  ansible.builtin.command: docker ps -aq --filter name=^gateway5$
  register: gw_server_exists
  changed_when: false

- name: A new key reaches running containers - the server recreated first, then the runner
  ansible.builtin.command:
    cmd: "{{ gw_compose }} up -d --force-recreate --no-deps {{ item }}"
    chdir: "{{ gw_stack_dir }}"
  loop: [gateway5, gateway5-runner]
  when: (gw_key_new is changed or gw_key_runner_copy is changed) and gw_server_exists.stdout | length > 0
  changed_when: true
