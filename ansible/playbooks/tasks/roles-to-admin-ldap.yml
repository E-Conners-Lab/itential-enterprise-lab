---
# The directory account's role re-sync (ADR 0055). Loading an adapter registers new roles; without this the
# administrator gets 403 on the new adapter's routes. Upstream's sync-admin-roles.sh does the same thing, and
# it does it in the database because the accounts API does not persist assignedRoles or memberOf.
#
# The dev-stack's defaults reach its own MongoDB container; production passes mongo_shell_argv and
# mongo_shell_host (vars/itential-prod.yml) so the write goes to the replica set's primary over TLS.
- name: After the adapters loaded, re-sync every role to admin_group and {{ admin_user }}
  ansible.builtin.command:
    argv: "{{ mongo_shell_argv | default(['docker', 'exec', 'mongodb', 'mongosh', '--quiet', 'itential', '--eval']) + [resync_eval] }}"
  delegate_to: "{{ mongo_shell_host | default(inventory_hostname) }}"
  vars:
    resync_eval: >-
        const roles = db.roles.find({}, {_id: 1}).toArray().map(r => ({roleId: r._id}));
        const g = db.groups.findOne({name: 'admin_group'}, {_id: 1});
        const u = {username: '{{ admin_user }}', provenance: 'LDAP'};
        let changed = 0;
        if (db.accounts.findOne(u, {assignedRoles: 1}).assignedRoles.length !== roles.length) {
          db.accounts.updateOne(u, {$set: {assignedRoles: roles}}); changed++; }
        if (db.groups.findOne({_id: g._id}, {assignedRoles: 1}).assignedRoles.length !== roles.length) {
          db.groups.updateOne({_id: g._id}, {$set: {assignedRoles: roles}}); changed++; }
        print(changed ? 'CHANGED ' + roles.length : 'OK ' + roles.length);
  register: role_resync
  changed_when: "'CHANGED' in role_resync.stdout"
  failed_when: "'OK' not in role_resync.stdout and 'CHANGED' not in role_resync.stdout"
