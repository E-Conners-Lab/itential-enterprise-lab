---
# ADR 0074: netops-knowledge registered with FlowMCP Gateway on production's Gateway, the same way the lab binds every
# other Gateway resource: through Gateway Manager's configuration import (the `iagctl db import` form), proven by the
# export afterwards, because the import drops unknown fields silently (tasks/gateway-vault.yml). Measured on production
# 2026-10-06 (read-only): the export carries `mcp_servers` (null while none is registered); its entries use the FlowMCP
# reference's field names (name, command_or_url, transport, description, tags, headers). The first live import
# (2026-10-06) measured two more facts: `headers` is a map (map[string]string), not the CLI's list of KEY=VALUE
# strings ("cannot unmarshal !!seq into map[string]string", HTTP 502); and right after the alias import restarts the
# server and the runner, an import answers 503 "No connection found to Gateway" until the cluster reconnects.
# The header carries the bearer token as a secret template over the Vault alias, so the token is never in this file,
# in the import body or in the export. Then the discovery is proven: Gateway Manager lists a service for each tool the
# server advertises, which needs TLS, the token and the pod's NetworkPolicy all to be right (a data-plane check).
# Runs on the Gateway host inside a play that has `login` (a Platform session) and `platform_local`; the alias must
# already be bound (tasks/gateway-vault.yml runs first). Set nk_reregister=true after a token rotation.
- name: Gateway configuration now (MCP servers)
  ansible.builtin.uri:
    url: "{{ platform_local }}/gateway_manager/v1/gateways/{{ stack.gateway5_cluster_id }}/configuration/export"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: gw_mcp_export
  until: gw_mcp_export.status | default(0) == 200
  retries: 12
  delay: 5
  no_log: true # the export also carries `users`

- name: The registration wanted and the one held
  ansible.builtin.set_fact:
    nk_mcp_have: >-
      {{ gw_mcp_export.json.mcp_servers | default([], true)
         | selectattr('name', 'equalto', netops_knowledge.mcp_server) | list }}
    nk_mcp_wanted:
      name: "{{ netops_knowledge.mcp_server }}"
      command_or_url: "{{ netops_knowledge.url }}"
      transport: streamable-http
      description: "Read-only troubleshooting knowledge (ADR 0074); two tools, reference data only"
      tags: [netops-knowledge, adr-0074]
      # Go template for the Gateway, not Jinja: the alias resolves from Vault at connection time
      headers:
        Authorization: "Bearer {% raw %}{{{% endraw %} secret \"{{ netops_knowledge.token_alias }}\" {% raw %}}}{% endraw %}"

- name: The Gateway is connected to Gateway Manager (a server or runner restart earlier in the play drops it)
  ansible.builtin.uri:
    url: "{{ platform_local }}/gateway_manager/v1/connections"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: nk_gw_conns
  until: stack.gateway5_cluster_id in (nk_gw_conns.json | to_json)
  retries: 24
  delay: 5

- name: Register netops-knowledge (new, changed or asked to re-register)
  ansible.builtin.uri:
    url: "{{ platform_local }}/gateway_manager/v1/gateways/{{ stack.gateway5_cluster_id }}/configuration/import"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: {options: {source: content, content: {mcp_servers: ["{{ nk_mcp_wanted }}"]}, force: true}}
    status_code: [200, 201]
  when: >-
    nk_reregister | default(false) | bool
    or nk_mcp_have | length == 0
    or nk_mcp_have[0].command_or_url | default('') != nk_mcp_wanted.command_or_url
    or nk_mcp_have[0].transport | default('') != nk_mcp_wanted.transport
  register: nk_mcp_import
  changed_when: true

- name: Gateway configuration after the import
  ansible.builtin.uri:
    url: "{{ platform_local }}/gateway_manager/v1/gateways/{{ stack.gateway5_cluster_id }}/configuration/export"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: gw_mcp_after
  until: gw_mcp_after.status | default(0) == 200
  retries: 12
  delay: 5
  no_log: true

- name: The export holds the registration as wanted (the import drops unknown fields silently)
  ansible.builtin.assert:
    that:
      - held | length == 1
      - held[0].command_or_url == nk_mcp_wanted.command_or_url
      - held[0].transport == nk_mcp_wanted.transport
      - held[0].headers | default([]) | length == 1
    fail_msg: >-
      the export does not hold {{ netops_knowledge.mcp_server }} as imported (fields kept: {{ held | map('list') | list }}):
      the import form differs from the reference's field names - measure it and amend this task
    quiet: true
  vars:
    held: >-
      {{ gw_mcp_after.json.mcp_servers | default([], true)
         | selectattr('name', 'equalto', netops_knowledge.mcp_server) | list }}

# Discovery needs the whole path: DNS, TLS (the lab CA), the VIP's source range, the NetworkPolicy and the token.
- name: Gateway Manager lists a service for every tool the server advertises
  ansible.builtin.uri:
    url: "{{ platform_local }}/gateway_manager/v1/services?limit=500"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: nk_services
  until: >-
    nk_services.status | default(0) == 200
    and (netops_knowledge.tools | reject('in', nk_services.json.result | map(attribute='service_metadata.name')
         | map('regex_replace', '^.*[/:.]', '') | list) | list | length == 0)
  retries: 18
  delay: 10

- name: The MCP-backed services, for the record (ADR 0074 lab PR B wires the agents to these names)
  ansible.builtin.debug:
    msg: >-
      {{ nk_services.json.result | map(attribute='service_metadata')
         | selectattr('name', 'search', netops_knowledge.tools | join('|'))
         | map('dict2items') | map('selectattr', 'key', 'in', ['name', 'type', 'location', 'decorator']) | map('items2dict')
         | list }}
