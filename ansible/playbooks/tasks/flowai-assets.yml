---
# The FlowAI assets of phase 6 (PID S4c, ADR 0037/0038), included by ansible/playbooks/flowai.yml for the
# dev-stack and by ansible/playbooks/platform-ha2-replay.yml for the production environment (ADR 0055).
# The Model Registry provider profiles, the agent project, tool discovery and the agents themselves.
#
# The caller provides: platform_local, admin_user / admin_pw, llm_profiles (the profiles that answered this
# run, with the environment's Ollama address), agent_docs and tool_registry_base.
# --- Model Registry provider profiles ----------------------------------------------------
- name: Login as {{ admin_user }}
  ansible.builtin.uri:
    url: "{{ platform_local }}/login"
    method: POST
    body_format: json
    body: {username: "{{ admin_user }}", password: "{{ admin_pw }}"}
    status_code: 200
  register: login
  no_log: true

- name: Operator group (admin_group builds and operates the agents)
  ansible.builtin.uri:
    url: "{{ platform_local }}/authorization/groups?limit=100"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: auth_groups

- name: Group id
  ansible.builtin.set_fact:
    admin_group_id: "{{ (auth_groups.json.results | selectattr('name', 'equalto', 'admin_group') | first)._id }}"

- name: Existing provider profiles
  ansible.builtin.uri:
    url: "{{ platform_local }}/model-registry-service/profiles"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: mr_profiles

- name: Provider credential bodies (keys from .env, never logged)
  ansible.builtin.set_fact:
    profile_bodies: >-
      {{ profile_bodies | default([]) + [{
           'name': item.name, 'provider': item.provider, 'model': item.model,
           'credential': ({'type': 'anthropic',
                           'apiKey': lookup('ansible.builtin.env', item.env_key | default('ANTHROPIC_API_KEY'))}
                          if item.provider == 'anthropic' else {'type': 'ollama', 'baseURL': item.base_url}) }] }}
  loop: "{{ llm_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

# A profile IS updatable, but only through the documented shape: PATCH
# /model-registry-service/profiles/<id> with the body wrapped in {"update": {...}}, and every
# models[] entry carrying BOTH name and enabled (create takes name alone). Send any other shape -
# {"profile": {...}}, which is the CREATE wrapper, or a bare {"models": [...]} - and the API answers
# 200 and silently ignores it, which is easy to misread as "profiles cannot be updated" (I did,
# 2026-09-11). itential-builder:flowagent documents the real contract.
#
# THE HAZARD, which that skill does not mention: rewriting models[] REISSUES each model's UUID, and an
# agent's provider.model is that UUID. A profile PATCH therefore orphans every agent bound to it -
# measured: agentCount went 6 -> 0 and the twins stopped resolving. So the tasks below re-resolve
# model_ids and PATCH every agent's provider afterwards, which this play already did for other
# reasons; the ordering is what makes it safe. Delete-and-recreate would also work and is what this
# task used to do, but it is an irreversible hard delete of a profile that agents depend on.
- name: Provider profiles live now
  ansible.builtin.uri:
    url: "{{ platform_local }}/model-registry-service/profiles/{{ item.id }}"
    headers: {Cookie: "{{ login.cookies_string }}"}
  loop: >-
    {{ (mr_profiles.json.profiles | default(mr_profiles.json.data | default([])))
       | selectattr('name', 'in', llm_profiles | map(attribute='name') | list) | list }}
  loop_control:
    label: "{{ item.name }}"
  register: mr_live

- name: Profiles whose base URL or pinned model has drifted from the repo
  ansible.builtin.set_fact:
    drifted_profiles: >-
      {{ drifted_profiles | default([])
         + ([{'id': item.json.id, 'name': item.json.name, 'want': want}] if not ok else []) }}
  loop: "{{ mr_live.results | default([]) | selectattr('json', 'defined') | list }}"
  loop_control:
    label: "{{ item.json.name }}: {{ 'ok' if ok else 'update' }}"
  vars:
    want: "{{ llm_profiles | selectattr('name', 'equalto', item.json.name) | first }}"
    # anthropic profiles carry a write-only key and nothing comparable, so they are never touched
    ok: >-
      {{ item.json.provider != 'ollama'
         or ((item.json.credential.baseUrl | default('')) == want.base_url
             and want.model in (item.json.models | default([]) | map(attribute='name') | list)) }}

- name: Drifted profiles updated in place
  ansible.builtin.uri:
    url: "{{ platform_local }}/model-registry-service/profiles/{{ item.id }}"
    method: PATCH
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      update:
        credential: {type: ollama, baseURL: "{{ item.want.base_url }}"}
        models: [{name: "{{ item.want.model }}", enabled: true}]
    status_code: 200
  loop: "{{ drifted_profiles | default([]) }}"
  loop_control:
    label: "{{ item.name }} -> {{ item.want.model }} at {{ item.want.base_url }}"
  changed_when: true

- name: Existing provider profiles after the update sweep
  ansible.builtin.uri:
    url: "{{ platform_local }}/model-registry-service/profiles"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: mr_profiles

- name: Provider profiles created once (credentials are write-only in the platform)
  ansible.builtin.uri:
    url: "{{ platform_local }}/model-registry-service/profiles"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      profile:
        category: direct
        name: "{{ item.name }}"
        provider: "{{ item.provider }}"
        credential: "{{ item.credential }}"
        models: [{name: "{{ item.model }}"}]
        builderGroups: [{id: "{{ admin_group_id }}", provenance: Pronghorn, name: admin_group}]
    status_code: [200, 201]
  loop: "{{ profile_bodies }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in ((mr_profiles.json.profiles | default(mr_profiles.json.data | default([]))) | map(attribute='name') | list)
  no_log: true

- name: Provider profiles now
  ansible.builtin.uri:
    url: "{{ platform_local }}/model-registry-service/profiles"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: mr_profiles2

- name: Profile ids by name
  ansible.builtin.set_fact:
    profile_ids: >-
      {{ dict(mr_profiles2.json.profiles | map(attribute='name')
              | zip(mr_profiles2.json.profiles | map(attribute='id'))) }}

- name: Each profile with its enabled models
  ansible.builtin.uri:
    url: "{{ platform_local }}/model-registry-service/profiles/{{ profile_ids[item.name] }}"
    headers: {Cookie: "{{ login.cookies_string }}"}
  loop: "{{ llm_profiles }}"
  loop_control:
    label: "{{ item.name }}"
  register: profile_docs

- name: Pinned model id per profile (the model must be enabled on the profile)
  ansible.builtin.set_fact:
    model_ids: >-
      {{ model_ids | default({}) | combine({item.item.name:
         (item.json.models | selectattr('name', 'equalto', item.item.model) | map(attribute='id') | first)}) }}
  loop: "{{ profile_docs.results }}"
  loop_control:
    label: "{{ item.item.name }} -> {{ item.item.model }}"

# --- Agent project and agents from itential/agents/*.yaml ----------------------------------
- name: Agent documents
  ansible.builtin.set_fact:
    agent_defs: "{{ agent_defs | default([]) + [lookup('ansible.builtin.file', item) | from_yaml] }}"
  loop: "{{ agent_docs }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Existing projects
  ansible.builtin.uri:
    url: "{{ platform_local }}/agent-project-service/projects"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: projects

- name: Project {{ agents.project }}
  ansible.builtin.uri:
    url: "{{ platform_local }}/agent-project-service/projects"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: {name: "{{ agents.project }}", description: "Lab network operations agents (ADR 0037); documents in itential/agents/"}
    status_code: [200, 201]
  when: agents.project not in (projects.json.data['items'] | map(attribute='name') | list)

- name: Project id
  ansible.builtin.uri:
    url: "{{ platform_local }}/agent-project-service/projects"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: projects2

- name: Tool discovery (creates registry entries for platform assets)
  ansible.builtin.uri:
    url: "{{ platform_local }}/{{ tool_registry_base }}/discover"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: {}
    status_code: 200
  changed_when: false

- name: Existing agents
  ansible.builtin.uri:
    url: "{{ platform_local }}/agent-project-service/operable-agents"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: agents_now

- name: Agents created or updated from the documents
  ansible.builtin.include_tasks: tasks/flowai-agent.yml
  # agent_exclude defaults to none (production builds every agent); dev drops diagnostics-local, whose
  # lab-servicenow tools do not exist there with ServiceNow off (ADR 0063)
  loop: >-
    {{ agent_defs | selectattr('profile', 'in', llm_profiles | map(attribute='name') | list)
       | rejectattr('name', 'in', agent_exclude | default([])) | list }}
  loop_control:
    loop_var: agent
    label: "{{ agent.name }}"
