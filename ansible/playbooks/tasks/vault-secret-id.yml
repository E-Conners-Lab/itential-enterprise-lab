---
# Phase 9a (ADR 0065): the AppRole credentials one reader needs, stable across re-runs. The current secret ID is
# kept while Vault still knows it (a secret ID has no TTL and no use limit, decision 5), and only a missing or
# unknown one is replaced, so a re-run never churns a credential the Platform or the Gateway is using.
# Caller supplies:
#   vault_url            the Vault this reader uses
#   vault_ca_path        the lab CA on the host running these tasks
#   vault_admin_token    a token allowed to read role IDs and issue secret IDs (dev: the dev root token)
#   vault_reader         the AppRole name (itential-platform | itential-gateway)
#   vault_current_secret_id  what the reader holds now ('' when nothing)
#   vault_current_role_id    the role ID the reader holds now ('' when nothing)
# Sets vault_reader_role_id, vault_reader_secret_id and vault_reader_secret_id_changed.
#
# Without an administrator token (vault_admin_token empty: every production replay after the cut-over, since the
# root token is revoked and production has no standing admin credential) the reader keeps exactly what it holds, and
# a reader that holds nothing yet stops the play: only a run with VAULT_TOKEN (make vault-cutover) can issue.
- name: Without an administrator token the reader must already hold its credentials, {{ vault_reader }}
  ansible.builtin.assert:
    that:
      - vault_current_secret_id | default('') | length > 0
      - vault_current_role_id | default('') | length > 0
    fail_msg: "{{ vault_reader }} holds no Vault credentials yet: run with VAULT_TOKEN (make vault-cutover)"
    quiet: true
  when: vault_admin_token | default('') | length == 0
  no_log: true

- name: Role ID, {{ vault_reader }}
  ansible.builtin.uri:
    url: "{{ vault_url }}/v1/auth/{{ vault.approle_mount }}/role/{{ vault_reader }}/role-id"
    ca_path: "{{ vault_ca_path }}"
    headers: {X-Vault-Token: "{{ vault_admin_token }}"}
  register: vault_reader_role
  when: vault_admin_token | default('') | length > 0
  no_log: true

# lookup answers 200 with data for a live secret ID; an unknown one is 204 (no body) on Vault 2.0
- name: Is the current secret ID still known to Vault, {{ vault_reader }}
  ansible.builtin.uri:
    url: "{{ vault_url }}/v1/auth/{{ vault.approle_mount }}/role/{{ vault_reader }}/secret-id/lookup"
    ca_path: "{{ vault_ca_path }}"
    method: POST
    headers: {X-Vault-Token: "{{ vault_admin_token }}"}
    body_format: json
    body: {secret_id: "{{ vault_current_secret_id }}"}
    status_code: [200, 204, 400, 404]
  register: vault_reader_lookup
  when: vault_admin_token | default('') | length > 0 and vault_current_secret_id | length > 0
  no_log: true

- name: Issue a secret ID when there is none or Vault no longer knows it, {{ vault_reader }}
  ansible.builtin.uri:
    url: "{{ vault_url }}/v1/auth/{{ vault.approle_mount }}/role/{{ vault_reader }}/secret-id"
    ca_path: "{{ vault_ca_path }}"
    method: POST
    headers: {X-Vault-Token: "{{ vault_admin_token }}"}
    body_format: json
    # Vault wants metadata as a JSON-encoded STRING: an object answers 400 (measured 2026-09-23 by test-09a). A literal,
    # not `{{ ... | to_json }}`, which Ansible can turn back into a dict when it renders a whole-value template.
    body:
      metadata: '{"issued_by": "ansible (ADR 0065)"}'
  register: vault_reader_issued
  when: >-
    vault_admin_token | default('') | length > 0 and (
    vault_current_secret_id | length == 0
    or vault_reader_lookup.status != 200
    or (vault_reader_lookup.json.data | default(none)) is none)
  changed_when: true
  no_log: true

- name: Credentials for {{ vault_reader }}
  ansible.builtin.set_fact:
    vault_reader_role_id: >-
      {{ vault_reader_role.json.data.role_id if vault_admin_token | default('') | length > 0 else vault_current_role_id }}
    vault_reader_secret_id_changed: "{{ vault_reader_issued is changed }}"
    vault_reader_secret_id: >-
      {{ vault_reader_issued.json.data.secret_id if vault_reader_issued is changed else vault_current_secret_id }}
  no_log: true
