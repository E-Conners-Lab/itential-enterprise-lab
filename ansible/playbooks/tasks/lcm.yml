---
# Element 3 of PID S4d (ADR 0043/0044): the JSON form on the approval task (itential/forms/<form>.json, generated by
# itential/forms/build.py), the Lifecycle Manager resource model (itential/lcm/<model>.yaml, actions naming their
# workflows) and one instance per existing NetBox branch VLAN. Needs: login, netbox_url, netbox_headers, lcm_dir, forms_dir.
# Only declarations here: no action is run and nothing touches a device.
# --- the JSON form: created once, replaced in place when the generated document differs ------------------------
- name: Form document
  ansible.builtin.set_fact:
    form_doc: "{{ lookup('ansible.builtin.file', forms_dir ~ '/' ~ forms.approval ~ '.json') | from_json }}"

- name: Existing forms
  ansible.builtin.uri:
    url: "{{ platform_local }}/json-forms/forms"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: forms_now

- name: Form created
  ansible.builtin.uri:
    url: "{{ platform_local }}/json-forms/forms"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: "{{ form_doc }}"
    status_code: [200, 201]
  when: forms.approval not in (forms_now.json | map(attribute='name') | list)

# PUT is a full replacement wrapped in options; the platform's own bookkeeping fields are carried over (builder skill, confirmed)
- name: Form replaced when struct, schema or uiSchema changed
  ansible.builtin.uri:
    url: "{{ platform_local }}/json-forms/forms/{{ have.id }}"
    method: PUT
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      options: >-
        {{ form_doc | combine({'created': have.created, 'createdBy': have.createdBy,
                               'lastUpdated': have.lastUpdated, 'lastUpdatedBy': have.lastUpdatedBy}) }}
    status_code: 200
  vars:
    have: "{{ (forms_now.json | selectattr('name', 'equalto', forms.approval) | first) | default({}) }}"
  when: >-
    have | length > 0 and (have.struct != form_doc.struct or have.schema != form_doc.schema
    or have.uiSchema != form_doc.uiSchema or have.description != form_doc.description)
  changed_when: true

# --- the resource model: created once, replaced in place (full document) when schema or actions changed --------
- name: Model document
  ansible.builtin.set_fact:
    model_doc: "{{ lookup('ansible.builtin.file', lcm_dir ~ '/' ~ lcm.model ~ '.yaml') | from_yaml }}"

- name: Model document matches the oracle
  ansible.builtin.assert:
    that:
      - model_doc.name == lcm.model
      - (model_doc.actions | selectattr('type', 'equalto', 'create') | map(attribute='workflow') | list) == [lcm.actions.create]
      - (model_doc.actions | selectattr('type', 'equalto', 'delete') | map(attribute='workflow') | list) == [lcm.actions.delete]
    quiet: true

- name: Existing resource models
  ansible.builtin.uri:
    url: "{{ platform_local }}/lifecycle-manager/resources?limit=100"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: models_now

- name: Model created (actions by workflow name; the platform resolves the name when the action runs)
  ansible.builtin.uri:
    url: "{{ platform_local }}/lifecycle-manager/resources"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: "{{ model_doc }}"
    status_code: [200, 201]
  when: lcm.model not in (models_now.json.data | map(attribute='name') | list)

- name: Model id
  ansible.builtin.uri:
    url: "{{ platform_local }}/lifecycle-manager/resources?limit=100"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: models_now2

- name: Model fact
  ansible.builtin.set_fact:
    model_id: "{{ (models_now2.json.data | selectattr('name', 'equalto', lcm.model) | first)._id }}"

- name: Model as stored (the single-model read keeps the workflow names)
  ansible.builtin.uri:
    url: "{{ platform_local }}/lifecycle-manager/resources/{{ model_id }}"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: model_have

- name: Model replaced when the document changed (PUT needs name, description, schema and actions)
  ansible.builtin.uri:
    url: "{{ platform_local }}/lifecycle-manager/resources/{{ model_id }}"
    method: PUT
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: "{{ model_doc }}"
    status_code: 200
  vars:
    action_keys: ['_id', 'name', 'type', 'workflow']
  when: >-
    model_have.json.data.schema != model_doc.schema or model_have.json.data.description != model_doc.description
    or (model_have.json.data.actions | map('dict2items') | map('selectattr', 'key', 'in', action_keys) | map('items2dict') | list)
       != (model_doc.actions | map('dict2items') | map('selectattr', 'key', 'in', action_keys) | map('items2dict') | list)
  changed_when: true

- name: Every action runnable (the workflows are imported and the names resolve)
  ansible.builtin.uri:
    url: "{{ platform_local }}/lifecycle-manager/resources/{{ model_id }}/actions/validate"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: {actions: "{{ model_doc.actions }}"}
    status_code: 200
  register: actions_valid
  failed_when: actions_valid.json.data | rejectattr('runnable') | list | length > 0

# --- instances: one per NetBox VLAN in the branch groups; the play never retires one (the Delete action does) ----
- name: NetBox branch VLANs (intent)
  ansible.builtin.uri:
    url: "{{ netbox_url }}/api/ipam/vlans/?limit=0&{{ lcm.netbox_vlan_groups | map('regex_replace', '^', 'group=') | join('&') }}"
    headers: "{{ netbox_headers }}"
  register: nb_vlans
  no_log: true

- name: Existing instances
  ansible.builtin.uri:
    url: "{{ platform_local }}/lifecycle-manager/resources/{{ model_id }}/instances?limit=100"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: instances_now

- name: Instances imported for the NetBox VLANs that have none (bare instance document, validated against the schema)
  ansible.builtin.uri:
    url: "{{ platform_local }}/lifecycle-manager/resources/{{ model_id }}/instances/import"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      name: "{{ item.site.slug }}-{{ item.name }}"
      description: "Imported from NetBox VLAN {{ item.id }} by ansible/playbooks/platform.yml (PID S4d.3)"
      instanceData:
        branch: "{{ item.site.slug }}"
        vid: "{{ item.vid | int }}"
        vlan_name: "{{ item.name }}"
        switch: "{{ item.site.slug }}-sw01"
        netbox_vlan_id: "{{ item.id | int }}"
        status: "{{ item.status.value }}"
    status_code: [200, 201]
  loop: "{{ nb_vlans.json.results }}"
  loop_control:
    label: "{{ item.site.slug }}-{{ item.name }} (vid {{ item.vid }})"
  when: (item.site.slug ~ '-' ~ item.name) not in (instances_now.json.data | map(attribute='name') | list)
  changed_when: true
