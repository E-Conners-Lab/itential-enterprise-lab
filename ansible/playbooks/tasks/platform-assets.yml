---
# The Platform assets of phase 5 (PID S4, ADR 0035/0039), included by ansible/playbooks/itential.yml for the
# dev-stack and by ansible/playbooks/platform-ha2-replay.yml for the production environment (ADR 0055).
# One definition, two callers: the adapter instances, the role re-sync, Inventory Manager and the host
# inventory, the Device Broker, the Gateway 5 probes, the NetBox VLAN groups and the workflow import.
#
# The caller provides: platform_local (the Platform API, always this node's own 127.0.0.1:3000), a fresh
# session registered as `login`, admin_user / admin_pw, netbox_oob_host / netbox_port, platform_map, and
# role_resync_tasks (the task file that re-syncs the roles this environment's administrator holds).
# Optional, set only by vars/itential-dev.yml (ADR 0063); each defaults to what production has always done:
# device_source (netbox), inventory_groups ([admin_group]), netbox_vlan_groups_managed (true).
# Adapter instances. NetBox keeps its adapter because the InventoryBroker consumes an adapter and not
# an integration (ADR 0039); ServiceNow's was removed by S4f (ADR 0054) - the PDI is reached through the
# lab-servicenow Integration Model, which holds the same credentials from .env. Gateway 5 is not an
# adapter: it is registered with Gateway Manager above. Gateway 4 is deferred (owner decision 2026-09-07).
- name: Adapter instances
  ansible.builtin.set_fact:
    adapter_instances:
      - name: NetBox
        model: "@itentialopensource/adapter-netbox"
        type: "{{ adapters.netbox.export }}"
        properties:
          host: "{{ netbox_oob_host }}"
          port: "{{ netbox_port }}"
          protocol: http
          base_path: /api
          version: ""
          stub: false
          authentication:
            auth_method: static_token
            # Unused with static_token, but stored empty on purpose: without it the Admin Essentials JSON view fills in the
            # package's schema default and shows "password": "admin" beside the token (display only, measured 2026-09-23)
            password: ""
            # Phase 9a (ADR 0065): a Vault reference, resolved by the Platform, once vault_enabled is on
            token: >-
              {{ vault.platform_refs.netbox_adapter_token if vault_enabled | default(false) | bool
                 else lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}
            token_timeout: 1800000
            token_cache: local
            invalid_token_error: 401
            auth_field: header.headers.Authorization
            auth_field_format: "Token {token}"
            auth_logging: false
          healthcheck: {type: startup, frequency: 300000, query_object: {}, addlHeaders: {}}
          request:
            number_redirects: 0
            number_retries: 3
            limit_retry_error: 401
            attempt_timeout: 10000
            healthcheck_on_timeout: true
            return_raw: false
            archiving: false
          ssl: {enabled: false, accept_invalid_cert: false}
  no_log: true

- name: Existing adapter instances
  ansible.builtin.uri:
    url: "{{ platform_local }}/adapters/{{ item.name }}"
    headers: {Cookie: "{{ login.cookies_string }}"}
    status_code: [200, 404, 500]
  loop: "{{ adapter_instances }}"
  loop_control:
    label: "{{ item.name }}"
  register: adapter_exists

- name: Create adapter instances
  ansible.builtin.uri:
    url: "{{ platform_local }}/adapters"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      properties:
        name: "{{ item.item.name }}"
        model: "{{ item.item.model }}"
        type: Adapter
        properties: {id: "{{ item.item.name }}", type: "{{ item.item.type }}"}
    status_code: [200, 201]
  loop: "{{ adapter_exists.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.status != 200

# S4f (ADR 0054): an adapter the documents stop naming is removed, the same way netbox-vms.yml and
# observability.yml prune a VM and a Zabbix host (ADR 0053 S11.8). Without this, dropping
# adapter-servicenow from the oracle left it installed and RUNNING on every node - the instance is
# created by this play but was never owned by it afterwards. The filter is deliberately narrow: only
# an @itentialopensource adapter this play knows how to create is ever a candidate, so the
# Platform's own adapters (InventoryBroker, LDAP) and anything added by hand are never touched.
- name: Adapters currently installed
  ansible.builtin.uri:
    url: "{{ platform_local }}/health/adapters"
    headers: {Cookie: "{{ login.cookies_string }}"}
    status_code: 200
  register: health_adapters

- name: Adapter instances the documents no longer name
  ansible.builtin.set_fact:
    stale_adapters: >-
      {{ (health_adapters.json.results | default([]))
         | selectattr('package_id', 'defined')
         | selectattr('package_id', 'search', '@itentialopensource/adapter-')
         | rejectattr('id', 'in', adapter_instances | map(attribute='name') | list)
         | map(attribute='id') | list }}

- name: Remove the adapter instances the documents no longer name
  ansible.builtin.uri:
    url: "{{ platform_local }}/adapters/{{ item }}"
    method: DELETE
    headers: {Cookie: "{{ login.cookies_string }}"}
    status_code: [200, 204, 404]
  loop: "{{ stale_adapters }}"
  changed_when: true

- name: Configure adapter instances (activates them)
  ansible.builtin.uri:
    url: "{{ platform_local }}/adapters/{{ item.name }}/properties"
    method: PUT
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: {properties: "{{ item.properties }}"}
    status_code: 200
  loop: "{{ adapter_instances }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  changed_when: true

- name: Adapter instances RUNNING (up to 2 min)
  ansible.builtin.uri:
    url: "{{ platform_local }}/health/adapters"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: adapters_health
  until: >-
    (adapters_health.json.results | default(adapters_health.json))
    | selectattr('id', 'in', adapter_instances | map(attribute='name') | list)
    | selectattr('state', 'equalto', 'RUNNING') | list | length == adapter_instances | length
  retries: 24
  delay: 5

# Adapter packages register new roles (their methods); upstream's sync-admin-roles.sh does the
# same re-sync. Without it the administrator gets 403 on the new adapter's routes. The dev-stack
# does it in its own database (the LDAP account); production does it through the authorization API.
- name: After the adapters loaded, re-sync every role to admin_group and {{ admin_user }}
  ansible.builtin.include_tasks: "tasks/{{ role_resync_tasks | default('roles-to-admin-ldap.yml') }}"

- name: Fresh session with the adapter roles as {{ admin_user }}
  ansible.builtin.uri:
    url: "{{ platform_local }}/login"
    method: POST
    body_format: json
    body: {username: "{{ admin_user }}", password: "{{ admin_pw }}"}
    status_code: 200
  register: login
  no_log: true

- name: NetBox adapter answers through the platform (a device page with NetBox's own count)
  ansible.builtin.uri:
    url: "{{ platform_local }}/NetBox/getDcimDevices"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: {query: {limit: 1}}
    status_code: 200
  register: nb_devices
  failed_when: (nb_devices.json.response | default(nb_devices.json)).count is not defined

# --- Inventory Manager: the lab devices from NetBox (ADR 0002) for Gateway 5's device services ---
# Gateway 5's native send-command/send-config run against Inventory Manager nodes. Nodes are
# generated from NetBox (routers -> cisco_ios, switches -> arista_eos; firewalls wait for PA-VM,
# endpoints are not network devices). Device credentials are the lab automation account, stored
# in the inventory until Vault (Phase 9): accepted SEC exception recorded in the PR.
# device_source defaults to netbox (production). The dev overlay sets clab: its devices are the Containerlab
# nodes, which are never registered in NetBox, so production's inventory can never pick them up (ADR 0063).
# Phase 9a (ADR 0065): with vault_enabled on, a node carries the Gateway alias instead of the password, and the
# Gateway server resolves it from Vault just before it connects (measured on dev for send-command and for
# Configuration Manager through the InventoryBroker). Off, the nodes keep the .env password as before.
- name: Device password as the inventory nodes carry it
  ansible.builtin.set_fact:
    vault_on: "{{ vault_enabled | default(false) | bool }}"
    device_password: >-
      {{ ('$GATEWAYSECRET_(' ~ vault.device_password_alias ~ ')') if vault_enabled | default(false) | bool
         else lookup('ansible.builtin.env', 'AUTOMATION_PASSWORD') }}
  no_log: true

- name: Network devices from NetBox (active, with a management address, by platform)
  ansible.builtin.uri:
    url: >-
      http://{{ netbox_oob_host }}:{{ netbox_port }}/api/dcim/devices/?limit=0&status=active&has_primary_ip=true&platform={{ item }}
    headers: {Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"}
  loop: "{{ platform_map.keys() | list }}"
  register: nb_platforms
  no_log: true
  when: device_source | default('netbox') == 'netbox'

# The loop falls back to [] off NetBox because Ansible templates a loop before it evaluates `when`.
- name: Inventory nodes
  ansible.builtin.set_fact:
    inv_nodes: >-
      {{ inv_nodes | default([]) + [{'name': item.name, 'tags': [item.site.slug, item.role.slug, item.platform.slug],
         'attributes': {'itential_host': item.primary_ip4.address | ansible.utils.ipaddr('address'),
                        'itential_platform': platform_map[item.platform.slug],
                        'itential_user': 'automation',
                        'itential_password': device_password,
                        'cluster_id': stack.gateway5_cluster_id}}] }}
  loop: >-
    {{ (nb_platforms.results | map(attribute='json.results') | flatten | list)
       if device_source | default('netbox') == 'netbox' else [] }}
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: device_source | default('netbox') == 'netbox'

# Dev (ADR 0063): only the Containerlab nodes, from clab/versions.yaml, with the clab automation account.
# No Ansible loop, so the oracle is read only when this branch runs, never on production.
- name: Inventory nodes from the Containerlab oracle (dev only)
  ansible.builtin.set_fact:
    inv_nodes: >-
      {%- set out = [] -%}
      {%- for n in clab.nodes -%}
        {%- set _ = out.append({'name': n.name, 'tags': ['clab', n.role, n.netmiko],
                                'attributes': {'itential_host': n.mgmt_ipv4,
                                               'itential_platform': n.netmiko,
                                               'itential_user': clab.credentials.user,
                                               'itential_password': device_password if vault_on
                                                   else lookup('ansible.builtin.env', clab.credentials.password_env),
                                               'itential_driver_options': clab.gateway_driver_options,
                                               'cluster_id': stack.gateway5_cluster_id}}) -%}
      {%- endfor -%}
      {{ out }}
  vars:
    clab: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../clab/versions.yaml') | from_yaml }}"
  no_log: true
  when: device_source | default('netbox') == 'clab'

- name: The Containerlab device password is in .env (clab-dev.yml generates CLAB_AUTOMATION_PASSWORD)
  ansible.builtin.assert:
    that: inv_nodes | map(attribute='attributes.itential_password') | select | list | length == inv_nodes | length
    fail_msg: "a clab node has no password: run clab-dev.yml first so CLAB_AUTOMATION_PASSWORD is in .env"
    quiet: true
  no_log: true
  when: device_source | default('netbox') == 'clab'

- name: Inventory exists?
  ansible.builtin.uri:
    url: "{{ platform_local }}/inventory_manager/v1/inventories/{{ stack.inventory }}"
    headers: {Cookie: "{{ login.cookies_string }}"}
    status_code: [200, 404]
  register: inv_state

- name: Inventory with the built-in broker actions on cluster {{ stack.gateway5_cluster_id }}
  ansible.builtin.uri:
    url: "{{ platform_local }}/inventory_manager/v1/inventories"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      name: "{{ stack.inventory }}"
      description: "Lab network devices from NetBox (ansible/playbooks/itential.yml)"
      # production keeps admin_group alone; dev adds copilot-builders (ADR 0055 group rule, ADR 0063)
      groups: "{{ inventory_groups | default(['admin_group']) }}"
      createBrokerActions: true
      defaultClusterId: "{{ stack.gateway5_cluster_id }}"
    status_code: [200, 201]
  when: inv_state.status != 200

- name: Existing nodes
  ansible.builtin.uri:
    url: "{{ platform_local }}/inventory_manager/v1/inventories/{{ stack.inventory }}/nodes"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: inv_existing
  no_log: true

# /nodes/bulk is populateInventory: it REPLACES the node set, so always send the full list. Compared by name and
# driver options: production nodes carry no driver options on either side, so production still compares by name only.
- name: Inventory nodes populated from NetBox (replaces the set when it differs)
  ansible.builtin.uri:
    url: "{{ platform_local }}/inventory_manager/v1/nodes/bulk"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      inventory_identifier: "{{ stack.inventory }}"
      nodes: "{{ inv_nodes }}"
    status_code: 200
  vars:
    # name, driver options and password: without the password a switch to a Vault alias (ADR 0065), or a rotated
    # value, would compare equal and never reach the Platform
    have_nodes: "{{ inv_existing.json.result.data }}"
    have: >-
      {{ have_nodes | map(attribute='name')
         | zip(have_nodes | map(attribute='attributes.itential_driver_options', default={}),
               have_nodes | map(attribute='attributes.itential_password', default=''))
         | map('list') | sort }}
    want: >-
      {{ inv_nodes | map(attribute='name')
         | zip(inv_nodes | map(attribute='attributes.itential_driver_options', default={}),
               inv_nodes | map(attribute='attributes.itential_password', default=''))
         | map('list') | sort }}
  when: have != want
  no_log: true

# --- Hosts (S4d.6, ADR 0047): the Ubuntu endpoints in their own inventory for Gateway 5 only ------------
- name: Ubuntu hosts from NetBox (active, with a management address, by platform)
  ansible.builtin.uri:
    url: >-
      http://{{ netbox_oob_host }}:{{ netbox_port }}/api/dcim/devices/?limit=0&status=active&has_primary_ip=true&platform={{ item }}
    headers: {Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"}
  loop: "{{ hosts.netbox_platforms.keys() | list }}"
  register: nb_hosts
  no_log: true
  # the hosts are EVE-NG endpoints; dev's lab-hosts inventory stays empty (ADR 0063)
  when: device_source | default('netbox') == 'netbox'

- name: Host nodes (netmiko platform linux, the automation account with its password)
  ansible.builtin.set_fact:
    host_nodes: >-
      {{ host_nodes | default([]) + [{'name': item.name, 'tags': [item.site.slug, item.role.slug, item.platform.slug],
         'attributes': {'itential_host': item.primary_ip4.address | ansible.utils.ipaddr('address'),
                        'itential_platform': hosts.netbox_platforms[item.platform.slug],
                        'itential_user': 'automation',
                        'itential_password': device_password,
                        'cluster_id': stack.gateway5_cluster_id}}] }}
  loop: >-
    {{ (nb_hosts.results | map(attribute='json.results') | flatten | selectattr('role.slug', 'in', hosts.roles) | list)
       if device_source | default('netbox') == 'netbox' else [] }}
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: device_source | default('netbox') == 'netbox'

- name: Host inventory exists?
  ansible.builtin.uri:
    url: "{{ platform_local }}/inventory_manager/v1/inventories/{{ stack.host_inventory }}"
    headers: {Cookie: "{{ login.cookies_string }}"}
    status_code: [200, 404]
  register: host_inv_state

- name: Host inventory without broker actions (Configuration Manager never sees hosts) on cluster {{ stack.gateway5_cluster_id }}
  ansible.builtin.uri:
    url: "{{ platform_local }}/inventory_manager/v1/inventories"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      name: "{{ stack.host_inventory }}"
      description: "Lab Ubuntu hosts from NetBox for Gateway 5 (ansible/playbooks/itential.yml, PID S4d.6)"
      groups: "{{ inventory_groups | default(['admin_group']) }}"
      createBrokerActions: false
      defaultClusterId: "{{ stack.gateway5_cluster_id }}"
    status_code: [200, 201]
  when: host_inv_state.status != 200

- name: Existing host nodes
  ansible.builtin.uri:
    url: "{{ platform_local }}/inventory_manager/v1/inventories/{{ stack.host_inventory }}/nodes"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: host_inv_existing
  no_log: true

- name: Host nodes populated from NetBox (replaces the set when it differs)
  ansible.builtin.uri:
    url: "{{ platform_local }}/inventory_manager/v1/nodes/bulk"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      inventory_identifier: "{{ stack.host_inventory }}"
      nodes: "{{ host_nodes | default([]) }}"
    status_code: 200
  vars:
    # name and password, for the same reason as the device inventory above (ADR 0065)
    have: >-
      {{ host_inv_existing.json.result.data | map(attribute='name')
         | zip(host_inv_existing.json.result.data | map(attribute='attributes.itential_password', default=''))
         | map('list') | sort }}
    want: >-
      {{ host_nodes | default([]) | map(attribute='name')
         | zip(host_nodes | default([]) | map(attribute='attributes.itential_password', default=''))
         | map('list') | sort }}
  when: have != want
  no_log: true

- name: Gateway 5 answers on one host through the host inventory (uptime, hostname)
  ansible.builtin.uri:
    url: "{{ platform_local }}/gateway_manager/v1/services/run"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      serviceName: send-command
      clusterId: "{{ stack.gateway5_cluster_id }}"
      params: {commands: "{{ hosts.probe }}"}
      inventory:
        - inventory: "{{ stack.host_inventory }}"
          nodeNames: ["{{ (host_nodes | default([]) | first).name }}"]
    status_code: 200
    timeout: 120
  register: host_probe
  failed_when: not (host_probe.json.result.results | map(attribute='success') | list | min)
  changed_when: false
  when: host_nodes | default([]) | length > 0

# --- Device Broker (ADR 0039): the built-in Inventory Manager adapter publishes the inventory's
# nodes to Device Broker, which is where Configuration Manager (backups, Golden Config,
# compliance), command templates and the MCP device tools read devices. Gateway 5 only.
# The instance cannot be called "InventoryManager" (that is the application's own name).
- name: Device Broker adapter exists?
  ansible.builtin.uri:
    url: "{{ platform_local }}/adapters/InventoryBroker"
    headers: {Cookie: "{{ login.cookies_string }}"}
    status_code: [200, 404, 500]
  register: broker_adapter

- name: Device Broker adapter (built-in Inventory Manager adapter)
  ansible.builtin.uri:
    url: "{{ platform_local }}/adapters"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: {properties: {name: InventoryBroker, type: Adapter, properties: {id: InventoryBroker, type: InventoryManager}}}
    status_code: [200, 201]
  when: broker_adapter.status != 200

- name: Device Broker adapter exposes the inventory under plain node names
  ansible.builtin.uri:
    url: "{{ platform_local }}/adapters/InventoryBroker/properties"
    method: PUT
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      properties:
        inventories: ["{{ stack.inventory }}"]
        prepend_inventory_name: false
    status_code: 200
  when: broker_adapter.status != 200 or (broker_adapter.json.data.properties.properties.inventories | default([])) != [stack.inventory]
  changed_when: true

- name: Device Broker adapter active
  ansible.builtin.uri:
    url: "{{ platform_local }}/adapters/InventoryBroker"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: broker_state
  until: broker_state.json.metadata.isActive | default(false)
  retries: 20
  delay: 3

- name: Configuration Manager sees every inventory node through the broker
  ansible.builtin.uri:
    url: "{{ platform_local }}/configuration_manager/devices"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: {options: {start: 0, limit: 200}}
  register: cm_devices
  until: (cm_devices.json.total | default(0)) | int == inv_nodes | length
  retries: 10
  delay: 3
  no_log: true

- name: Gateway 5 answers show version on one switch through the inventory (S4.3 building block)
  ansible.builtin.uri:
    url: "{{ platform_local }}/gateway_manager/v1/services/run"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      serviceName: send-command
      clusterId: "{{ stack.gateway5_cluster_id }}"
      params: {commands: ["show version"]}
      inventory:
        - inventory: "{{ stack.inventory }}"
          nodeNames: ["{{ (inv_nodes | selectattr('attributes.itential_platform', 'equalto', 'arista_eos') | first).name }}"]
    status_code: 200
    timeout: 300 # a slow first banner and login on the clab nodes (clab/versions.yaml gateway_driver_options)
  register: sv
  failed_when: not (sv.json.result.results | map(attribute='success') | list | min)
  changed_when: false

# --- NetBox prerequisites for Add Branch VLAN: one VLAN group per branch (VID 11-99) ------
# NetBox allocates the next free VID (POST vlan-groups/{id}/available-vlans/), so the workflow
# never guesses; groups are scoped to the branch site.
- name: Branch sites
  ansible.builtin.uri:
    url: "http://{{ netbox_oob_host }}:{{ netbox_port }}/api/dcim/sites/?slug=br1&slug=br2"
    headers: {Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"}
  register: nb_sites
  no_log: true

- name: Existing VLAN groups
  ansible.builtin.uri:
    url: "http://{{ netbox_oob_host }}:{{ netbox_port }}/api/ipam/vlan-groups/?limit=0"
    headers: {Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"}
  register: nb_vlan_groups
  no_log: true

- name: VLAN group per branch
  ansible.builtin.uri:
    url: "http://{{ netbox_oob_host }}:{{ netbox_port }}/api/ipam/vlan-groups/"
    method: POST
    headers: {Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"}
    body_format: json
    body:
      name: "{{ item.slug }}-user"
      slug: "{{ item.slug }}-user"
      scope_type: dcim.site
      scope_id: "{{ item.id }}"
      vid_ranges: [[11, 99]]
      description: "User VLANs reserved by Add Branch VLAN (Phase 5)"
    status_code: 201
  loop: "{{ nb_sites.json.results }}"
  loop_control:
    label: "{{ item.slug }}-user"
  # netbox_vlan_groups_managed defaults to true (production owns the groups); dev holds a view-only NetBox
  # token and must never write production NetBox (ADR 0063)
  when:
    - netbox_vlan_groups_managed | default(true)
    - (item.slug ~ '-user') not in (nb_vlan_groups.json.results | map(attribute='slug') | list)

# --- workflows: the documents in itential/workflows/ are code; every run replaces them ------
# (Automation Studio import; workflow_builder/import expects an encoded payload). Exported
# copies never drift from the generator because tests/test_itential.py checks the files.
- name: Workflow documents
  ansible.builtin.set_fact:
    wf_docs: "{{ lookup('ansible.builtin.fileglob', playbook_dir ~ '/../../itential/workflows/*.json', wantlist=True) | sort }}"

- name: Workflow documents parsed
  ansible.builtin.set_fact:
    wf_bodies: "{{ wf_bodies | default([]) + [lookup('ansible.builtin.file', item) | from_json] }}"
  loop: "{{ wf_docs }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Existing workflows
  ansible.builtin.uri:
    url: "{{ platform_local }}/automation-studio/workflows?limit=100"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: wf_existing

# The name is the document's own (ADR 0067: names carry spaces, so it is URL-encoded), not the file name.
- name: Remove the previous copies
  ansible.builtin.uri:
    url: "{{ platform_local }}/workflow_builder/workflows/delete/{{ item.name | urlencode }}"
    method: DELETE
    headers: {Cookie: "{{ login.cookies_string }}"}
    status_code: [200, 404]
  loop: "{{ wf_bodies }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in (wf_existing.json['items'] | map(attribute='name') | list)
  changed_when: true

- name: Import the workflows
  ansible.builtin.uri:
    url: "{{ platform_local }}/automation-studio/automations/import"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      automations: "{{ wf_bodies }}"
    status_code: 200
  register: wf_import
  failed_when: wf_import.json.imported | rejectattr('success') | list | length > 0
  changed_when: true

# ADR 0067: the pre-rename copies go once their successors are in. The agents drop their links to them in
# flowai.yml (removeTools), and the schedules and LCM actions follow the new names in their own tasks.
- name: Remove the retired workflow names
  ansible.builtin.uri:
    url: "{{ platform_local }}/workflow_builder/workflows/delete/{{ item | urlencode }}"
    method: DELETE
    headers: {Cookie: "{{ login.cookies_string }}"}
    status_code: [200, 404]
  loop: "{{ retired_workflows }}"
  when: item in (wf_existing.json['items'] | map(attribute='name') | list)
  changed_when: true
