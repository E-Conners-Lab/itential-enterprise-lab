---
# ADR 0068 steps 4-5: the executable services on the Gateway - the private repository (cloned with the deploy key
# alias), the Python executable object and the services (terraform-run, aws-vpn-psk) with their Vault-backed secrets. Imported through the
# Platform like the Vault provider (tasks/gateway-vault.yml): the import replaces items by name and drops unknown
# fields without a word, so the export is compared after it. Measured on the dev tier 2026-09-29.
# Runs on the Gateway host inside a play that has `login` (a Platform session) and `platform_local`.
- name: Gateway configuration now (terraform-run)
  ansible.builtin.uri:
    url: "{{ platform_local }}/gateway_manager/v1/gateways/{{ stack.gateway5_cluster_id }}/configuration/export"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: gw_tr_export
  no_log: true # the export carries `users` with a password field

- name: The terraform-run items wanted (the iagctl db import form)
  ansible.builtin.set_fact:
    gw_tr_wanted:
      repositories:
        - name: "{{ terraform_run.repository.name }}"
          description: "{{ terraform_run.repository.description }}"
          url: "{{ vault.git.url }}"
          reference: "{{ terraform_run.repository.reference }}"
          private-key-name: cloud-devops-pipeline-deploy-key
      executable-objects:
        - "{{ terraform_run.executable_object }}"
      services: "{{ gw_tr_services | map('combine', gw_tr_common) | sort(attribute='name') | list }}"
  vars:
    # the step-6 services only on the dev tier (versions.yaml terraform_run.dev_services)
    gw_tr_services: "{{ terraform_run.services + (terraform_run.dev_services if dev_overlay | default(false) | bool else []) }}"
    gw_tr_common:
      type: executable
      repository: "{{ terraform_run.repository.name }}"
      executable-object: "{{ terraform_run.executable_object.name }}"
      arg-format: "{% raw %}--{{.Key}} {{.Value}}{% endraw %}" # a Go template the Gateway fills, not Jinja
      runtime: {}

- name: What the Gateway holds for terraform-run
  ansible.builtin.set_fact:
    gw_tr_have:
      repositories: >-
        {{ gw_tr_export.json.repositories | default([], true)
           | selectattr('name', 'equalto', terraform_run.repository.name) | list }}
      executable-objects: >-
        {{ gw_tr_export.json['executable-objects'] | default([], true)
           | selectattr('name', 'equalto', terraform_run.executable_object.name) | list }}
      services: >-
        {{ gw_tr_export.json.services | default([], true)
           | selectattr('name', 'in', gw_tr_wanted.services | map(attribute='name') | list)
           | sort(attribute='name') | list }}

- name: Import terraform-run (replaces the three items by name)
  ansible.builtin.uri:
    url: "{{ platform_local }}/gateway_manager/v1/gateways/{{ stack.gateway5_cluster_id }}/configuration/import"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: {options: {source: content, content: "{{ gw_tr_wanted }}", force: true}}
  register: gw_tr_import
  when: gw_tr_have != gw_tr_wanted
  changed_when: true

- name: Gateway configuration after the import (terraform-run)
  ansible.builtin.uri:
    url: "{{ platform_local }}/gateway_manager/v1/gateways/{{ stack.gateway5_cluster_id }}/configuration/export"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: gw_tr_after
  when: gw_tr_import is changed
  no_log: true

- name: The export matches what was sent (the import drops unknown fields without a word)
  ansible.builtin.assert:
    that:
      - >-
        (gw_tr_after.json.repositories | selectattr('name', 'equalto', terraform_run.repository.name) | list)
        == gw_tr_wanted.repositories
      - >-
        (gw_tr_after.json['executable-objects'] | selectattr('name', 'equalto', terraform_run.executable_object.name)
         | list) == gw_tr_wanted['executable-objects']
      - >-
        (gw_tr_after.json.services | selectattr('name', 'in', gw_tr_wanted.services | map(attribute='name') | list)
         | sort(attribute='name') | list) == gw_tr_wanted.services
    fail_msg: "the Gateway stored something other than the terraform-run items sent: compare the export by hand"
    quiet: true
  when: gw_tr_import is changed
