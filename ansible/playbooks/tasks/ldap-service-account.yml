---
# svc-copilot, the GitHub Copilot service account (ADR 0063, PID S12), shared by the dev stack
# (itential.yml, svc_role_set dev) and production (copilot-access.yml, svc_role_set prod). One definition:
# the directory entry, the Platform account its first login provisions, the group's roles from
# itential/copilot/roles.yaml, and the proof that the account's own session sees the group.
#
# The caller provides:
#   ldap_container_host  the host running the `openldap` container (dev: the stack VM; prod: tools-01)
#   svc_user, svc_group  the account and its LDAP group; the group must start with `copilot-`
#   password_env         the .env key holding the account's password (SVC_COPILOT_DEV/PROD_PASSWORD)
#   svc_role_set         prod | dev, the half of the role oracle to apply
#   platform_local, login  the Platform URL and an administrator session (as ldap-admin.yml expects)
# and optionally svc_password (a value the caller already generated and persisted), ldap_bind_password (the
# directory admin's; the upstream compose default `admin` unless the caller's directory uses another),
# mongo_shell_argv / mongo_shell_host (the fallback path, as tasks/ldap-admin.yml), env_file.
#
# Why a task file and not the LDIF: itential/ldap/openldap.ldif is vendored upstream and pinned by sha256
# (itential/versions.yaml stack.ldif_sha256). The entry is added to the running directory with ldapadd instead,
# in the upstream entries' own shape, so the pin keeps meaning "unchanged from upstream". Nothing here writes
# that file.
#
# Secrets: every password reaches a process on stdin, never in argv (argv is visible in `ps` on the host and
# in the task's own log). The ldap* tools read a password only from a file (-y / -T), so a small sh wrapper
# inside the container reads the first stdin line into a 0600 temp file, runs the tool, and removes the file.

- name: Role oracle, DNs and the directory wrapper for {{ svc_user }}
  ansible.builtin.set_fact:
    svc_roles_oracle: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../../itential/copilot/roles.yaml') | from_yaml }}"
    svc_user_dn: "cn={{ svc_user }},{{ ldap_base_dn | default('dc=itential,dc=io') }}"
    svc_group_dn: "cn={{ svc_group }},{{ ldap_base_dn | default('dc=itential,dc=io') }}"
    svc_ldap_admin_dn: "cn=admin,{{ ldap_base_dn | default('dc=itential,dc=io') }}"
    svc_env_file: "{{ env_file | default(playbook_dir ~ '/../../.env') }}"
    # sh -c '<script>' ldap <tool> <args...>: the first stdin line becomes the tool's -y password file
    svc_ldap_run:
      - docker
      - exec
      - -i
      - "{{ ldap_container | default('openldap') }}"
      - sh
      - -c
      - 'umask 077; IFS= read -r pw; f=$(mktemp); printf %s "$pw" > "$f"; cmd=$1; shift; "$cmd" -y "$f" "$@"; rc=$?; rm -f "$f"; exit $rc'
      - ldap

# The guard is here as well as in the plays: this file writes a group's roles, and the only groups any caller
# may ever write are the Copilot ones. admin_group and the upstream admins/builders/operators stay untouched.
- name: Only a copilot- group, and the group the oracle names for this environment
  ansible.builtin.assert:
    that:
      - svc_group is match('copilot-')
      - svc_role_set in ['prod', 'dev']
      - svc_group == svc_roles_oracle[svc_role_set].group
      - password_env is match('SVC_COPILOT_')
    fail_msg: "svc_group={{ svc_group }} svc_role_set={{ svc_role_set }}: not the Copilot group roles.yaml names"
    quiet: true

# --- The password: persisted to .env before anything uses it (lab-build-lessons) ---------------------------
# Order of preference: the caller's value (itential.yml generates it before the stack .env renders it for
# mcp-dev), the environment, the .env file itself (a play run without `set -a; . ./.env`), and only then a new
# one. Reading the file too means a forgotten `load_env` does not silently rotate a working password.
- name: Password generated only when none exists, for {{ svc_user }}
  ansible.builtin.set_fact:
    svc_pw: >-
      {{ svc_password | default('', true)
         | default(lookup('ansible.builtin.env', password_env), true)
         | default((lookup('ansible.builtin.file', svc_env_file, errors='ignore') | default('', true)
                    | regex_findall('^' ~ password_env ~ '=([A-Za-z0-9]+)', multiline=True) or [''])[0], true)
         | default(lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']), true) }}
  no_log: true

- name: Password persisted to .env before use ({{ password_env }})
  ansible.builtin.lineinfile:
    path: "{{ svc_env_file }}"
    regexp: "^{{ password_env }}="
    line: "{{ password_env }}={{ svc_pw }}"
    create: false
  delegate_to: localhost
  become: false
  no_log: true

- name: The directory's admin password (stdin only)
  ansible.builtin.set_fact:
    svc_ldap_bind_pw: "{{ ldap_bind_password | default('admin', true) }}"
  no_log: true

# --- The directory entry ----------------------------------------------------------------------------------
- name: Directory search (rc 32 = no such object) for user {{ svc_user }}
  ansible.builtin.command:
    argv: >-
      {{ svc_ldap_run + ['ldapsearch', '-x', '-LLL', '-H', 'ldap://localhost', '-o', 'ldif_wrap=no',
                         '-D', svc_ldap_admin_dn, '-b', svc_user_dn, '-s', 'base', 'memberOf'] }}
    stdin: "{{ svc_ldap_bind_pw }}"
  delegate_to: "{{ ldap_container_host }}"
  register: svc_ldap_user
  changed_when: false
  failed_when: false
  no_log: true

- name: Directory search for group {{ svc_group }}
  ansible.builtin.command:
    argv: >-
      {{ svc_ldap_run + ['ldapsearch', '-x', '-LLL', '-H', 'ldap://localhost', '-o', 'ldif_wrap=no',
                         '-D', svc_ldap_admin_dn, '-b', svc_group_dn, '-s', 'base', 'member'] }}
    stdin: "{{ svc_ldap_bind_pw }}"
  delegate_to: "{{ ldap_container_host }}"
  register: svc_ldap_group
  changed_when: false
  failed_when: false
  no_log: true

# no_log above hides the result, so the outcome is re-stated here without anything secret in it
- name: Both searches answered (0 present, 32 absent)
  ansible.builtin.assert:
    that:
      - svc_ldap_user.rc in [0, 32]
      - svc_ldap_group.rc in [0, 32]
    fail_msg: >-
      ldapsearch rc user={{ svc_ldap_user.rc }} group={{ svc_ldap_group.rc }}:
      {{ svc_ldap_user.stderr | default('') }} {{ svc_ldap_group.stderr | default('') }}
    quiet: true

# Drift: the entry exists but .env holds a different password (a restored .env, a hand edit). The bind as the
# account itself is the only independent check; the stored hash cannot be compared.
- name: Does the .env password bind as {{ svc_user }}
  ansible.builtin.command:
    argv: "{{ svc_ldap_run + ['ldapwhoami', '-x', '-H', 'ldap://localhost', '-D', svc_user_dn] }}"
    stdin: "{{ svc_pw }}"
  delegate_to: "{{ ldap_container_host }}"
  register: svc_ldap_bind
  changed_when: false
  failed_when: false
  when: svc_ldap_user.rc == 0
  no_log: true

- name: Salted hash of the password (slappasswd reads it from stdin)
  ansible.builtin.command:
    argv: [docker, exec, -i, "{{ ldap_container | default('openldap') }}", slappasswd, -h, "{SSHA}", -T, /dev/stdin]
    stdin: "{{ svc_pw }}"
    stdin_add_newline: false # -T takes the file's whole content, a newline included
  delegate_to: "{{ ldap_container_host }}"
  register: svc_ssha
  changed_when: false
  when: svc_ldap_user.rc == 32 or (svc_ldap_bind.rc | default(0)) != 0
  no_log: true

# Upstream order: groups before users (itential/ldap/openldap.ldif), so the group's member DN is written first
# and the user's memberOf names a group that exists.
- name: Group added (groupOfNames, upstream shape) as {{ svc_group }}
  ansible.builtin.command:
    argv: "{{ svc_ldap_run + ['ldapadd', '-x', '-H', 'ldap://localhost', '-D', svc_ldap_admin_dn] }}"
    stdin: |
      {{ svc_ldap_bind_pw }}
      dn: {{ svc_group_dn }}
      cn: {{ svc_group }}
      member: {{ svc_user_dn }}
      objectclass: groupOfNames
  delegate_to: "{{ ldap_container_host }}"
  when: svc_ldap_group.rc == 32
  changed_when: true
  no_log: true

- name: The existing group gains the member {{ svc_user }}
  ansible.builtin.command:
    argv: "{{ svc_ldap_run + ['ldapmodify', '-x', '-H', 'ldap://localhost', '-D', svc_ldap_admin_dn] }}"
    stdin: |
      {{ svc_ldap_bind_pw }}
      dn: {{ svc_group_dn }}
      changetype: modify
      add: member
      member: {{ svc_user_dn }}
  delegate_to: "{{ ldap_container_host }}"
  when:
    - svc_ldap_group.rc == 0
    - '("member: " ~ svc_user_dn) not in svc_ldap_group.stdout'
  changed_when: true
  no_log: true

- name: User added (organizationalRole + simpleSecurityObject, upstream shape) as {{ svc_user }}
  ansible.builtin.command:
    argv: "{{ svc_ldap_run + ['ldapadd', '-x', '-H', 'ldap://localhost', '-D', svc_ldap_admin_dn] }}"
    stdin: |
      {{ svc_ldap_bind_pw }}
      dn: {{ svc_user_dn }}
      cn: {{ svc_user }}
      userPassword: {{ svc_ssha.stdout | trim }}
      description: GitHub Copilot service account (ADR 0063)
      memberOf: {{ svc_group_dn }}
      objectclass: organizationalRole
      objectclass: simpleSecurityObject
  delegate_to: "{{ ldap_container_host }}"
  when: svc_ldap_user.rc == 32
  changed_when: true
  no_log: true

- name: Password drift repaired (.env is the record) for {{ svc_user }}
  ansible.builtin.command:
    argv: "{{ svc_ldap_run + ['ldapmodify', '-x', '-H', 'ldap://localhost', '-D', svc_ldap_admin_dn] }}"
    stdin: |
      {{ svc_ldap_bind_pw }}
      dn: {{ svc_user_dn }}
      changetype: modify
      replace: userPassword
      userPassword: {{ svc_ssha.stdout | trim }}
  delegate_to: "{{ ldap_container_host }}"
  when: svc_ldap_user.rc == 0 and (svc_ldap_bind.rc | default(0)) != 0
  changed_when: true
  no_log: true

# The LDAP adapter reads groups from the user's memberOf (userMembershipAttribute, tasks/ldap-admin.yml)
- name: The existing entry's memberOf names {{ svc_group }}
  ansible.builtin.command:
    argv: "{{ svc_ldap_run + ['ldapmodify', '-x', '-H', 'ldap://localhost', '-D', svc_ldap_admin_dn] }}"
    stdin: |
      {{ svc_ldap_bind_pw }}
      dn: {{ svc_user_dn }}
      changetype: modify
      add: memberOf
      memberOf: {{ svc_group_dn }}
  delegate_to: "{{ ldap_container_host }}"
  when:
    - svc_ldap_user.rc == 0
    - '("memberOf: " ~ svc_group_dn) not in svc_ldap_user.stdout'
  changed_when: true
  no_log: true

- name: The .env password now binds as {{ svc_user }}
  ansible.builtin.command:
    argv: "{{ svc_ldap_run + ['ldapwhoami', '-x', '-H', 'ldap://localhost', '-D', svc_user_dn] }}"
    stdin: "{{ svc_pw }}"
  delegate_to: "{{ ldap_container_host }}"
  register: svc_ldap_bind_after
  changed_when: false
  failed_when: false
  no_log: true

- name: Directory bind proven for {{ svc_user }}
  ansible.builtin.assert:
    that: svc_ldap_bind_after.rc == 0
    fail_msg: "ldapwhoami as {{ svc_user_dn }} rc={{ svc_ldap_bind_after.rc }}: {{ svc_ldap_bind_after.stderr | default('') }}"
    quiet: true

# --- The Platform account and its group ----------------------------------------------------------------------
# Measured on production 6.5.2: an LDAP login creates the account and every group in its memberOf as a
# Platform group with provenance LDAP and no roles (admins, builders, operators exist that way).
- name: First Platform login provisions the account and the group for {{ svc_user }}
  ansible.builtin.uri:
    url: "{{ platform_local }}/login"
    method: POST
    body_format: json
    body: {username: "{{ svc_user }}", password: "{{ svc_pw }}"}
    status_code: 200
  register: svc_login
  retries: 5
  delay: 3
  until: svc_login.status == 200
  no_log: true

- name: Every role, page by page (the group's set is resolved against the Platform's own list)
  ansible.builtin.uri:
    url: "{{ platform_local }}/authorization/roles?limit=100&skip={{ item }}"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: svc_role_pages
  loop: [0, 100, 200, 300, 400]
  loop_control:
    label: "skip={{ item }}"

- name: Role list
  ansible.builtin.set_fact:
    svc_all_roles: "{{ svc_role_pages.results | map(attribute='json.results') | flatten }}"
    svc_role_total: "{{ svc_role_pages.results[0].json.total | int }}"

- name: All roles collected
  ansible.builtin.assert:
    that: svc_all_roles | length == svc_role_total | int
    fail_msg: "collected {{ svc_all_roles | length }} of {{ svc_role_total }} roles (more than 500: add a page)"
    quiet: true

# prod: exactly the oracle's built-ins plus its custom roles by name. dev: everything but the oracle's exclusions.
# A role is "<provenance>/<name>", the same key roles.yaml and the tests use.
- name: The intended role set ({{ svc_role_set }})
  ansible.builtin.set_fact:
    svc_want: >-
      {%- set o = svc_roles_oracle[svc_role_set] -%}
      {%- set out = [] -%}
      {%- if svc_role_set == 'prod' -%}
        {%- set keys = o.builtin | map(attribute='provenance') | zip(o.builtin | map(attribute='name')) | map('join', '/') | list -%}
        {%- set customs = o.custom | map(attribute='name') | list -%}
        {%- for r in svc_all_roles if (r.provenance ~ '/' ~ r.name) in keys or r.name in customs -%}
          {%- set _ = out.append({'roleId': r._id, 'key': r.provenance ~ '/' ~ r.name, 'name': r.name}) -%}
        {%- endfor -%}
      {%- else -%}
        {%- set keys = o.exclude | map(attribute='provenance') | zip(o.exclude | map(attribute='name')) | map('join', '/') | list -%}
        {%- for r in svc_all_roles if (r.provenance ~ '/' ~ r.name) not in keys -%}
          {%- set _ = out.append({'roleId': r._id, 'key': r.provenance ~ '/' ~ r.name, 'name': r.name}) -%}
        {%- endfor -%}
      {%- endif -%}
      {{ out }}

# Runtime twin of tests/test_copilot_access.py: a role renamed or re-provenanced by an upgrade must fail here,
# not quietly shrink or widen what Copilot holds on production.
- name: Every oracle role exists and nothing denied is in the production set
  ansible.builtin.assert:
    that:
      - missing | length == 0
      - denied | length == 0
      - svc_want | length > 0
    fail_msg: "missing from the Platform: {{ missing }}; denied but selected: {{ denied }}"
    quiet: true
  vars:
    o: "{{ svc_roles_oracle.prod }}"
    want_keys: "{{ svc_want | map(attribute='key') | list }}"
    want_names: "{{ svc_want | map(attribute='name') | list }}"
    oracle_keys: "{{ o.builtin | map(attribute='provenance') | zip(o.builtin | map(attribute='name')) | map('join', '/') | list }}"
    deny_re: >-
      ^({{ o.deny | map(attribute='provenance') | zip(o.deny | map(attribute='name')) | map('join', '/')
           | map('replace', '*', 'GLOBSTAR') | map('regex_escape') | map('replace', 'GLOBSTAR', '.*') | join('|') }})$
    missing: >-
      {{ (oracle_keys | difference(want_keys)) + (o.custom | map(attribute='name') | difference(want_names))
         if svc_role_set == 'prod' else [] }}
    denied: "{{ want_keys | select('match', deny_re) | list if svc_role_set == 'prod' else [] }}"

- name: Groups after the account's first login
  ansible.builtin.uri:
    url: "{{ platform_local }}/authorization/groups?limit=100"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: svc_groups

- name: The group document and its current roles for {{ svc_group }}
  ansible.builtin.set_fact:
    svc_group_doc: "{{ svc_groups.json.results | selectattr('name', 'equalto', svc_group) | list }}"
    svc_want_ids: "{{ svc_want | map(attribute='roleId') | sort }}"

# The only group write in the Copilot tasks: by id, to the group named svc_group, which the assert at the top
# holds to copilot-*. Skipped when the roles already match.
- name: Roles from the oracle (copilot- groups only) for {{ svc_group }}
  ansible.builtin.uri:
    url: "{{ platform_local }}/authorization/groups/{{ svc_group_doc[0]._id }}"
    method: PATCH
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: {updates: {assignedRoles: "{{ svc_want | map(attribute='roleId') | map('community.general.dict_kv', 'roleId') | list }}"}}
    status_code: 200
  when:
    - svc_group is match('copilot-')
    - svc_group_doc | length == 1
    - (svc_group_doc[0].assignedRoles | default([]) | map(attribute='roleId') | sort) != svc_want_ids
  changed_when: true

# Whether a role assignment on an LDAP-provenance group survives the next login of a member was not measured
# before ADR 0063, so it is measured here: log in as the account again, then re-read the group and the session.
- name: Log in again as {{ svc_user }}
  ansible.builtin.uri:
    url: "{{ platform_local }}/login"
    method: POST
    body_format: json
    body: {username: "{{ svc_user }}", password: "{{ svc_pw }}"}
    status_code: 200
  register: svc_login2
  no_log: true

- name: Whoami as {{ svc_user }}
  ansible.builtin.uri:
    url: "{{ platform_local }}/whoami"
    headers: {Cookie: "{{ svc_login2.cookies_string }}"}
  register: svc_whoami

- name: Groups re-read after that login
  ansible.builtin.uri:
    url: "{{ platform_local }}/authorization/groups?limit=100"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: svc_groups2

- name: Did the LDAP group keep its roles, and does the session see it
  ansible.builtin.set_fact:
    svc_whoami_groups: "{{ whoami_groups }}"
    svc_group_persisted: >-
      {{ (again | length == 1) and (again[0].assignedRoles | default([]) | map(attribute='roleId') | sort) == svc_want_ids
         and svc_group in whoami_groups }}
  vars:
    again: "{{ svc_groups2.json.results | selectattr('name', 'equalto', svc_group) | list }}"
    # whoami lists groups as names or as documents, depending on the application that asks; accept both
    whoami_groups: >-
      {{ (svc_whoami.json.groups | default([]) | select('mapping') | map(attribute='name') | list)
         + (svc_whoami.json.groups | default([]) | reject('mapping') | list) }}

# --- Fallback: a Pronghorn group and a database membership, as tasks/ldap-admin.yml does for admin@itential ----
# Taken only when the measurement above says the LDAP group did not keep its roles (or was never created).
# The group is still a copilot- group, so nothing but Copilot's own records is written.
- name: Fallback group name
  ansible.builtin.set_fact:
    svc_fallback_group: "{{ svc_group }}-local"
  when: not (svc_group_persisted | bool)

- name: Fallback is allowed and stays a copilot- group
  ansible.builtin.assert:
    that:
      - ldap_service_account_fallback | default(true) | bool
      - svc_fallback_group is match('copilot-')
    fail_msg: >-
      the {{ svc_group }} LDAP group did not keep its roles across a login and the fallback is disabled
      (ldap_service_account_fallback=false)
    quiet: true
  when: not (svc_group_persisted | bool)

- name: Fallback group with the oracle's roles, {{ svc_fallback_group | default('') }}
  ansible.builtin.uri:
    url: "{{ platform_local }}/authorization/groups{{ '/' ~ existing[0]._id if existing else '' }}"
    method: "{{ 'PATCH' if existing else 'POST' }}"
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: >-
      {{ {'updates': {'assignedRoles': svc_fallback_roles}} if existing else
         {'group': {'name': svc_fallback_group, 'provenance': 'Pronghorn',
                    'description': 'GitHub Copilot service account roles (ADR 0063, fallback)',
                    'assignedRoles': svc_fallback_roles, 'memberOf': [], 'inactive': false}} }}
    status_code: [200, 201]
  vars:
    existing: "{{ svc_groups2.json.results | selectattr('name', 'equalto', svc_fallback_group) | list }}"
    svc_fallback_roles: "{{ svc_want | map(attribute='roleId') | map('community.general.dict_kv', 'roleId') | list }}"
  when:
    - not (svc_group_persisted | bool)
    - svc_fallback_group is match('copilot-')
  changed_when: true

# The accounts API does not persist memberOf (tasks/ldap-admin.yml), so the membership is a database write.
# no_log: on production the mongosh argv carries the MongoDB admin URI with its password.
- name: Fallback membership in the fallback group (database, idempotent) for {{ svc_user }}
  ansible.builtin.command:
    argv: "{{ mongo_shell_argv | default(['docker', 'exec', 'mongodb', 'mongosh', '--quiet', 'itential', '--eval']) + [svc_member_eval] }}"
  delegate_to: "{{ mongo_shell_host | default(inventory_hostname) }}"
  vars:
    svc_member_eval: >-
        const g = db.groups.findOne({name: '{{ svc_fallback_group }}'}, {_id: 1});
        if (!g) { print('NOGROUP'); quit(1); }
        const u = {username: '{{ svc_user }}', provenance: 'LDAP'};
        const a = db.accounts.findOne(u, {memberOf: 1});
        if (!a) { print('NOUSER'); quit(1); }
        if ((a.memberOf || []).some(m => String(m.groupId) === String(g._id))) { print('OK'); }
        else { db.accounts.updateOne(u, {$push: {memberOf: {aaaManaged: false, groupId: g._id}}}); print('CHANGED'); }
  register: svc_member_db
  changed_when: "'CHANGED' in svc_member_db.stdout"
  failed_when: "'OK' not in svc_member_db.stdout and 'CHANGED' not in svc_member_db.stdout"
  when: not (svc_group_persisted | bool)
  no_log: true

- name: Fallback login as {{ svc_user }}
  ansible.builtin.uri:
    url: "{{ platform_local }}/login"
    method: POST
    body_format: json
    body: {username: "{{ svc_user }}", password: "{{ svc_pw }}"}
    status_code: 200
  register: svc_login3
  when: not (svc_group_persisted | bool)
  no_log: true

- name: Fallback whoami as {{ svc_user }}
  ansible.builtin.uri:
    url: "{{ platform_local }}/whoami"
    headers: {Cookie: "{{ svc_login3.cookies_string }}"}
  register: svc_whoami3
  when: not (svc_group_persisted | bool)

- name: Fallback groups seen by the session
  ansible.builtin.set_fact:
    svc_whoami_groups: >-
      {{ (svc_whoami3.json.groups | default([]) | select('mapping') | map(attribute='name') | list)
         + (svc_whoami3.json.groups | default([]) | reject('mapping') | list) }}
  when: not (svc_group_persisted | bool)

- name: The session holds the Copilot group (the LDAP one or the fallback) for {{ svc_user }}
  ansible.builtin.assert:
    that:
      - (svc_group if svc_group_persisted | bool else svc_fallback_group) in svc_whoami_groups
      # a Copilot group is never admin_group, and the session must not have picked one up
      - "'admin_group' not in svc_whoami_groups"
    fail_msg: "whoami groups for {{ svc_user }}: {{ svc_whoami_groups }}"
    quiet: true

# ADR 0063: the group the caller's inventories and gateway grant to the account. The dev overlay reads it
# (inventory_groups, gateway_groups), so a measured fallback lands the devices on copilot-builders-local instead
# of on a group the session does not hold.
- name: The Copilot group this environment really uses, for {{ svc_user }}
  ansible.builtin.set_fact:
    svc_effective_group: "{{ svc_group if svc_group_persisted | bool else svc_fallback_group }}"
