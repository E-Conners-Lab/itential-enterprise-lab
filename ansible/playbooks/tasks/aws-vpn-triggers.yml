---
# How the AWS VPN workflows are started (ADR 0068 step 5; Hand Off and Verify since build step 9). Run once per workflow
# (platform.yml loops it with `wt`: key = the workflows / forms / operations_manager key, schema = what the endpoint
# trigger accepts, description). For each: an Operations Manager automation wraps the workflow, with two triggers:
#   - an ENDPOINT trigger (its route): the branded page (itential/portal) POSTs the plain variables to
#     /operations-manager/triggers/endpoint/<route> under the engineer's own session. It needs verb POST and a body
#     schema at creation, or the route answers 404 (measured 2026-09-23). The schema refuses a bad request with a 400
#     before it becomes a job (security review 2026-09-29, WEB-01): the same bounds the workflow checks itself;
#   - a MANUAL trigger with the workflow's JSON form, the fallback in the Platform UI. The form must be set when the
#     trigger is created (a PATCHed formId does not take, measured 2026-09-23); legacyWrapper false maps the form's
#     fields straight onto the workflow's inputs.
# Operations Manager updates are PATCH (PUT is 404). Needs: login, platform_local, forms_dir, wt.
- name: "Form document ({{ workflows[wt.key] }})"
  ansible.builtin.set_fact:
    dav_form: "{{ lookup('ansible.builtin.file', forms_dir ~ '/' ~ forms[wt.key] ~ '.json') | from_json }}"
    dav: "{{ operations_manager[wt.key] }}"
    dav_schema: "{{ wt.schema }}"

- name: "Existing forms ({{ workflows[wt.key] }})"
  ansible.builtin.uri:
    url: "{{ platform_local }}/json-forms/forms"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: dav_forms_now

- name: "Form created ({{ workflows[wt.key] }})"
  ansible.builtin.uri:
    url: "{{ platform_local }}/json-forms/forms"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: "{{ dav_form }}"
    status_code: [200, 201]
  when: forms[wt.key] not in (dav_forms_now.json | map(attribute='name') | list)
  changed_when: true

- name: "Form replaced when it changed ({{ workflows[wt.key] }})"
  ansible.builtin.uri:
    url: "{{ platform_local }}/json-forms/forms/{{ have.id }}"
    method: PUT
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      options: >-
        {{ dav_form | combine({'created': have.created, 'createdBy': have.createdBy,
                               'lastUpdated': have.lastUpdated, 'lastUpdatedBy': have.lastUpdatedBy}) }}
    status_code: 200
  vars:
    have: "{{ (dav_forms_now.json | selectattr('name', 'equalto', forms[wt.key]) | first) | default({}) }}"
  when: >-
    have | length > 0 and (have.struct != dav_form.struct or have.schema != dav_form.schema
    or have.uiSchema != dav_form.uiSchema or have.description != dav_form.description)
  changed_when: true

- name: "Forms and workflows now ({{ workflows[wt.key] }})"
  ansible.builtin.uri:
    url: "{{ platform_local }}/{{ item }}"
    headers: {Cookie: "{{ login.cookies_string }}"}
  loop:
    - json-forms/forms
    - automation-studio/workflows?limit=500
    - operations-manager/automations?equalsField=componentType&equals=workflows&limit=100
  register: dav_now

- name: "Ids ({{ workflows[wt.key] }})"
  ansible.builtin.set_fact:
    dav_form_id: "{{ (dav_now.results[0].json | selectattr('name', 'equalto', forms[wt.key]) | first).id }}"
    dav_wf_id: "{{ (dav_now.results[1].json['items'] | selectattr('name', 'equalto', workflows[wt.key]) | first)._id }}"
    dav_auto: "{{ (dav_now.results[2].json.data | selectattr('name', 'equalto', dav.automation) | first) | default({}) }}"

- name: "The automation wrapping it ({{ workflows[wt.key] }})"
  ansible.builtin.uri:
    url: "{{ platform_local }}/operations-manager/automations"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      name: "{{ dav.automation }}"
      description: "{{ wt.description }}"
      componentType: workflows
      componentId: "{{ dav_wf_id }}"
      componentName: "{{ workflows[wt.key] }}"
    status_code: [200, 201]
  register: dav_created
  when: dav_auto | length == 0
  changed_when: true

- name: "The automation follows the re-imported workflow ({{ workflows[wt.key] }})"
  ansible.builtin.uri:
    url: "{{ platform_local }}/operations-manager/automations/{{ dav_auto._id }}"
    method: PATCH
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: {componentType: workflows, componentId: "{{ dav_wf_id }}", componentName: "{{ workflows[wt.key] }}"}
    status_code: 200
  when: dav_auto | length > 0 and dav_auto.componentId != dav_wf_id
  changed_when: true

- name: "Automation id ({{ workflows[wt.key] }})"
  ansible.builtin.set_fact:
    dav_auto_id: "{{ dav_auto._id if dav_auto | length > 0 else (dav_created.json.data._id | default(dav_created.json._id)) }}"

- name: "Triggers of the automation ({{ workflows[wt.key] }})"
  ansible.builtin.uri:
    url: "{{ platform_local }}/operations-manager/triggers?equalsField=actionId&equals={{ dav_auto_id }}&limit=100"
    headers: {Cookie: "{{ login.cookies_string }}"}
  register: dav_triggers

- name: "Its endpoint trigger, if it exists ({{ workflows[wt.key] }})"
  ansible.builtin.set_fact:
    dav_endpoint: >-
      {{ dav_triggers.json.data | selectattr('name', 'equalto', dav.endpoint.name) | list }}

- name: "The branded page's endpoint trigger ({{ workflows[wt.key] }})"
  ansible.builtin.uri:
    url: "{{ platform_local }}/operations-manager/triggers"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      name: "{{ dav.endpoint.name }}"
      description: "POST the inputs as JSON (itential/portal/deploy-aws-vpn, the AWS VPN journey page)"
      type: endpoint
      enabled: true
      actionType: automations
      actionId: "{{ dav_auto_id }}"
      routeName: "{{ dav.endpoint.route }}"
      verb: POST
      schema: "{{ dav_schema }}"
    status_code: [200, 201]
  when: dav_endpoint | length == 0
  changed_when: true

# an existing trigger keeps its old schema otherwise (it was only ever created): Operations Manager updates are PATCH
- name: "The endpoint trigger's schema is current ({{ workflows[wt.key] }})"
  ansible.builtin.uri:
    url: "{{ platform_local }}/operations-manager/triggers/{{ dav_endpoint[0]._id }}"
    method: PATCH
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body: {schema: "{{ dav_schema }}"}
    status_code: [200]
  when: dav_endpoint | length > 0 and (dav_endpoint[0].schema | default({})) != dav_schema
  changed_when: true

- name: "The form's manual trigger ({{ workflows[wt.key] }})"
  ansible.builtin.uri:
    url: "{{ platform_local }}/operations-manager/triggers"
    method: POST
    headers: {Cookie: "{{ login.cookies_string }}"}
    body_format: json
    body:
      name: "{{ dav.manual.name }}"
      description: "The Platform UI fallback: the same inputs as the branded page"
      type: manual
      enabled: true
      actionType: automations
      actionId: "{{ dav_auto_id }}"
      formId: "{{ dav_form_id }}"
      legacyWrapper: false
    status_code: [200, 201]
  when: dav.manual.name not in (dav_triggers.json.data | map(attribute='name') | list)
  changed_when: true
