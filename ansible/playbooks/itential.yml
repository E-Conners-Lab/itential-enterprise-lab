---
# Phase 5, slice B: the itential-dev-stack on the prepared VM (ADR 0035). Runs after
# itential-host.yml and `images/fetch.sh itential-load`. Secrets are generated once on the
# workstation and persisted to the repo .env before anything uses them (lab-build-lessons).
# Order: secrets -> stack files + env on the VM -> Gateway 5 client cert -> compose up -> health
# -> Gateway Manager registration. Platform login stays admin/<ITENTIAL_ADMIN_PASSWORD> (owner decision).
- name: Phase 5 secrets, persisted before use
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    env_file: "{{ playbook_dir }}/../../.env"
  tasks:
    - name: Current values
      ansible.builtin.set_fact:
        cur_key: "{{ lookup('ansible.builtin.env', 'ITENTIAL_ENCRYPTION_KEY') }}"
        admin_pw: "{{ lookup('ansible.builtin.env', 'ITENTIAL_ADMIN_PASSWORD') }}"
      no_log: true

    - name: Admin password must be set in .env (owner decision 2026-09-07, the built-in admin keeps the dev-stack password)
      ansible.builtin.assert:
        that: admin_pw | length > 0
        fail_msg: ITENTIAL_ADMIN_PASSWORD missing from .env
        quiet: true

    # The encryption key protects every stored adapter secret; it is generated exactly once.
    - name: Encryption key (64 hex) generated once
      ansible.builtin.set_fact:
        enc_key: >-
          {{ cur_key if cur_key | length == 64
             else lookup('ansible.builtin.password', '/dev/null', length=64, chars=['hexdigits']) | lower }}
      no_log: true

    - name: Persist to .env before use
      ansible.builtin.lineinfile:
        path: "{{ env_file }}"
        regexp: "^ITENTIAL_ENCRYPTION_KEY="
        line: "ITENTIAL_ENCRYPTION_KEY={{ enc_key }}"
      no_log: true

- name: Bring up the Itential dev stack
  hosts: itential-host
  become: true
  gather_facts: false
  vars_files:
    - ../../itential/versions.yaml
  vars:
    stack_dir: /opt/itential
    oob_address: "{{ vm.ip }}"
    enc_key: "{{ hostvars['localhost'].enc_key }}"
    admin_pw: "{{ hostvars['localhost'].admin_pw }}"
    admin_user: "{{ lookup('ansible.builtin.env', 'ITENTIAL_ADMIN_USER') | default('admin@itential', true) }}"
    profiles: "{{ stack.profiles | map('regex_replace', '^', '--profile ') | join(' ') }}"
    compose: "docker compose -f docker-compose.yml -f compose.override.yml {{ profiles }}"
    platform_local: http://127.0.0.1:3000
    netbox_oob_host: 10.100.0.64
    netbox_port: 8080
    # NetBox platform slug -> netmiko device_type for Gateway 5's device services
    platform_map: {ios-xe: cisco_ios, eos: arista_eos}
  tasks:
    # --- Gateway 5 runner on glibc (ADR 0038): the stock image is Alpine/Python 3.14, where
    # Cisco pyATS/Genie cannot install; the runner is the same iagctl binary on Debian/Python 3.12.
    - name: Runner build directory
      ansible.builtin.file:
        path: "{{ stack_dir }}/gateway5-runner"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Runner build context
      ansible.builtin.copy:
        src: ../../itential/gateway5-runner/Dockerfile
        dest: "{{ stack_dir }}/gateway5-runner/Dockerfile"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      register: runner_dockerfile

    - name: Runner base image pulled by digest
      ansible.builtin.command: docker pull {{ images.runner_base.repository }}@{{ images.runner_base.digest }}
      register: runner_base_pull
      changed_when: "'Downloaded' in runner_base_pull.stdout"

    - name: Runner image built from the pinned gateway and Python images
      ansible.builtin.command:
        cmd: >-
          docker build --build-arg GATEWAY5_IMAGE={{ images.gateway5.repository }}:{{ images.gateway5.tag }}
          --build-arg PYTHON_IMAGE={{ images.runner_base.repository }}@{{ images.runner_base.digest }}
          -t {{ stack.runner_image }} {{ stack_dir }}/gateway5-runner
      register: runner_build
      changed_when: "'CACHED' not in runner_build.stderr or runner_dockerfile.changed"

    - name: Vendored Compose file and the lab override
      ansible.builtin.copy:
        src: "../../itential/{{ item }}"
        dest: "{{ stack_dir }}/{{ item }}"
        owner: ubuntu
        group: ubuntu
        mode: "0644"
      loop: [docker-compose.yml, compose.override.yml]
      notify: Compose up

    - name: OpenLDAP bootstrap (admin@itential and the admins group, upstream LDIF)
      ansible.builtin.copy:
        src: ../../itential/ldap/openldap.ldif
        dest: "{{ stack_dir }}/volumes/ldap/openldap.ldif"
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    # Compose interpolates from .env in the project dir; the platform service also loads it
    # as container environment (upstream design for the Vault variables), so keep it minimal.
    - name: Stack .env from versions.yaml and the repo secrets
      ansible.builtin.copy:
        dest: "{{ stack_dir }}/.env"
        owner: ubuntu
        group: ubuntu
        mode: "0600"
        content: |
          # Rendered by ansible/playbooks/itential.yml from itential/versions.yaml; do not edit.
          PLATFORM_IMAGE={{ images.platform.repository }}:{{ images.platform.tag }}
          GATEWAY4_IMAGE={{ images.gateway4.repository }}:{{ images.gateway4.tag }}
          GATEWAY5_IMAGE={{ images.gateway5.repository }}:{{ images.gateway5.tag }}
          MONGO_VERSION={{ images.mongodb.tag }}
          REDIS_VERSION={{ images.redis.tag }}
          MCP_VERSION={{ images.mcp.tag }}
          OLLAMA_IMAGE={{ images.ollama.repository }}:{{ images.ollama.tag }}
          ETCD_IMAGE={{ images.etcd.repository }}:{{ images.etcd.tag }}
          GATEWAY5_RUNNER_IMAGE={{ stack.runner_image }}
          MCP_TRANSPORT=http
          BIND_ADDRESS=127.0.0.1:
          OOB_ADDRESS={{ oob_address }}
          GATEWAY5_CLUSTER_ID={{ stack.gateway5_cluster_id }}
          LOG_LEVEL=info
          MCP_PLATFORM_USER={{ admin_user }}
          MCP_PLATFORM_PASSWORD={{ admin_pw }}
          LDAP_ADMIN_PASSWORD=admin
          ITENTIAL_ENCRYPTION_KEY={{ enc_key }}
      no_log: true
      notify: Compose up

    - name: Apply file/env changes now, before anything talks to the stack
      ansible.builtin.meta: flush_handlers

    # Gateway 5 authenticates to Gateway Manager with a client certificate it presents over an
    # insecure-TLS gRPC link on the Docker network; self-signed like upstream (5 years).
    - name: Gateway 5 client certificate
      ansible.builtin.command:
        cmd: >-
          openssl req -x509 -newkey rsa:4096 -nodes -days 1825
          -keyout {{ stack_dir }}/volumes/gateway5/certificates/gw-manager-key.pem
          -out {{ stack_dir }}/volumes/gateway5/certificates/gw-manager.pem
          -subj /CN=gateway5 -addext subjectAltName=DNS:gateway5,DNS:localhost,IP:127.0.0.1
          -addext basicConstraints=CA:FALSE -addext keyUsage=digitalSignature,keyEncipherment
          -addext extendedKeyUsage=clientAuth,serverAuth
        creates: "{{ stack_dir }}/volumes/gateway5/certificates/gw-manager.pem"

    - name: Gateway 5 certificate ownership (container uid 100)
      ansible.builtin.file:
        path: "{{ stack_dir }}/volumes/gateway5/certificates/{{ item }}"
        owner: "100"
        group: "101"
        mode: "0644"
      loop: [gw-manager.pem, gw-manager-key.pem]

    - name: Images present (fetch.sh itential-load)
      ansible.builtin.command: docker image inspect {{ item.repository }}:{{ item.tag }}
      loop: "{{ [images.platform, images.gateway4, images.gateway5] }}"
      loop_control:
        label: "{{ item.repository | basename }}:{{ item.tag }}"
      changed_when: false

    - name: Stack up
      ansible.builtin.command:
        cmd: "{{ compose }} up -d --remove-orphans"
        chdir: "{{ stack_dir }}"
      register: up
      changed_when: "'Started' in up.stderr or 'Created' in up.stderr"

    # Services outside the active profiles are not orphans to Compose; Gateway 4 is deployed only
    # when its profile is enabled (ADR 0035), so a container left from another profile set goes.
    - name: Containers of disabled profiles removed
      ansible.builtin.command:
        cmd: "docker rm -f {{ item }}"
      loop: "{{ ['gateway4'] if 'gateway4' not in stack.profiles and 'full' not in stack.profiles else [] }}"
      register: rm_disabled
      changed_when: "item in rm_disabled.stdout"
      failed_when: false

    - name: Platform answers /health/status (up to 5 min on first boot; /health itself redirects to the UI)
      ansible.builtin.uri:
        url: "{{ platform_local }}/health/status"
        status_code: 200
      register: health
      until: health.status == 200
      retries: 60
      delay: 5

    # Platform 6 has one built-in local account (admin); other users come from an AAA provider
    # (AD LDAP in Phase 7). Owner decision 2026-09-07: admin keeps the dev-stack password from .env.
    - name: LDAP login, active from the second run on, as {{ admin_user }}
      ansible.builtin.uri:
        url: "{{ platform_local }}/login"
        method: POST
        body_format: json
        body: {username: "{{ admin_user }}", password: "{{ admin_pw }}"}
        status_code: [200, 401, 403]
      register: ldap_first
      no_log: true

    - name: Otherwise login as the built-in admin (fresh stack, LDAP not configured yet)
      ansible.builtin.uri:
        url: "{{ platform_local }}/login"
        method: POST
        body_format: json
        body: {username: admin, password: "{{ admin_pw }}"}
        status_code: 200
      register: local_first
      when: ldap_first.status != 200
      no_log: true

    - name: Working session
      ansible.builtin.set_fact:
        login: "{{ ldap_first if ldap_first.status == 200 else local_first }}"
      no_log: true

    # --- Gateway Manager: certificate, admin group with every role, gateway cluster ---------
    - name: Gateway Manager API ready
      ansible.builtin.uri:
        url: "{{ platform_local }}/gateway_manager/v1/certificates"
        headers: {Cookie: "{{ login.cookies_string }}"}
        status_code: 200
      register: gm_certs
      until: gm_certs.status == 200
      retries: 20
      delay: 3

    - name: Read the Gateway 5 client certificate
      ansible.builtin.slurp:
        src: "{{ stack_dir }}/volumes/gateway5/certificates/gw-manager.pem"
      register: gw_cert

    - name: Upload the Gateway 5 client certificate once
      ansible.builtin.uri:
        url: "{{ platform_local }}/gateway_manager/v1/certificates"
        method: POST
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body:
          raw_certificate: "{{ gw_cert.content | b64decode }}"
          contract_id: "gateway5-{{ stack.gateway5_cluster_id }}"
          alias: "gateway5-{{ stack.gateway5_cluster_id }}"
        status_code: [200, 201]
      when: gm_certs.json.results | selectattr('alias', 'equalto', 'gateway5-' ~ stack.gateway5_cluster_id) | list | length == 0

    - name: Certificate id
      ansible.builtin.uri:
        url: "{{ platform_local }}/gateway_manager/v1/certificates"
        headers: {Cookie: "{{ login.cookies_string }}"}
      register: gm_certs2

    # The roles endpoint pages at 100; the admin group carries every role (as upstream does).
    - name: Every role id, page by page
      ansible.builtin.uri:
        url: "{{ platform_local }}/authorization/roles?limit=100&skip={{ item }}"
        headers: {Cookie: "{{ login.cookies_string }}"}
      register: role_pages
      loop: [0, 100, 200, 300]
      loop_control:
        label: "skip={{ item }}"

    - name: Role list complete
      ansible.builtin.set_fact:
        role_ids: >-
          {{ role_pages.results | map(attribute='json.results') | flatten | map(attribute='_id') | unique
             | map('community.general.dict_kv', 'roleId') | list }}
        role_total: "{{ role_pages.results[0].json.total }}"

    - name: All roles collected
      ansible.builtin.assert:
        that: role_ids | length == role_total | int
        fail_msg: "collected {{ role_ids | length }} of {{ role_total }} roles"
        quiet: true

    - name: Existing groups
      ansible.builtin.uri:
        url: "{{ platform_local }}/authorization/groups?limit=100"
        headers: {Cookie: "{{ login.cookies_string }}"}
      register: existing_groups

    - name: Group admin_group with every role
      ansible.builtin.uri:
        url: "{{ platform_local }}/authorization/groups{{ '/' ~ existing[0]._id if existing else '' }}"
        method: "{{ 'PATCH' if existing else 'POST' }}"
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body: >-
          {{ {'updates': {'assignedRoles': role_ids}} if existing else
             {'group': {'name': 'admin_group', 'provenance': 'Pronghorn', 'description': 'Admin group with full permissions',
                        'assignedRoles': role_ids, 'memberOf': [], 'inactive': false}} }}
        status_code: [200, 201]
      vars:
        existing: "{{ existing_groups.json.results | selectattr('name', 'equalto', 'admin_group') | list }}"
      changed_when: not existing

    - name: Group id
      ansible.builtin.uri:
        url: "{{ platform_local }}/authorization/groups?limit=100"
        headers: {Cookie: "{{ login.cookies_string }}"}
      register: groups2

    # Two PATCHes: a combined memberOf + assignedRoles update leaves memberOf untouched (observed).
    - name: Built-in admin holds every role directly
      ansible.builtin.uri:
        url: "{{ platform_local }}/authorization/accounts/000000000000000000000000"
        method: PATCH
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body: {updates: {assignedRoles: "{{ role_ids }}"}}
        status_code: 200
      changed_when: false

    - name: Built-in admin is a member of admin_group
      ansible.builtin.uri:
        url: "{{ platform_local }}/authorization/accounts/000000000000000000000000"
        method: PATCH
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body:
          updates:
            memberOf:
              - aaaManaged: false
                groupId: "{{ (groups2.json.results | selectattr('name', 'equalto', 'admin_group') | first)._id }}"
        status_code: 200
      changed_when: false

    - name: Membership and roles are visible on the account
      ansible.builtin.uri:
        url: "{{ platform_local }}/authorization/accounts/000000000000000000000000"
        headers: {Cookie: "{{ login.cookies_string }}"}
      register: admin_acct
      failed_when: >-
        (admin_acct.json.data | default(admin_acct.json)).memberOf | length == 0 or
        (admin_acct.json.data | default(admin_acct.json)).assignedRoles | length != role_total | int

    # --- LDAP: the dev stack's OpenLDAP gives admin@itential, whose group membership Gateway
    # Manager honours (the built-in local admin's memberOf is ignored by the session; observed).
    # Same calls as upstream configure-ldap.sh. Phase 7 points this adapter at Active Directory.
    - name: LDAP adapter exists?
      ansible.builtin.uri:
        url: "{{ platform_local }}/adapters/LDAP"
        headers: {Cookie: "{{ login.cookies_string }}"}
        status_code: [200, 404, 500]
      register: ldap_adapter

    - name: Create the LDAP adapter
      ansible.builtin.uri:
        url: "{{ platform_local }}/adapters"
        method: POST
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body: {properties: {name: LDAP, type: Adapter, properties: {id: LDAP, type: LDAP}}}
        status_code: [200, 201]
      when: ldap_adapter.status != 200

    - name: LDAP adapter properties (activates it)
      ansible.builtin.uri:
        url: "{{ platform_local }}/adapters/LDAP/properties"
        method: PUT
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body:
          properties:
            url: ldap://openldap:389
            domain: "cn={0},dc=itential,dc=io"
            bindUsername: cn=admin,dc=itential,dc=io
            bindPassword: admin
            baseDN: dc=itential,dc=io
            baseUserDN: dc=itential,dc=io
            baseGroupDN: dc=itential,dc=io
            userSearchFilter: cn
            groupSearchFilter: "(objectClass=groupOfNames)"
            userMembershipAttribute: memberOf
            healthCheckInterval: 5000
            timeout: 5000
            connectTimeout: 5000
            idleTimeout: 5000
            timeLimit: 10
            reconnect: true
            activeDirectory: false
            tlsOptions: {requestCert: false}
        status_code: 200
      when: ldap_adapter.status != 200 or not (ldap_adapter.json.metadata.isActive | default(false))
      changed_when: true

    - name: LDAP adapter active
      ansible.builtin.uri:
        url: "{{ platform_local }}/adapters/LDAP"
        headers: {Cookie: "{{ login.cookies_string }}"}
      register: ldap_state
      until: ldap_state.json.metadata.isActive | default(false)
      retries: 20
      delay: 3

    - name: First LDAP login provisions the account for {{ admin_user }}
      ansible.builtin.uri:
        url: "{{ platform_local }}/login"
        method: POST
        body_format: json
        body: {username: "{{ admin_user }}", password: "{{ admin_pw }}"}
        status_code: 200
      register: ldap_login
      retries: 5
      delay: 3
      until: ldap_login.status == 200
      no_log: true

    # Upstream does these two through the database as well: the accounts API does not persist them.
    - name: LDAP admin holds every role and is a member of admin_group (database, idempotent)
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - mongodb
          - mongosh
          - --quiet
          - itential
          - --eval
          - >-
            const roles = db.roles.find({}, {_id: 1}).toArray().map(r => ({roleId: r._id}));
            const g = db.groups.findOne({name: 'admin_group'}, {_id: 1});
            const u = {username: '{{ admin_user }}', provenance: 'LDAP'};
            const a = db.accounts.findOne(u, {assignedRoles: 1, memberOf: 1});
            if (!a) { print('NOUSER'); quit(1); }
            let changed = 0;
            if ((a.assignedRoles || []).length !== roles.length) { db.accounts.updateOne(u, {$set: {assignedRoles: roles}}); changed++; }
            if (!(a.memberOf || []).some(m => String(m.groupId) === String(g._id))) {
              db.accounts.updateOne(u, {$push: {memberOf: {aaaManaged: false, groupId: g._id}}}); changed++; }
            const grp = db.groups.findOne({_id: g._id}, {assignedRoles: 1});
            if ((grp.assignedRoles || []).length !== roles.length) {
              db.groups.updateOne({_id: g._id}, {$set: {assignedRoles: roles}}); changed++; }
            print(changed ? 'CHANGED' : 'OK');
      register: ldap_admin_db
      changed_when: "'CHANGED' in ldap_admin_db.stdout"
      failed_when: "'OK' not in ldap_admin_db.stdout and 'CHANGED' not in ldap_admin_db.stdout"

    - name: Login again with the roles and group as {{ admin_user }}
      ansible.builtin.uri:
        url: "{{ platform_local }}/login"
        method: POST
        body_format: json
        body: {username: "{{ admin_user }}", password: "{{ admin_pw }}"}
        status_code: 200
      register: login
      no_log: true

    - name: Every application and the group are visible in whoami for {{ admin_user }}
      ansible.builtin.uri:
        url: "{{ platform_local }}/whoami"
        headers: {Cookie: "{{ login.cookies_string }}"}
      register: whoami
      failed_when: whoami.json.groups | length == 0 or whoami.json.routes | length < 20

    # --- Gateway cluster, created as the LDAP admin ---------------------------------------------
    - name: Existing gateways
      ansible.builtin.uri:
        url: "{{ platform_local }}/gateway_manager/v1/gateways"
        headers: {Cookie: "{{ login.cookies_string }}"}
      register: gateways

    - name: Gateway cluster {{ stack.gateway5_cluster_id }}
      ansible.builtin.uri:
        url: "{{ platform_local }}/gateway_manager/v1/gateways"
        method: POST
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body:
          gateway:
            gateway_name: "{{ stack.gateway5_cluster_id }}"
            cluster_id: "{{ stack.gateway5_cluster_id }}"
            description: "Lab Gateway 5 (ADR 0035)"
            enabled: true
            readonly: false
            certificates:
              - "{{ (gm_certs2.json.results | selectattr('alias', 'equalto', 'gateway5-' ~ stack.gateway5_cluster_id) | first)._id }}"
            groups: [admin_group]
        status_code: [200, 201]
      when: gateways.json.results | default([]) | selectattr('cluster_id', 'equalto', stack.gateway5_cluster_id) | list | length == 0

    - name: Gateway 5 connected to Gateway Manager (up to 2 min)
      ansible.builtin.uri:
        url: "{{ platform_local }}/gateway_manager/v1/connections"
        headers: {Cookie: "{{ login.cookies_string }}"}
      register: conns
      until: stack.gateway5_cluster_id in (conns.json | to_json)
      retries: 24
      delay: 5

    - name: Runner registered in the cluster store (the server hands every execution to it)
      ansible.builtin.command: docker logs gateway5-runner
      register: runner_log
      until: "'registered runner with database' in runner_log.stdout or 'registered runner with database' in runner_log.stderr"
      retries: 12
      delay: 5
      changed_when: false

    # --- open-source adapters: package into the custom mount, then instances via the API ------
    # The custom directory is bind-mounted read-only into the platform; npm runs in a throw-away
    # container from the platform image (node 20, npm 10) as uid 1001 so the files stay readable.
    - name: Git trusts the adapter checkouts (owned by uid 1001, managed as root)
      community.general.git_config:
        name: safe.directory
        scope: global
        value: "*"

    - name: Adapter sources at the pinned tags
      ansible.builtin.git:
        repo: "{{ item.value.repo }}"
        dest: "{{ stack_dir }}/volumes/platform/adapters/adapter-{{ item.key }}"
        version: "{{ item.value.tag }}"
        depth: 1
        force: true
      loop: "{{ adapters | dict2items }}"
      loop_control:
        label: "adapter-{{ item.key }} {{ item.value.tag }}"
      register: adapter_src

    - name: Adapter files owned by the platform uid (npm runs as 1001, the platform reads as 1001)
      ansible.builtin.file:
        path: "{{ stack_dir }}/volumes/platform/adapters"
        owner: "1001"
        group: "1001"
        recurse: true
      changed_when: false

    - name: Adapter dependencies (npm in the platform image, as uid 1001)
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -u
          - "1001:1001"
          - -e
          - HOME=/tmp
          - -v
          - "{{ stack_dir }}/volumes/platform/adapters/adapter-{{ item.key }}:/w"
          - -w
          - /w
          - --entrypoint
          - npm
          - "{{ images.platform.repository }}:{{ images.platform.tag }}"
          - install
          - --omit=dev
          - --no-audit
          - --no-fund
        creates: >-
          {{ stack_dir }}/volumes/platform/adapters/adapter-{{ item.key }}/node_modules/@itentialopensource/adapter-utils/package.json
      loop: "{{ adapters | dict2items }}"
      loop_control:
        label: "adapter-{{ item.key }}"
      register: adapter_npm

    - name: Platform reloads the custom services after a package change
      ansible.builtin.command:
        cmd: "{{ compose }} restart platform"
        chdir: "{{ stack_dir }}"
      when: adapter_src is changed or adapter_npm is changed
      changed_when: true

    - name: Platform back (after a reload)
      ansible.builtin.uri:
        url: "{{ platform_local }}/health/status"
        status_code: 200
      register: health2
      until: health2.status == 200
      retries: 60
      delay: 5

    - name: Login after the reload as {{ admin_user }}
      ansible.builtin.uri:
        url: "{{ platform_local }}/login"
        method: POST
        body_format: json
        body: {username: "{{ admin_user }}", password: "{{ admin_pw }}"}
        status_code: 200
      register: login
      retries: 10
      delay: 5
      until: login.status == 200
      no_log: true

    # Adapter instances (NetBox through the open-source adapter). Gateway 5 is not an adapter: it
    # is registered with Gateway Manager above. Gateway 4 is deferred (owner decision 2026-09-07).
    # The ServiceNow instance (S4b) is configured only once the PDI details are in .env
    # (SNOW_INSTANCE, SNOW_USER, SNOW_PASSWORD, manual step 7); basic auth is the documented method.
    - name: ServiceNow adapter instance (when the PDI details are in .env)
      ansible.builtin.set_fact:
        snow_instances: >-
          {{ [] if not snow_host else [{
            'name': 'ServiceNow', 'model': '@itentialopensource/adapter-servicenow', 'type': adapters.servicenow.export,
            'properties': {
              'host': snow_host ~ '.service-now.com', 'port': 443, 'protocol': 'https', 'base_path': '/api', 'version': '', 'stub': false,
              'authentication': {'auth_method': 'basic user_password',
                                 'username': lookup('ansible.builtin.env', 'SNOW_USER'),
                                 'password': lookup('ansible.builtin.env', 'SNOW_PASSWORD'),
                                 'token_timeout': 180000, 'token_cache': 'local', 'invalid_token_error': 401,
                                 'auth_field': 'header.headers.Authorization',
                                 'auth_field_format': 'Basic {b64}{username}:{password}{/b64}', 'auth_logging': false},
              'healthcheck': {'type': 'startup', 'frequency': 300000, 'query_object': {}, 'addlHeaders': {}},
              'request': {'number_redirects': 0, 'number_retries': 3, 'limit_retry_error': 401, 'attempt_timeout': 15000,
                          'healthcheck_on_timeout': true, 'return_raw': false, 'archiving': false},
              'ssl': {'ecdhCurve': '', 'enabled': true, 'accept_invalid_cert': false, 'ca_file': '', 'ca_file_content': '',
                      'key_file': '', 'cert_file': '', 'secure_protocol': '', 'ciphers': ''}}}] }}
      vars:
        snow_host: "{{ lookup('ansible.builtin.env', 'SNOW_INSTANCE') }}"
      no_log: true

    - name: Adapter instances
      ansible.builtin.set_fact:
        adapter_instances:
          - name: NetBox
            model: "@itentialopensource/adapter-netbox"
            type: "{{ adapters.netbox.export }}"
            properties:
              host: "{{ netbox_oob_host }}"
              port: "{{ netbox_port }}"
              protocol: http
              base_path: /api
              version: ""
              stub: false
              authentication:
                auth_method: static_token
                token: "{{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"
                token_timeout: 1800000
                token_cache: local
                invalid_token_error: 401
                auth_field: header.headers.Authorization
                auth_field_format: "Token {token}"
                auth_logging: false
              healthcheck: {type: startup, frequency: 300000, query_object: {}, addlHeaders: {}}
              request:
                number_redirects: 0
                number_retries: 3
                limit_retry_error: 401
                attempt_timeout: 10000
                healthcheck_on_timeout: true
                return_raw: false
                archiving: false
              ssl: {enabled: false, accept_invalid_cert: false}
      no_log: true

    - name: Adapter instances including ServiceNow when configured
      ansible.builtin.set_fact:
        adapter_instances: "{{ adapter_instances + snow_instances }}"
      no_log: true

    - name: Existing adapter instances
      ansible.builtin.uri:
        url: "{{ platform_local }}/adapters/{{ item.name }}"
        headers: {Cookie: "{{ login.cookies_string }}"}
        status_code: [200, 404, 500]
      loop: "{{ adapter_instances }}"
      loop_control:
        label: "{{ item.name }}"
      register: adapter_exists

    - name: Create adapter instances
      ansible.builtin.uri:
        url: "{{ platform_local }}/adapters"
        method: POST
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body:
          properties:
            name: "{{ item.item.name }}"
            model: "{{ item.item.model }}"
            type: Adapter
            properties: {id: "{{ item.item.name }}", type: "{{ item.item.type }}"}
        status_code: [200, 201]
      loop: "{{ adapter_exists.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.status != 200

    - name: Configure adapter instances (activates them)
      ansible.builtin.uri:
        url: "{{ platform_local }}/adapters/{{ item.name }}/properties"
        method: PUT
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body: {properties: "{{ item.properties }}"}
        status_code: 200
      loop: "{{ adapter_instances }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true
      changed_when: true

    - name: Adapter instances RUNNING (up to 2 min)
      ansible.builtin.uri:
        url: "{{ platform_local }}/health/adapters"
        headers: {Cookie: "{{ login.cookies_string }}"}
      register: adapters_health
      until: >-
        (adapters_health.json.results | default(adapters_health.json))
        | selectattr('id', 'in', adapter_instances | map(attribute='name') | list)
        | selectattr('state', 'equalto', 'RUNNING') | list | length == adapter_instances | length
      retries: 24
      delay: 5

    # Adapter packages register new roles (their methods); upstream's sync-admin-roles.sh does the
    # same re-sync. Without it the admin gets 403 on the new adapter's routes.
    - name: After the adapters loaded, re-sync every role to admin_group and {{ admin_user }}
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - mongodb
          - mongosh
          - --quiet
          - itential
          - --eval
          - >-
            const roles = db.roles.find({}, {_id: 1}).toArray().map(r => ({roleId: r._id}));
            const g = db.groups.findOne({name: 'admin_group'}, {_id: 1});
            const u = {username: '{{ admin_user }}', provenance: 'LDAP'};
            let changed = 0;
            if (db.accounts.findOne(u, {assignedRoles: 1}).assignedRoles.length !== roles.length) {
              db.accounts.updateOne(u, {$set: {assignedRoles: roles}}); changed++; }
            if (db.groups.findOne({_id: g._id}, {assignedRoles: 1}).assignedRoles.length !== roles.length) {
              db.groups.updateOne({_id: g._id}, {$set: {assignedRoles: roles}}); changed++; }
            print(changed ? 'CHANGED ' + roles.length : 'OK ' + roles.length);
      register: role_resync
      changed_when: "'CHANGED' in role_resync.stdout"
      failed_when: "'OK' not in role_resync.stdout and 'CHANGED' not in role_resync.stdout"

    - name: Fresh session with the adapter roles as {{ admin_user }}
      ansible.builtin.uri:
        url: "{{ platform_local }}/login"
        method: POST
        body_format: json
        body: {username: "{{ admin_user }}", password: "{{ admin_pw }}"}
        status_code: 200
      register: login
      no_log: true

    - name: NetBox adapter answers through the platform (a device page with NetBox's own count)
      ansible.builtin.uri:
        url: "{{ platform_local }}/NetBox/getDcimDevices"
        method: POST
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body: {query: {limit: 1}}
        status_code: 200
      register: nb_devices
      failed_when: (nb_devices.json.response | default(nb_devices.json)).count is not defined

    # --- Inventory Manager: the lab devices from NetBox (ADR 0002) for Gateway 5's device services ---
    # Gateway 5's native send-command/send-config run against Inventory Manager nodes. Nodes are
    # generated from NetBox (routers -> cisco_ios, switches -> arista_eos; firewalls wait for PA-VM,
    # endpoints are not network devices). Device credentials are the lab automation account, stored
    # in the inventory until Vault (Phase 9): accepted SEC exception recorded in the PR.
    - name: Network devices from NetBox (active, with a management address, by platform)
      ansible.builtin.uri:
        url: >-
          http://{{ netbox_oob_host }}:{{ netbox_port }}/api/dcim/devices/?limit=0&status=active&has_primary_ip=true&platform={{ item }}
        headers: {Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"}
      loop: "{{ platform_map.keys() | list }}"
      register: nb_platforms
      no_log: true

    - name: Inventory nodes
      ansible.builtin.set_fact:
        inv_nodes: >-
          {{ inv_nodes | default([]) + [{'name': item.name, 'tags': [item.site.slug, item.role.slug, item.platform.slug],
             'attributes': {'itential_host': item.primary_ip4.address | ansible.utils.ipaddr('address'),
                            'itential_platform': platform_map[item.platform.slug],
                            'itential_user': 'automation',
                            'itential_password': lookup('ansible.builtin.env', 'AUTOMATION_PASSWORD'),
                            'cluster_id': stack.gateway5_cluster_id}}] }}
      loop: "{{ nb_platforms.results | map(attribute='json.results') | flatten | list }}"
      loop_control:
        label: "{{ item.name }}"
      no_log: true

    - name: Inventory exists?
      ansible.builtin.uri:
        url: "{{ platform_local }}/inventory_manager/v1/inventories/{{ stack.inventory }}"
        headers: {Cookie: "{{ login.cookies_string }}"}
        status_code: [200, 404]
      register: inv_state

    - name: Inventory with the built-in broker actions on cluster {{ stack.gateway5_cluster_id }}
      ansible.builtin.uri:
        url: "{{ platform_local }}/inventory_manager/v1/inventories"
        method: POST
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body:
          name: "{{ stack.inventory }}"
          description: "Lab network devices from NetBox (ansible/playbooks/itential.yml)"
          groups: [admin_group]
          createBrokerActions: true
          defaultClusterId: "{{ stack.gateway5_cluster_id }}"
        status_code: [200, 201]
      when: inv_state.status != 200

    - name: Existing nodes
      ansible.builtin.uri:
        url: "{{ platform_local }}/inventory_manager/v1/inventories/{{ stack.inventory }}/nodes"
        headers: {Cookie: "{{ login.cookies_string }}"}
      register: inv_existing
      no_log: true

    # /nodes/bulk is populateInventory: it REPLACES the node set, so always send the full list.
    - name: Inventory nodes populated from NetBox (replaces the set when it differs)
      ansible.builtin.uri:
        url: "{{ platform_local }}/inventory_manager/v1/nodes/bulk"
        method: POST
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body:
          inventory_identifier: "{{ stack.inventory }}"
          nodes: "{{ inv_nodes }}"
        status_code: 200
      vars:
        have: "{{ inv_existing.json.result.data | map(attribute='name') | sort }}"
        want: "{{ inv_nodes | map(attribute='name') | sort }}"
      when: have != want
      no_log: true

    - name: Gateway 5 answers show version on one switch through the inventory (S4.3 building block)
      ansible.builtin.uri:
        url: "{{ platform_local }}/gateway_manager/v1/services/run"
        method: POST
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body:
          serviceName: send-command
          clusterId: "{{ stack.gateway5_cluster_id }}"
          params: {commands: ["show version"]}
          inventory:
            - inventory: "{{ stack.inventory }}"
              nodeNames: ["{{ (inv_nodes | selectattr('attributes.itential_platform', 'equalto', 'arista_eos') | first).name }}"]
        status_code: 200
        timeout: 120
      register: sv
      failed_when: not (sv.json.result.results | map(attribute='success') | list | min)
      changed_when: false

    # --- NetBox prerequisites for wf-branch-vlan-v1: one VLAN group per branch (VID 11-99) ------
    # NetBox allocates the next free VID (POST vlan-groups/{id}/available-vlans/), so the workflow
    # never guesses; groups are scoped to the branch site.
    - name: Branch sites
      ansible.builtin.uri:
        url: "http://{{ netbox_oob_host }}:{{ netbox_port }}/api/dcim/sites/?slug=br1&slug=br2"
        headers: {Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"}
      register: nb_sites
      no_log: true

    - name: Existing VLAN groups
      ansible.builtin.uri:
        url: "http://{{ netbox_oob_host }}:{{ netbox_port }}/api/ipam/vlan-groups/?limit=0"
        headers: {Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"}
      register: nb_vlan_groups
      no_log: true

    - name: VLAN group per branch
      ansible.builtin.uri:
        url: "http://{{ netbox_oob_host }}:{{ netbox_port }}/api/ipam/vlan-groups/"
        method: POST
        headers: {Authorization: "Token {{ lookup('ansible.builtin.env', 'NETBOX_TOKEN') }}"}
        body_format: json
        body:
          name: "{{ item.slug }}-user"
          slug: "{{ item.slug }}-user"
          scope_type: dcim.site
          scope_id: "{{ item.id }}"
          vid_ranges: [[11, 99]]
          description: "User VLANs reserved by wf-branch-vlan-v1 (Phase 5)"
        status_code: 201
      loop: "{{ nb_sites.json.results }}"
      loop_control:
        label: "{{ item.slug }}-user"
      when: (item.slug ~ '-user') not in (nb_vlan_groups.json.results | map(attribute='slug') | list)

    # --- workflows: the documents in itential/workflows/ are code; every run replaces them ------
    # (Automation Studio import; workflow_builder/import expects an encoded payload). Exported
    # copies never drift from the generator because tests/test_itential.py checks the files.
    - name: Workflow documents
      ansible.builtin.set_fact:
        wf_docs: "{{ lookup('ansible.builtin.fileglob', playbook_dir ~ '/../../itential/workflows/wf-*.json', wantlist=True) | sort }}"

    - name: Workflow documents parsed
      ansible.builtin.set_fact:
        wf_bodies: "{{ wf_bodies | default([]) + [lookup('ansible.builtin.file', item) | from_json] }}"
      loop: "{{ wf_docs }}"
      loop_control:
        label: "{{ item | basename }}"

    - name: Existing workflows
      ansible.builtin.uri:
        url: "{{ platform_local }}/automation-studio/workflows?limit=100"
        headers: {Cookie: "{{ login.cookies_string }}"}
      register: wf_existing

    - name: Remove the previous copies
      ansible.builtin.uri:
        url: "{{ platform_local }}/workflow_builder/workflows/delete/{{ item | basename | regex_replace('\\.json$', '') }}"
        method: DELETE
        headers: {Cookie: "{{ login.cookies_string }}"}
        status_code: [200, 404]
      loop: "{{ wf_docs }}"
      loop_control:
        label: "{{ item | basename }}"
      when: (item | basename | regex_replace('\\.json$', '')) in (wf_existing.json['items'] | map(attribute='name') | list)
      changed_when: true

    - name: Import the workflows
      ansible.builtin.uri:
        url: "{{ platform_local }}/automation-studio/automations/import"
        method: POST
        headers: {Cookie: "{{ login.cookies_string }}"}
        body_format: json
        body:
          automations: "{{ wf_bodies }}"
        status_code: 200
      register: wf_import
      failed_when: wf_import.json.imported | rejectattr('success') | list | length > 0
      changed_when: true

  handlers:
    - name: Compose up
      ansible.builtin.command:
        cmd: "{{ compose }} up -d --remove-orphans"
        chdir: "{{ stack_dir }}"
      changed_when: true
