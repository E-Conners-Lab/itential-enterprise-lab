---
# Dynamic inventory from NetBox (PID PIS-15 handoff contract). VMs registered by
# ansible/playbooks/netbox-vms.yml appear here grouped by role tag and cluster.
# Requires NETBOX_API (= NETBOX_URL) and NETBOX_TOKEN in the environment; make exports both from .env.
plugin: netbox.netbox.nb_inventory
validate_certs: false
config_context: false
vm_query_filters:
  - status: active
device_query_filters:
  - status: active
group_names_raw: true
group_by:
  - tags
  - cluster
  - platforms
  - device_roles
ansible_host_dns_name: false
compose:
  # Proxmox VMs (cloud-init) log in as ubuntu; EVE-NG endpoints carry the automation user baked
  # into the golden image; network devices use AUTOMATION_PASSWORD via verify/devcmd.py.
  ansible_user: "'automation' if device_roles is defined else 'ubuntu'"
