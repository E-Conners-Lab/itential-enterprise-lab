          key: web.status[netbox]
          delay: 1m
          value_type: UNSIGNED
          url: http://netbox.lab.internal:8080/login/
          timeout: 15s
          retrieve_mode: HEADERS
          follow_redirects: 'NO'
          verify_peer: 'YES'
          verify_host: 'YES'
          preprocessing:
            - type: REGEX
              parameters:
                - ^HTTP/\S+ (\d{3})
                - \1
          description: Status code from the response headers. Verified with the lab CA.
          tags:
            - tag: component
              value: ui
            - tag: ui
              value: netbox
          triggers:
            - uuid: e0b9ac6be2834e418acebcedd92928ab
              expression: last(/lab-web-ui/web.status[netbox])<>200
              name: 'LAB: UI netbox answers {ITEM.LASTVALUE1} instead of 200'
              priority: HIGH
              tags:
                - tag: scope
                  value: availability
