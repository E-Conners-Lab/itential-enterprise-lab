          key: expiry.days[netbox-api-token]
          delay: 1h
          value_type: FLOAT
          units: d
          params: 'var p = JSON.parse(value);

            return ((new Date(p.expires + ''T00:00:00Z'') - Date.now()) / 86400000).toFixed(2);'
          parameters:
            - name: expires
              value: '2027-09-06'
          description: 'Source: netbox. Expires 2027-09-06.'
