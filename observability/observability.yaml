# Observability documents (PID S7, ADR 0051; Zabbix removed by ADR 0071). Read by ansible/playbooks/observability.yml
# and verify/test-07-observability.sh. Device targets are NOT listed here: they come from NetBox.

# HTTP checks for every UI (blackbox module http_lab). Every URL is reached through the lab CA. `expect` is the HTTP
# status the check accepts.
web_checks:
  - {name: netbox, url: "http://netbox.lab.internal:8080/login/", expect: 200} # netbox-docker serves plain HTTP on 8080 (S0)
  - {name: itential, url: "https://itential.lab.internal/", expect: 200}
  - {name: eve, url: "https://eve.lab.internal/", expect: 200, insecure: true} # EVE-NG's own self-signed certificate
  - {name: grafana, url: "https://grafana.lab.internal/api/health", expect: 200}
  - {name: prometheus, url: "https://prometheus.lab.internal/-/healthy", expect: 200}
  - {name: alertmanager, url: "https://alertmanager.lab.internal/-/healthy", expect: 200}
  - {name: loki, url: "https://loki.lab.internal/ready", expect: 200}
  - {name: gnmic, url: "https://gnmic.lab.internal/metrics", expect: 200}
  # Vault answers /v1/sys/health 200 only when unsealed (503 sealed, 501 not initialised): the probe is the sealed
  # signal for VaultSealed (ADR 0065 decision 7)
  - {name: vault, url: "https://vault.lab.internal:8200/v1/sys/health", expect: 200}

# Prometheus scrape jobs and the rule for their expected target count (S7.2). `count` is a number, or:
# nodes = k3s nodes, devices = active NetBox routers + switches, eos = active vEOS, web_checks = entries above.
prometheus:
  jobs:
    - {job: apiserver, count: nodes}
    - {job: kubelet, count: nodes, endpoints: 3} # /metrics, /metrics/cadvisor, /metrics/probes per node
    - {job: coredns, count: 1}
    - {job: kube-state-metrics, count: 1}
    - {job: node-exporter, count: nodes}
    # kube-prometheus-stack names its own jobs after the release (kps); Prometheus and Alertmanager expose a
    # second endpoint each (the config reloader), measured 2026-09-10
    - {job: kps-operator, count: 1}
    - {job: kps-prometheus, count: 2}
    - {job: kps-alertmanager, count: 2}
    - {job: kps-grafana, count: 1}
    - {job: snmp-exporter, count: 1}
    - {job: snmp-ios-xe, count: ios-xe}
    - {job: snmp-eos, count: eos}
    - {job: blackbox-exporter, count: 1}
    - {job: blackbox-icmp, count: devices}
    - {job: blackbox-http, count: web_checks}
    - {job: gnmic, count: 1}
    - {job: loki, count: 1}
    - {job: alloy-logs, count: nodes}
    - {job: alloy-syslog, count: 1}
    - {job: itential-exporter, count: 1}
    # the official Itential Platform Monitoring dashboard's sources (ADR 0052), following the production
    # environment since ADR 0055: the Platform's own /prometheus_metrics route on each node, node and process
    # exporters on the Platform nodes, and one exporter per Redis server and per replica-set member - which is
    # what gives the dashboard's MongoDB replica-set panels data. Counts come from itential/ha2/versions.yaml.
    # only the active node serves /prometheus_metrics: the standby's Platform is parked (ADR 0055
    # decision 9), so a second target would be permanently down. node/process exporters stay per VM.
    - {job: iap_exporter, count: 1}
    - {job: node_exporter, count: ha2-platform}
    - {job: process_exporter, count: ha2-platform}
    - {job: redis_exporter, count: ha2-redis}
    - {job: mongo_exporter, count: ha2-mongodb}
  alerts: # PrometheusRule lab-observability; S7.6 uses LabDeviceDown
    - {name: LabDeviceDown, for: 1m}
    - {name: LabTargetDown, for: 5m}
    - {name: LabUiDown, for: 3m}
    - {name: LabBgpSessionDown, for: 2m}
    - {name: VaultSealed, for: 1m}
    - {name: LabExpirySoon, for: 1h} # PrometheusRule lab-expiries, generated from expiries.yaml (ADR 0071)

# gNMIc (vEOS only, ADR 0051 decision 8): port, subscriptions and the sample interval. Targets come from NetBox.
gnmic:
  port: 6030
  subscriptions:
    interfaces: {path: /interfaces/interface/state/counters, sample_interval: 30s}
    bgp: {path: /network-instances/network-instance/protocols/protocol/bgp/neighbors/neighbor/state/session-state, sample_interval: 30s}

# Loki / Alloy syslog receiver on the loki VIP: devices send BSD lines to 514/udp (taken raw, label host_ip);
# the VMs' rsyslog sends RFC 5424 to 514/tcp.
syslog:
  udp_port: 514
  tcp_port: 514
  # the Ubuntu machines observability-hosts.yml forwards from (and removed the Zabbix agent from, ADR 0071): NetBox's
  # active Ubuntu VMs and devices, minus these VM roles (ADR 0063: the disposable Copilot sandbox), plus the two
  # pre-existing machines NetBox holds only as addresses (ADR 0028). verify/test-07 checks each one.
  excluded_vm_roles: [itential-host, clab-host]
  extra_hosts:
    - {name: eve, address: 10.100.0.2}
    - {name: netbox, address: 10.100.0.64}

grafana:
  dashboards: [lab-health, fabric, wan, expiries] # observability/grafana/dashboards/<name>.json; firewalls: firewall track
  # vendored as published (ADR 0052); id/revision/sha256 in k8s/observability/versions.yaml
  vendored: [itential-platform-monitoring]
