---
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TOFU_VERSION: 1.12.6
  GITLEAKS_VERSION: 8.30.1

jobs:
  tofu:
    name: tofu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - name: tofu fmt -check
        run: tofu fmt -check -recursive -diff tofu/
      - name: tofu validate every root module (no backend, no Proxmox access)
        run: |
          set -euo pipefail
          for d in tofu $(find tofu -mindepth 1 -maxdepth 1 -type d ! -name '.terraform'); do
            echo "== $d"; (cd "$d" && tofu init -backend=false -input=false >/dev/null && tofu validate)
          done

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    # A hung Galaxy download otherwise holds the check for the 6-hour default. 30 minutes still covers a cache miss
    # on a slow Galaxy day (the download alone took 19 minutes on 2026-09-16).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ansible-lint==26.8.0"
      # The collections are pinned in requirements.yml, so the same versions were downloaded from Galaxy on every
      # run - 45 s to 3 min normally, 19 min when Galaxy was slow. Keyed on that file: Galaxy is only contacted when
      # a pin changes.
      - name: Cache Ansible collections (keyed on requirements.yml)
        id: galaxy-cache
        uses: actions/cache@v6
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ runner.os }}-${{ hashFiles('requirements.yml') }}
      - name: Install Ansible collections from Galaxy (cache miss only)
        if: steps.galaxy-cache.outputs.cache-hit != 'true'
        run: ansible-galaxy collection install -r requirements.yml
      - run: ansible-lint --version && ansible-lint ansible/

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "yamllint==1.38.0"
      - run: yamllint -c .yamllint.yml .

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install gitleaks (pinned release binary, no license needed)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: scan full git history
        run: gitleaks git --redact --verbose --exit-code 1 .

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 5
            --retry-wait-time 10
            --exclude '^https?://(192\.168\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|localhost|127\.)'
            --exclude '\.local(/|$)'
            --exclude '\.lab\.internal(:|/|$)'
            --exclude '^https?://(www\.|software\.)?cisco\.com/'
            --exclude '^https?://docs\.infoblox\.com/'
            --exclude-path verify/results
            './**/*.md'
          fail: true
