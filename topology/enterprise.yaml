# The one topology file (ADR 0002, 0034): eve/build.py renders it into the EVE-NG lab and
# ansible/playbooks/netbox-topology.yml into NetBox. Management addresses must equal
# topology/ipam.yaml; node sizes must equal docs/resource-budget.md §3 (tests/test_topology.py).
# Interface index 0 of every node is management on pnet1 (Gi1 / Mgmt1 / mgmt / eth0).
version: 1
lab:
  name: enterprise
  path: /enterprise.unl
  domain: lab.internal
  mgmt_network: pnet1
  mgmt_gateway: 10.100.0.1
  dns: [10.100.0.1]
  ntp: 10.100.0.1
  # false = PA-VM image not staged: bypass links below are built and the firewall nodes are not.
  # Flip to true, run eve/build.py apply, and the bypass links are removed while the firewall
  # nodes and their (already existing) links come up (ADR 0034 amendment).
  firewalls: false

sites:
  wan: {name: WAN, description: "Simulated provider core"}
  dc1: {name: DC1, description: "Data centre: HA firewalls, EVPN-VXLAN fabric", aggregate: 10.101.0.0/16}
  br1: {name: Branch 1, description: "Branch: WAN router, firewall, switch, clients", aggregate: 10.102.16.0/20}
  br2: {name: Branch 2, description: "Branch: WAN router, firewall, switch, clients", aggregate: 10.102.32.0/20}

routing:
  asn: {isp: 65000, dc1_edge: 65100, dc1_spine: 65101, dc1_leaf: 65102, dc1_fw: 65103, br1: 65201, br2: 65202}
  # WAN tunnels: gre = GRE-over-IPsec (IKEv2, tunnel protection; carries multicast/IPv6 later),
  # ipsec = FlexVPN static VTI (tunnel mode ipsec ipv4). Same IKEv2 policy, ciphers and BGP either way.
  wan_tunnel_mode: gre
  # IKEv2 tunnels, one per DC edge x branch, in the link syntax (a-side .1, b-side .2 of the /30); the
  # interface number is the tunnel id on that router (ADR 0048: the YAML owns every address).
  tunnels:
    - {a: "dc1-wan01:Tunnel1", b: "br1-wan01:Tunnel1", prefix: 10.103.100.0/30}
    - {a: "dc1-wan01:Tunnel2", b: "br2-wan01:Tunnel1", prefix: 10.103.100.4/30}
    - {a: "dc1-wan02:Tunnel1", b: "br1-wan01:Tunnel2", prefix: 10.103.100.8/30}
    - {a: "dc1-wan02:Tunnel2", b: "br2-wan01:Tunnel2", prefix: 10.103.100.12/30}
  # the active firewall's address on the VLAN 100 transit (eBGP from both leaves once lab.firewalls is true)
  firewall_transit_gateway: 10.101.1.1
  # what the fabric advertises as loopbacks (PL-LOOPBACKS): router-ids and the anycast VTEP
  loopback_prefixes: [10.101.254.0/24, 10.101.253.0/24]

# image = EVE-NG folder under /opt/unetlab/addons/qemu (manifest keys: c8000v, veos, pa-vm, ubuntu, win11)
nodes:
  isp-core01:
    site: wan
    role: isp-core
    platform: c8000v
    image: c8000v-17.13.01a
    mgmt_ip: 10.100.0.148
    cpu: 2
    ram: 6144
    ethernet: 8
    eve: {left: 560, top: 60}
    addressing: # IOS-XE loopbacks carry no description on the device, so none here (NetBox = what runs)
      loopbacks: [{name: Loopback0, address: 10.103.255.1/32}]
  dc1-wan01:
    site: dc1
    role: wan-edge
    platform: c8000v
    image: c8000v-17.13.01a
    mgmt_ip: 10.100.0.144
    cpu: 2
    ram: 6144
    ethernet: 8
    eve: {left: 420, top: 180}
    addressing:
      loopbacks: [{name: Loopback0, address: 10.103.255.11/32}]
  dc1-wan02:
    site: dc1
    role: wan-edge
    platform: c8000v
    image: c8000v-17.13.01a
    mgmt_ip: 10.100.0.145
    cpu: 2
    ram: 6144
    ethernet: 8
    eve: {left: 700, top: 180}
    addressing:
      loopbacks: [{name: Loopback0, address: 10.103.255.12/32}]
  dc1-fw01:
    site: dc1
    role: firewall
    platform: pa-vm
    image: paloalto-11.1
    mgmt_ip: 10.100.0.128
    cpu: 4
    ram: 8192
    ethernet: 6
    eve: {left: 420, top: 300}
  dc1-fw02:
    site: dc1
    role: firewall
    platform: pa-vm
    image: paloalto-11.1
    mgmt_ip: 10.100.0.129
    cpu: 4
    ram: 8192
    ethernet: 6
    eve: {left: 700, top: 300}
  dc1-spine01:
    site: dc1
    role: spine
    platform: veos
    image: veos-4.33.1.1F
    mgmt_ip: 10.100.0.160
    cpu: 2
    ram: 4096
    ethernet: 9
    eve: {left: 420, top: 420}
    addressing:
      loopbacks: [{name: Loopback0, address: 10.101.254.1/32, description: router-id}]
  dc1-spine02:
    site: dc1
    role: spine
    platform: veos
    image: veos-4.33.1.1F
    mgmt_ip: 10.100.0.161
    cpu: 2
    ram: 4096
    ethernet: 9
    eve: {left: 700, top: 420}
    addressing:
      loopbacks: [{name: Loopback0, address: 10.101.254.2/32, description: router-id}]
  dc1-leaf01:
    site: dc1
    role: leaf
    platform: veos
    image: veos-4.33.1.1F
    mgmt_ip: 10.100.0.162
    cpu: 2
    ram: 4096
    ethernet: 9
    eve: {left: 420, top: 540}
    addressing:
      loopbacks:
        - {name: Loopback0, address: 10.101.254.11/32, description: router-id}
        - {name: Loopback1, address: 10.101.253.1/32, description: anycast VTEP, anycast: true}
      svis:
        - {name: Vlan4094, address: 10.101.252.1/30, description: MLAG peer}
        - {name: Vlan10, vrf: PROD, virtual: 10.101.10.1/24, description: servers}
        - {name: Vlan100, vrf: PROD, address: 10.101.1.252/24, virtual: 10.101.1.254/24,
           description: transit to the firewalls (eBGP per leaf)}
  dc1-leaf02:
    site: dc1
    role: leaf
    platform: veos
    image: veos-4.33.1.1F
    mgmt_ip: 10.100.0.163
    cpu: 2
    ram: 4096
    ethernet: 9
    eve: {left: 700, top: 540}
    addressing:
      loopbacks:
        - {name: Loopback0, address: 10.101.254.12/32, description: router-id}
        - {name: Loopback1, address: 10.101.253.1/32, description: anycast VTEP, anycast: true}
      svis:
        - {name: Vlan4094, address: 10.101.252.2/30, description: MLAG peer}
        - {name: Vlan10, vrf: PROD, virtual: 10.101.10.1/24, description: servers}
        - {name: Vlan100, vrf: PROD, address: 10.101.1.253/24, virtual: 10.101.1.254/24,
           description: transit to the firewalls (eBGP per leaf)}
  dc1-acc01:
    site: dc1
    role: access
    platform: veos
    image: veos-4.33.1.1F
    mgmt_ip: 10.100.0.164
    cpu: 2
    ram: 4096
    ethernet: 9
    eve: {left: 560, top: 660}
  dc1-srv01:
    site: dc1
    role: server
    platform: ubuntu
    image: linux-ubuntu-24.04-server
    mgmt_ip: 10.100.0.192
    cpu: 1
    ram: 1024
    ethernet: 2
    eve: {left: 560, top: 780}
  br1-wan01:
    site: br1
    role: wan-edge
    platform: c8000v
    image: c8000v-17.13.01a
    mgmt_ip: 10.100.0.146
    cpu: 2
    ram: 6144
    ethernet: 4
    eve: {left: 140, top: 180}
    addressing:
      loopbacks: [{name: Loopback0, address: 10.103.255.21/32}]
      # the users VLAN gateway: on the firewall, or on the router's Gi4 while lab.firewalls is false
      lan: {vlan: 10, prefix: 10.102.17.0/24, gateway: 10.102.17.1/24, description: users}
  br1-fw01:
    site: br1
    role: firewall
    platform: pa-vm
    image: paloalto-11.1
    mgmt_ip: 10.100.0.130
    cpu: 4
    ram: 8192
    ethernet: 4
    eve: {left: 140, top: 300}
  br1-sw01:
    site: br1
    role: branch-switch
    platform: veos
    image: veos-4.33.1.1F
    mgmt_ip: 10.100.0.165
    cpu: 2
    ram: 4096
    ethernet: 9
    eve: {left: 140, top: 420}
  br1-pc01:
    site: br1
    role: client
    platform: win11
    image: win-11-25h2
    mgmt_ip: 10.100.0.193
    cpu: 2
    ram: 6144
    ethernet: 2
    # UEFI/GPT Windows 11 image (images/build-win11.sh): QEMU 5.2.0 (the version the vEOS nodes prove inside the EVE-NG chroot; 9.2.2 exits
    # silently there), q35, OVMF. QEMU runs chrooted in the
    # node directory, into which EVE-NG copies every file of the image folder, so the firmware ships in the
    # image folder (images/import-eve.sh puts OVMF_CODE_4M.fd + OVMF_VARS_4M.fd next to virtioa.qcow2) as pflash;
    # the split 4M firmware does not load through -bios, and each node gets its own copy of the vars file.
    eve:
      left: 60
      top: 540
      qemu_version: "5.2.0"
      qemu_arch: x86_64
      qemu_nic: e1000  # inbox Windows driver; the image sends nothing on virtio-net
      qemu_options: "-machine type=q35,accel=kvm -cpu host,+pcid,+kvm_pv_unhalt,+kvm_pv_eoi,hv_spinlocks=0x1fff,hv_vapic,hv_time,hv_reset,hv_vpindex,hv_runtime,hv_relaxed,hv_synic,hv_stimer -drive if=pflash,format=raw,readonly=on,file=OVMF_CODE_4M.fd -drive if=pflash,format=raw,file=OVMF_VARS_4M.fd -vga std -usb -device usb-tablet"
  br1-host01:
    site: br1
    role: client
    platform: ubuntu
    image: linux-ubuntu-24.04-server
    mgmt_ip: 10.100.0.195
    cpu: 1
    ram: 1024
    ethernet: 2
    eve: {left: 220, top: 540}
  br2-wan01:
    site: br2
    role: wan-edge
    platform: c8000v
    image: c8000v-17.13.01a
    mgmt_ip: 10.100.0.147
    cpu: 2
    ram: 6144
    ethernet: 4
    eve: {left: 980, top: 180}
    addressing:
      loopbacks: [{name: Loopback0, address: 10.103.255.22/32}]
      lan: {vlan: 10, prefix: 10.102.33.0/24, gateway: 10.102.33.1/24, description: users}
  br2-fw01:
    site: br2
    role: firewall
    platform: pa-vm
    image: paloalto-11.1
    mgmt_ip: 10.100.0.131
    cpu: 4
    ram: 8192
    ethernet: 4
    eve: {left: 980, top: 300}
  br2-sw01:
    site: br2
    role: branch-switch
    platform: veos
    image: veos-4.33.1.1F
    mgmt_ip: 10.100.0.166
    cpu: 2
    ram: 4096
    ethernet: 9
    eve: {left: 980, top: 420}
  br2-pc01:
    site: br2
    role: client
    platform: win11
    image: win-11-25h2
    mgmt_ip: 10.100.0.194
    cpu: 2
    ram: 6144
    ethernet: 2
    # UEFI/GPT Windows 11 image (images/build-win11.sh): QEMU 5.2.0 (the version the vEOS nodes prove inside the EVE-NG chroot; 9.2.2 exits
    # silently there), q35, OVMF. QEMU runs chrooted in the
    # node directory, into which EVE-NG copies every file of the image folder, so the firmware ships in the
    # image folder (images/import-eve.sh puts OVMF_CODE_4M.fd + OVMF_VARS_4M.fd next to virtioa.qcow2) as pflash;
    # the split 4M firmware does not load through -bios, and each node gets its own copy of the vars file.
    eve:
      left: 900
      top: 540
      qemu_version: "5.2.0"
      qemu_arch: x86_64
      qemu_nic: e1000  # inbox Windows driver; the image sends nothing on virtio-net
      qemu_options: "-machine type=q35,accel=kvm -cpu host,+pcid,+kvm_pv_unhalt,+kvm_pv_eoi,hv_spinlocks=0x1fff,hv_vapic,hv_time,hv_reset,hv_vpindex,hv_runtime,hv_relaxed,hv_synic,hv_stimer -drive if=pflash,format=raw,readonly=on,file=OVMF_CODE_4M.fd -drive if=pflash,format=raw,file=OVMF_VARS_4M.fd -vga std -usb -device usb-tablet"
  br2-host01:
    site: br2
    role: client
    platform: ubuntu
    image: linux-ubuntu-24.04-server
    mgmt_ip: 10.100.0.196
    cpu: 1
    ram: 1024
    ethernet: 2
    eve: {left: 1060, top: 540}

# Each link is one hidden EVE-NG bridge network and one NetBox cable. Data ports only.
links:
  # provider core to every site edge (10.103.0.0/24 /30s)
  - {a: "isp-core01:Gi2", b: "dc1-wan01:Gi2", prefix: 10.103.0.0/30}
  - {a: "isp-core01:Gi3", b: "dc1-wan02:Gi2", prefix: 10.103.0.4/30}
  - {a: "isp-core01:Gi4", b: "br1-wan01:Gi2", prefix: 10.103.0.8/30}
  - {a: "isp-core01:Gi5", b: "br2-wan01:Gi2", prefix: 10.103.0.12/30}
  # DC edge routers to both firewalls: routed /30s from 10.101.2.0/24, eBGP with GR (ADR 0034 amendment)
  - {a: "dc1-wan01:Gi3", b: "dc1-fw01:eth1/1", prefix: 10.101.2.0/30}
  - {a: "dc1-wan01:Gi4", b: "dc1-fw02:eth1/1", prefix: 10.101.2.4/30}
  - {a: "dc1-wan02:Gi3", b: "dc1-fw01:eth1/2", prefix: 10.101.2.8/30}
  - {a: "dc1-wan02:Gi4", b: "dc1-fw02:eth1/2", prefix: 10.101.2.12/30}
  - {a: "dc1-wan01:Gi5", b: "dc1-wan02:Gi5", prefix: 10.101.2.248/30}
  # firewall HA2
  - {a: "dc1-fw01:eth1/3", b: "dc1-fw02:eth1/3"}
  # fabric: spines to leaves (eBGP underlay /31s), MLAG peer links, access, firewall trust, server
  - {a: "dc1-spine01:Eth1", b: "dc1-leaf01:Eth1", prefix: 10.101.255.0/31}
  - {a: "dc1-spine01:Eth2", b: "dc1-leaf02:Eth1", prefix: 10.101.255.2/31}
  - {a: "dc1-spine02:Eth1", b: "dc1-leaf01:Eth2", prefix: 10.101.255.4/31}
  - {a: "dc1-spine02:Eth2", b: "dc1-leaf02:Eth2", prefix: 10.101.255.6/31}
  - {a: "dc1-leaf01:Eth3", b: "dc1-leaf02:Eth3"}
  - {a: "dc1-leaf01:Eth4", b: "dc1-leaf02:Eth4"}
  - {a: "dc1-leaf01:Eth5", b: "dc1-acc01:Eth1"}
  - {a: "dc1-leaf02:Eth5", b: "dc1-acc01:Eth2"}
  - {a: "dc1-fw01:eth1/4", b: "dc1-leaf01:Eth6"}
  - {a: "dc1-fw02:eth1/4", b: "dc1-leaf02:Eth6"}
  - {a: "dc1-srv01:eth1", b: "dc1-acc01:Eth3"}
  # branch 1
  - {a: "br1-wan01:Gi3", b: "br1-fw01:eth1/1", prefix: 10.102.16.0/30}
  - {a: "br1-fw01:eth1/2", b: "br1-sw01:Eth1"}
  - {a: "br1-pc01:eth1", b: "br1-sw01:Eth2"}
  - {a: "br1-host01:eth1", b: "br1-sw01:Eth3"}
  # branch 2
  - {a: "br2-wan01:Gi3", b: "br2-fw01:eth1/1", prefix: 10.102.32.0/30}
  - {a: "br2-fw01:eth1/2", b: "br2-sw01:Eth1"}
  - {a: "br2-pc01:eth1", b: "br2-sw01:Eth2"}
  - {a: "br2-host01:eth1", b: "br2-sw01:Eth3"}
  # ---- firewall bypass (only while lab.firewalls is false) ----
  # DC: routed /30 + eBGP from each WAN edge into the leaf tenant VRF, the same pattern the
  # firewalls use later. Branch: the router's spare port is the VLAN 10 gateway until the firewall is.
  - {a: "dc1-wan01:Gi6", b: "dc1-leaf01:Eth7", prefix: 10.101.3.0/30, bypass: true}
  - {a: "dc1-wan02:Gi6", b: "dc1-leaf02:Eth7", prefix: 10.101.3.4/30, bypass: true}
  - {a: "br1-wan01:Gi4", b: "br1-sw01:Eth4", vlan: 10, bypass: true}
  - {a: "br2-wan01:Gi4", b: "br2-sw01:Eth4", vlan: 10, bypass: true}

# VRFs the devices run (ADR 0034/0048); RDs are per device (WAN: <asn>:1, PROD: <router-id>:50001)
vrfs:
  MGMT: {description: "OOB management (pnet1)", platforms: [c8000v, veos]}
  WAN: {description: "front-door VRF: provider transport only", platforms: [c8000v], rd: "<asn>:1"}
  PROD: {description: "DC1 tenant VRF (L3VNI 50001)", platforms: [veos], rd: "<router-id>:50001", route_targets: ["50001:50001"]}

# in-band prefixes (docs/ip-plan.md section 6); netbox-topology.yml seeds them, netbox-enrich.yml fills them
inband_prefixes:
  - {prefix: 10.103.0.0/24, site: wan, role: wan-transit, description: "ISP-to-site /30s"}
  - {prefix: 10.103.100.0/24, site: wan, role: wan-transit, description: "GRE/IPsec tunnels"}
  - {prefix: 10.103.255.0/24, site: wan, role: wan-transit, description: "router loopbacks"}
  - {prefix: 10.101.255.0/24, site: dc1, role: dc-inband, description: "fabric underlay /31s"}
  - {prefix: 10.101.254.0/24, site: dc1, role: dc-inband, description: "fabric loopbacks"}
  - {prefix: 10.101.253.0/24, site: dc1, role: dc-inband, description: "VTEP loopbacks"}
  - {prefix: 10.101.252.0/30, site: dc1, role: dc-inband, description: "MLAG peer link"}
  - {prefix: 10.101.2.0/24, site: dc1, role: dc-inband, description: "WAN edge to firewall routed /30s"}
  - {prefix: 10.101.3.0/24, site: dc1, role: dc-inband, description: "firewall bypass /30s (lab.firewalls false)"}
  - {prefix: 10.101.1.0/24, site: dc1, role: dc-inband, description: "VLAN 100 transit, VRF PROD", vlan: 100, vrf: PROD}
  - {prefix: 10.101.10.0/24, site: dc1, role: dc-inband, description: "server VLAN 10", vlan: 10, vrf: PROD}
  - {prefix: 10.102.16.0/20, site: br1, role: branch-inband, description: "branch 1"}
  - {prefix: 10.102.17.0/24, site: br1, role: branch-inband, description: "branch 1 users VLAN 10", vlan: 10}
  - {prefix: 10.102.32.0/20, site: br2, role: branch-inband, description: "branch 2"}
  - {prefix: 10.102.33.0/24, site: br2, role: branch-inband, description: "branch 2 users VLAN 10", vlan: 10}
