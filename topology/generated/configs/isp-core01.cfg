
hostname isp-core01license boot level network-advantage addon dna-advantage
ip domain name lab.internal
no ip domain lookup
username automation privilege 15 secret 0 __AUTOMATION_PASSWORD__
enable secret 0 __AUTOMATION_PASSWORD__
aaa new-model
aaa authentication login default local
aaa authorization exec default local
ip ssh version 2
ip ssh server algorithm hostkey rsa-sha2-512 rsa-sha2-256
crypto key generate rsa modulus 2048
netconf-yang
restconf
ip http secure-server
ip http authentication local
ip name-server vrf MGMT 10.100.0.1
ntp server vrf MGMT 10.100.0.1
!

logging origin-id hostname
logging source-interface GigabitEthernet1 vrf MGMT
logging host 10.100.0.38 vrf MGMT
snmp-server view LAB iso included
snmp-server group LAB v3 priv read LAB
snmp-server location wan
snmp-server contact itential-enterprise-lab

!
vrf definition MGMT
 address-family ipv4
!
interface GigabitEthernet1
 description OOB management (pnet1)
 vrf forwarding MGMT
 ip address 10.100.0.148 255.255.255.0
 no shutdown
!
ip route vrf MGMT 0.0.0.0 0.0.0.0 10.100.0.1
!
interface Loopback0
 ip address 10.103.255.1 255.255.255.255
!
interface GigabitEthernet2
 description to dc1-wan01:Gi2
 ip address 10.103.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet3
 description to dc1-wan02:Gi2
 ip address 10.103.0.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet4
 description to br1-wan01:Gi2
 ip address 10.103.0.9 255.255.255.252
 no shutdown
!
interface GigabitEthernet5
 description to br2-wan01:Gi2
 ip address 10.103.0.13 255.255.255.252
 no shutdown
!
router bgp 65000
 bgp router-id 10.103.255.1
 bgp log-neighbor-changes
 bgp graceful-restart
 neighbor 10.103.0.2 remote-as 65100
 neighbor 10.103.0.6 remote-as 65100
 neighbor 10.103.0.10 remote-as 65201
 neighbor 10.103.0.14 remote-as 65202
 address-family ipv4
  network 10.103.255.1 mask 255.255.255.255
  neighbor 10.103.0.2 activate
  neighbor 10.103.0.2 default-originate
  neighbor 10.103.0.6 activate
  neighbor 10.103.0.6 default-originate
  neighbor 10.103.0.10 activate
  neighbor 10.103.0.10 default-originate
  neighbor 10.103.0.14 activate
  neighbor 10.103.0.14 default-originate
 exit-address-family
!
!
end
