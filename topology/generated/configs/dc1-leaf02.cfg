
hostname dc1-leaf02
dns domain lab.internal
ip name-server vrf MGMT 10.100.0.1
ntp server vrf MGMT 10.100.0.1
!
service routing protocols model multi-agent
!
username automation privilege 15 secret 0 __AUTOMATION_PASSWORD__
aaa authorization exec default local
!
vrf instance MGMT
!
interface Management1
   description OOB management (pnet1)
   vrf MGMT
   ip address 10.100.0.163/24
   no shutdown
!
ip route vrf MGMT 0.0.0.0/0 10.100.0.1
!
management api http-commands
   protocol https
   no shutdown
   vrf MGMT
      no shutdown
!
management ssh
   vrf MGMT
      no shutdown
!

logging vrf MGMT source-interface Management1
logging vrf MGMT host 10.100.0.38
!
snmp-server vrf MGMT
snmp-server view LAB iso included
snmp-server group LAB v3 priv read LAB
snmp-server location dc1
snmp-server contact itential-enterprise-lab
!
management api gnmi
   transport grpc default
      vrf MGMT
      port 6030

!
ip routing
!
interface Loopback0
   description router-id
   ip address 10.101.254.12/32
!
interface Loopback1
   description anycast VTEP
   ip address 10.101.253.1/32
!
vlan 10
   name servers
!
vlan 100
   name fw-transit
!
vrf instance PROD
!
ip routing vrf PROD
!
vlan 4094
   name mlag-peer
   trunk group MLAG
!
no spanning-tree vlan-id 4094
!
interface Port-Channel1
   description MLAG peer link
   switchport mode trunk
   switchport trunk group MLAG
!
interface Port-Channel10
   description dc1-acc01 (MLAG)
   switchport mode trunk
   switchport trunk allowed vlan 10
   mlag 10
!
interface Vlan4094
   description MLAG peer
   ip address 10.101.252.2/30
!
mlag configuration
   domain-id dc1-leafs
   local-interface Vlan4094
   peer-address 10.101.252.1
   peer-link Port-Channel1
   reload-delay mlag 300
   reload-delay non-mlag 330
   dual-primary detection delay 5 action errdisable all-interfaces
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
interface Vlan10
   description servers
   vrf PROD
   ip address virtual 10.101.10.1/24
!
interface Vlan100
   description transit to the firewalls (eBGP per leaf)
   vrf PROD
   ip address 10.101.1.253/24
   ip virtual-router address 10.101.1.254
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vlan 10 vni 10010
   vxlan vlan 100 vni 10100
   vxlan vrf PROD vni 50001
!
interface Ethernet1
   description to dc1-spine01:Eth2
   no shutdown
   no switchport
   ip address 10.101.255.3/31
!
interface Ethernet2
   description to dc1-spine02:Eth2
   no shutdown
   no switchport
   ip address 10.101.255.7/31
!
interface Ethernet3
   description to dc1-leaf01:Eth3
   no shutdown
   channel-group 1 mode active
!
interface Ethernet4
   description to dc1-leaf01:Eth4
   no shutdown
   channel-group 1 mode active
!
interface Ethernet5
   description to dc1-acc01:Eth2
   no shutdown
   channel-group 10 mode active
!
interface Ethernet7
   description to dc1-wan02:Gi6 (firewall bypass)
   no shutdown
   no switchport
   vrf PROD
   ip address 10.101.3.6/30
!
router bgp 65102
   router-id 10.101.254.12
   maximum-paths 4 ecmp 4
   bgp advertise-inactive
   neighbor SPINES peer group
   neighbor SPINES remote-as 65101
   neighbor SPINES send-community extended
   neighbor SPINES maximum-routes 12000
   neighbor EVPN peer group
   neighbor EVPN remote-as 65101
   neighbor EVPN update-source Loopback0
   neighbor EVPN ebgp-multihop 3
   neighbor EVPN send-community extended
   neighbor 10.101.254.1 peer group EVPN
   neighbor 10.101.254.2 peer group EVPN
   neighbor 10.101.255.2 peer group SPINES
   neighbor 10.101.255.6 peer group SPINES
   redistribute connected route-map RM-LOOPBACKS
   vlan 10
      rd 10.101.254.12:10010
      route-target both 10010:10010
      redistribute learned
   vlan 100
      rd 10.101.254.12:10100
      route-target both 10100:10100
      redistribute learned
   address-family evpn
      neighbor EVPN activate
   address-family ipv4
      neighbor SPINES activate
      no neighbor EVPN activate
   vrf PROD
      rd 10.101.254.12:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      router-id 10.101.254.12
      neighbor 10.101.3.5 remote-as 65100
      neighbor 10.101.3.5 description dc1-wan02 (firewall bypass)
      neighbor 10.101.3.5 bfd
      redistribute connected
!
ip prefix-list PL-LOOPBACKS
   seq 10 permit 10.101.254.0/24 eq 32
   seq 20 permit 10.101.253.0/24 eq 32
!
route-map RM-LOOPBACKS permit 10
   match ip address prefix-list PL-LOOPBACKS
!
end
