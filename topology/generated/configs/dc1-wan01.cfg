 description OOB management (pnet1)
 vrf forwarding MGMT
 ip address 10.100.0.144 255.255.255.0
 no shutdown
!
ip route vrf MGMT 0.0.0.0 0.0.0.0 10.100.0.1
!
interface Loopback0
 ip address 10.103.255.11 255.255.255.255
!
interface GigabitEthernet2
 description to isp-core01:Gi2
 vrf forwarding WAN
 ip address 10.103.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet5
 description to dc1-wan02:Gi5
 ip address 10.101.2.249 255.255.255.252
 no shutdown
!
interface GigabitEthernet6
 description to dc1-leaf01:Eth7 (firewall bypass)
 ip address 10.101.3.1 255.255.255.252
 bfd interval 300 min_rx 300 multiplier 3
 no shutdown
!
crypto ikev2 proposal LAB
 encryption aes-gcm-256
 prf sha384
 group 19
!
crypto ikev2 policy LAB
 match fvrf WAN
 proposal LAB
!
crypto ikev2 keyring LAB
 peer br1-wan01
  address 10.103.0.10
  pre-shared-key __AUTOMATION_PASSWORD__
 peer br2-wan01
  address 10.103.0.14
  pre-shared-key __AUTOMATION_PASSWORD__
!
crypto ikev2 profile LAB
 match fvrf WAN
 match identity remote address 0.0.0.0
 authentication remote pre-share
 authentication local pre-share
 keyring local LAB
 dpd 30 5 on-demand
!
crypto ipsec transform-set LAB esp-gcm 256
 mode transport
!
crypto ipsec profile LAB
 set transform-set LAB
 set ikev2-profile LAB
!
interface Tunnel1
 description GRE-over-IPsec to br1-wan01
 ip address 10.103.100.1 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 tunnel source 10.103.0.2
 tunnel destination 10.103.0.10
 tunnel vrf WAN
 tunnel protection ipsec profile LAB
!
interface Tunnel2
 description GRE-over-IPsec to br2-wan01
 ip address 10.103.100.5 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 tunnel source 10.103.0.2
 tunnel destination 10.103.0.14
 tunnel vrf WAN
 tunnel protection ipsec profile LAB
