router bgp 65100
 bgp router-id 10.103.255.11
 bgp log-neighbor-changes
 bgp graceful-restart
 neighbor 10.103.100.2 remote-as 65201
 neighbor 10.103.100.2 description br1-wan01 via Tunnel1
 neighbor 10.103.100.2 timers 20 60
 neighbor 10.103.100.6 remote-as 65202
 neighbor 10.103.100.6 description br2-wan01 via Tunnel2
 neighbor 10.103.100.6 timers 20 60
