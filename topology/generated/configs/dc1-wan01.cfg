  network 10.101.0.0 mask 255.255.0.0
  neighbor 10.101.2.250 activate
  neighbor 10.101.2.250 next-hop-self
  neighbor 10.103.100.2 activate
  neighbor 10.103.100.6 activate
  neighbor 10.101.3.2 activate
