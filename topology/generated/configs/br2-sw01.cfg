
hostname br2-sw01
dns domain lab.internal
ip name-server vrf MGMT 10.100.0.1
ntp server vrf MGMT 10.100.0.1
!
service routing protocols model multi-agent
!
username automation privilege 15 secret 0 __AUTOMATION_PASSWORD__
aaa authorization exec default local
!
vrf instance MGMT
!
interface Management1
   description OOB management (pnet1)
   vrf MGMT
   ip address 10.100.0.166/24
   no shutdown
!
ip route vrf MGMT 0.0.0.0/0 10.100.0.1
!
management api http-commands
   protocol https
   no shutdown
   vrf MGMT
      no shutdown
!
management ssh
   vrf MGMT
      no shutdown
!

logging vrf MGMT source-interface Management1
logging vrf MGMT host 10.100.0.38
!
snmp-server vrf MGMT
snmp-server view LAB iso included
snmp-server group LAB v3 priv read LAB
snmp-server location br2
snmp-server contact itential-enterprise-lab
!
management api gnmi
   transport grpc default
      vrf MGMT
      port 6030

!
interface Ethernet2
   description to br2-pc01:eth1
   no shutdown
   switchport mode access
   switchport access vlan 10
!
interface Ethernet3
   description to br2-host01:eth1
   no shutdown
   switchport mode access
   switchport access vlan 10
!
interface Ethernet4
   description to br2-wan01:Gi4 (firewall bypass)
   no shutdown
   switchport mode access
   switchport access vlan 10
!
vlan 10
   name users
!
end
