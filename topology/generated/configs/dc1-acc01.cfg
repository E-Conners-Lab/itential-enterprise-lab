
hostname dc1-acc01
dns domain lab.internal
ip name-server vrf MGMT 10.100.0.1
ntp server vrf MGMT 10.100.0.1
!
service routing protocols model multi-agent
!
username automation privilege 15 secret 0 __AUTOMATION_PASSWORD__
aaa authorization exec default local
!
vrf instance MGMT
!
interface Management1
   description OOB management (pnet1)
   vrf MGMT
   ip address 10.100.0.164/24
   no shutdown
!
ip route vrf MGMT 0.0.0.0/0 10.100.0.1
!
management api http-commands
   protocol https
   no shutdown
   vrf MGMT
      no shutdown
!
management ssh
   vrf MGMT
      no shutdown
!
interface Ethernet1
   description to dc1-leaf01:Eth5
   no shutdown
   channel-group 10 mode active
!
interface Ethernet2
   description to dc1-leaf02:Eth5
   no shutdown
   channel-group 10 mode active
!
interface Ethernet3
   description to dc1-srv01:eth1
   no shutdown
   switchport mode access
   switchport access vlan 10
!
vlan 10
   name servers
!
interface Port-Channel10
   description uplink to leaf pair (MLAG)
   switchport mode trunk
   switchport trunk allowed vlan 10
!
end
