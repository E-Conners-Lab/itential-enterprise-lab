# Machine-readable IP plan. This file seeds NetBox (ADR 0002); docs/ip-plan.md is the
# human-readable rendering and tests/test_ipam.py proves the two agree.
# Nothing gets an address that is not in this file.
version: 1
domain: lab.internal
supernet: 10.100.0.0/14

home_lan:
  # The only home-LAN address this repo ever assigns. Below the router's DHCP pool (A-19, 2026-09-06).
  oob_gw_address: 192.168.68.120
  dhcp_pool_start: 192.168.68.131
  dhcp_pool_end: 192.168.71.250
  gateway: 192.168.68.1
  known_statics: [192.168.68.1, 192.168.68.110, 192.168.68.161, 192.168.68.240]
  # The Mac Mini serves every local model (ADR 0060): the lab has no GPU and tools-01's Ollama ran at
  # 91% of a 6 GiB cap until llama-server crashed mid-verify. `ollama.lab.internal` resolves here, so
  # the URL in itential/versions.yaml never carries a raw address.
  # This address IS inside the router's DHCP pool, so it is only stable while the router holds a
  # reservation for it - hence dhcp_reservation: true, which tests/test_ipam.py insists on for any
  # pool address. Confirmed set on the main router 2026-09-11 (owner). The consequence still stands if
  # it is ever removed: the lease can move and every local agent fails at once, with nothing in the
  # lab to blame - so re-check here before suspecting the Platform.
  inference_host:
    hostname: mac-mini
    address: 192.168.68.142
    aliases: [ollama]
    dhcp_reservation: true
    description: "Ollama for every FlowAI local profile (ADR 0060)"

prefixes:
  - {prefix: 10.100.0.0/14, status: container, role: lab-supernet, description: "Everything this lab allocates (ADR 0003)"}
  - {prefix: 10.100.0.0/24, status: active, role: oob-management, description: "OOB management: vmbr1 untagged, EVE-NG pnet1"}
  - {prefix: 10.101.0.0/16, status: reserved, role: dc-inband, description: "DC1 in-band, detailed in phase 4"}
  - {prefix: 10.102.0.0/16, status: reserved, role: branch-inband, description: "Branch in-band, one /20 per branch, phase 4"}
  - {prefix: 10.103.0.0/16, status: reserved, role: wan-transit, description: "WAN / transit / loopbacks, phase 4"}
  # ADR 0063: the Containerlab dev topology. Not 10.100.1.0/24, which ADR 0003 keeps for a second OOB VLAN.
  # The mgmt /24 is routed via clab (static routes on oob-gw and itential-dev), so the Mac and the dev stack
  # reach each node on its own address; the in-band /24 never leaves the clab host.
  - {prefix: 10.100.2.0/24, status: active, role: clab-management, description: "Containerlab mgmt, routed via clab 10.100.0.224 (ADR 0063)"}
  - {prefix: 10.100.3.0/24, status: reserved, role: clab-inband, description: "clab dev topology links and loopbacks, never routed off clab (ADR 0063)"}

ranges:
  - {start: 10.100.0.32, end: 10.100.0.63, role: metallb-pool, status: reserved, description: "MetalLB L2 pool (phase 3)"}
  - {start: 10.100.0.240, end: 10.100.0.254, role: dhcp-pool, status: active, description: "DHCP for first boot / ZTP (phase 6)"}

# placement drives the block check in tests/test_ipam.py and the NetBox role/tag.
