# The dev tier's front door (ADR 0068 step 5, feasibility C3): the branded pages in /portal/ must share the
# Platform's origin, so the engineer's own Platform session starts the job and the page never holds a password or
# token. nginx takes the VM's 443 with the Platform's lab-CA certificate, serves /portal/ and proxies everything else
# to the Platform on the Docker network - the same shape as production's load balancer (itential/ha2/nginx.conf.j2).
worker_processes auto;
error_log /dev/stderr warn;
events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout combined;
    include /etc/nginx/mime.types;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;

        client_max_body_size 100m;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;

        # the branded pages: static files, same origin as the Platform
        location /portal/ {
            alias /usr/share/nginx/portal/;
            index index.html;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location / {
            proxy_pass http://platform:3000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
        }
    }
}
