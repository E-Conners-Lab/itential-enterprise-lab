# The role oracle for svc-eval-approver, the skills eval suite's approver account (ADR 0084). Production only. Read by:
#  - ansible/playbooks/tasks/eval-access.yml (the custom role, created or reset to exactly these methods)
#  - ansible/playbooks/tasks/ldap-service-account.yml (svc_kind eval-approver: the group's assignedRoles)
#  - tests/test_eval_access.py (the deny list and the exact methods, written into the test independently)
#
# What the runner does with it: release or reject a held push (Work Center claim, then complete with finishState
# success or failure). Work Center lets an account claim a card when it is in the card's groups (eval-approvers,
# admin_group) and also in its job's groups; the push adds eval-approvers to its own job just before the card, since
# the automation's gbac, read or write, would let the account start the push itself (measured on 6.6.0, 2026-10-23)
# and start Restore Baseline on a Scratch Device (its automation's gbac names eval-approvers: versions.yaml
# automation_access.eval_runner). It starts no agent session. A push a run leaves waiting is rejected, never cancelled:
# Operations Manager's cancelJobs reaches every job on production, so the account does not hold it.
prod:
  group: eval-approvers
  builtin:
    # claim, complete, cancel and read work items; the only built-in Work Center service role (measured 2026-10-23)
    - {provenance: WorkCenterService, name: "work-items:write"}
  # exact method names, no globs
  custom:
    - name: eval-approve
      description: "Skills eval approver: start the restore endpoint, read the suite's jobs (ADR 0084)"
      methods:
        - {provenance: OperationsManager, name: runEndpointTriggerWithPost} # the restore
        - {provenance: OperationsManager, name: getJob}
        - {provenance: OperationsManager, name: getJobs}
  # Never in the set. Globs over "<provenance>/<name>"; the shared task asserts the resolved built-ins against it.
  deny:
    - {provenance: "*", name: admin}
    - {provenance: "*", name: apiwrite}
    - {provenance: "*", name: designer}
    - {provenance: "*", name: engineering}
    - {provenance: "*", name: operations}
    - {provenance: "*", name: support}
    - {provenance: "*", name: builder}
    - {provenance: "*", name: "*:create"}
    - {provenance: "*", name: "*:update"}
    - {provenance: "*", name: "*:delete"}
    - {provenance: "*", name: "*:run"}
    - {provenance: "*", name: "*:code"}
    - {provenance: "*", name: "*:manage"}
    # the approver releases cards; it never runs an agent
    - {provenance: AgentSessionManager, name: "*"}
    # no device path but the workflows: MOP runs commands, Configuration Manager and the Gateway reach devices
    - {provenance: MOP, name: "*"}
    - {provenance: ConfigurationManager, name: "*"}
    - {provenance: GatewayManager, name: "*"}
    - {provenance: InventoryManager, name: "*"}
    # no workflow documents, no direct workflow start, no identity
    - {provenance: AutomationStudio, name: "*"}
    - {provenance: WorkFlowEngine, name: "*"}
    - {provenance: Authorization, name: "*"}
