# Lab override for the vendored itential-dev-stack docker-compose.yml (ADR 0035). The upstream
# file is byte-for-byte the pinned commit (itential/versions.yaml records its sha256); everything
# the lab changes lives here so the diff against upstream is this file. Rendered values
# (image tags, ports, BIND_ADDRESS) come from the stack .env that ansible/playbooks/itential.yml
# writes from itential/versions.yaml and the repo .env.
#
# Exposure model: the upstream port mappings bind to 127.0.0.1 only (BIND_ADDRESS=127.0.0.1: in
# the stack .env); the OOB address 10.100.0.65 gets exactly four listeners:
#   443   Platform HTTPS with the lab-CA certificate (S4.1)
#   8083  Gateway 4 (Golden Config / netmiko show commands)
#   50051 Gateway 5 gRPC (iagctl)
#   8000  MCP server, streamable HTTP for Claude Code on the Mac (S4.7)
# Gateway Manager (8080) stays on the Docker network: Gateway 5 reaches it as platform:8080.
services:
  mongodb:
    # WiredTiger would take half the VM otherwise; 4 GB of 24 GB (S4.6 measures the result).
    command: ["mongod", "--wiredTigerCacheSizeGB", "4", "--bind_ip_all"]

  platform:
    ports:
      - "${OOB_ADDRESS}:443:3443"
    environment:
      ITENTIAL_LOG_LEVEL: ${LOG_LEVEL:-info}

  gateway4:
    ports:
      - "${OOB_ADDRESS}:8083:8083"
    environment:
      automation_gateway_netmiko_enabled: "true"
      automation_gateway_http_requests_enabled: "true"
      automation_gateway_logging_level: "INFO"
      automation_gateway_http_logging_level: "INFO"

  # Gateway 5 as a distributed execution cluster (ADR 0038): the stock server keeps the Gateway
  # Manager connection and the gRPC listener; etcd is the shared store; every execution (native
  # send-command/send-config and runCode) runs on the glibc runner so Genie can install there.
  etcd:
    container_name: etcd
    image: ${ETCD_IMAGE}
    profiles: ["gateway5", "full"]
    command: ["etcd", "--name", "lab", "--data-dir", "/etcd-data",
              "--listen-client-urls", "http://0.0.0.0:2379", "--advertise-client-urls", "http://etcd:2379"]
    volumes:
      - etcd-data:/etcd-data
    restart: unless-stopped

  gateway5:
    ports:
      - "${OOB_ADDRESS}:50051:50051"
    depends_on:
      - etcd
    environment:
      GATEWAY_STORE_BACKEND: etcd
      GATEWAY_STORE_ETCD_HOSTS: etcd:2379
      GATEWAY_STORE_ETCD_USE_TLS: "false" # Docker network only; TLS to etcd with the lab CA is a Phase 9 item
      GATEWAY_SERVER_DISTRIBUTED_EXECUTION: "true"

  gateway5-runner:
    container_name: gateway5-runner
    image: ${GATEWAY5_RUNNER_IMAGE}
    profiles: ["gateway5", "full"]
    depends_on:
      - etcd
      - gateway5
    environment:
      GATEWAY_APPLICATION_MODE: runner
      GATEWAY_APPLICATION_CLUSTER_ID: ${GATEWAY5_CLUSTER_ID:-lab}
      GATEWAY_LOG_LEVEL: ${LOG_LEVEL:-info}
      GATEWAY_STORE_BACKEND: etcd
      GATEWAY_STORE_ETCD_HOSTS: etcd:2379
      GATEWAY_STORE_ETCD_USE_TLS: "false"
      GATEWAY_RUNNER_LISTEN_ADDRESS: 0.0.0.0
      GATEWAY_RUNNER_PORT: "50051"
      GATEWAY_RUNNER_ANNOUNCEMENT_ADDRESS: gateway5-runner # the server dials this name on the Docker network
      GATEWAY_RUNNER_USE_TLS: "false"
    volumes:
      - gateway5-runner-data:/var/lib/gateway # cached venvs (Genie ~790 MB), pex, task workspaces
    deploy:
      resources:
        limits:
          memory: 3g
    restart: unless-stopped

  # In-lab local models (ADR 0037): CPU inference on the VM, models on a named volume, reachable
  # only on the Docker network (the Model Registry profile uses http://ollama:11434) and loopback.
  ollama:
    container_name: ollama
    image: ${OLLAMA_IMAGE}
    profiles: ["ollama"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    deploy:
      resources:
        limits:
          memory: 10g
    restart: unless-stopped

  mcp:
    ports:
      - "${OOB_ADDRESS}:8000:8000"
    environment:
      ITENTIAL_MCP_SERVER_TRANSPORT: "http"
      ITENTIAL_MCP_SERVER_PATH: "/mcp"
      ITENTIAL_MCP_SERVER_LOG_LEVEL: "INFO" # itential-mcp rejects lowercase levels; the platform wants lowercase
      ITENTIAL_MCP_PLATFORM_USER: ${MCP_PLATFORM_USER}
      ITENTIAL_MCP_PLATFORM_PASSWORD: ${MCP_PLATFORM_PASSWORD}

volumes:
  ollama-models:
    driver: local
  etcd-data:
    driver: local
  gateway5-runner-data:
    driver: local
