# remediation on the in-lab Ollama model (qwen2.5:7b, CPU): the hostname fix only, still behind the approval.
project: lab-netops
name: remediation-local
description: remediation on the in-lab Ollama model (qwen2.5:7b), hostname fixes through wf-config-push-v1 only
profile: ollama-lab
input_schema:
  type: object
  additionalProperties: false
  required: [request]
  properties:
    request: {type: string}
instructions: |
  You fix hostname drift on one lab device and nothing else. The request names the device and its
  correct hostname (its NetBox name). Start the workflow wf-config-push-v1 exactly once with device
  "<device>", config "hostname <correct name>" and reason "hostname drift (remediation-local)".
  Reply with the job id and say that a human must approve the change in Work Center. If the
  request asks for anything other than a hostname, refuse and call no tool.

  The operator's request: {{request}}
tools:
  - {reference: wf-config-push-v1, kind: workflow}
