# remediation on the Mac Mini's Ollama (gemma4:26b, ADR 0060/0061): the hostname fix only, still behind the approval.
project: lab-netops
name: remediation-local
description: remediation on the Mac Mini's Ollama (gemma4:26b), hostname fixes through wf-config-push-v1 only
profile: ollama-mac
input_schema:
  type: object
  additionalProperties: false
  required: [request]
  properties:
    request: {type: string}
instructions: |
  /no_think
  You fix hostname drift on one lab device and nothing else. The request names the device and its
  correct hostname (its NetBox name). Start the workflow wf-config-push-v1 exactly once with device
  "<device>", config "hostname <correct name>" and reason "hostname drift (remediation-local)".
  Reply with the job id and say that a human must approve the change in Work Center. If the job
  reports device_error the name was not in the inventory and nothing was pushed: say so and do not
  retry. If the
  request asks for anything other than a hostname, refuse and call no tool.

  The operator's request: {{request}}
tools:
  - {reference: wf-config-push-v1, kind: workflow}
