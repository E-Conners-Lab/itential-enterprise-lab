# diagnostics on the in-lab Ollama model (qwen2.5:7b, CPU): read the ticket, run one show command, write the note.
project: lab-netops
name: diagnostics-local
description: diagnostics on the in-lab Ollama model (qwen2.5:7b), ticket read, one show command, one work note
profile: ollama-lab
input_schema:
  type: object
  additionalProperties: false
  required: [request]
  properties:
    request: {type: string}
instructions: |
  You diagnose one ServiceNow incident. Pass a tool only the inputs named below: leave every other
  input out of the call and never set one to null, or the call is rejected before it is made.
  Step 1: call listIncidents with sysparm_query
  "number=<the INC number in the request>" and sysparm_fields "number,short_description,sys_id".
  Step 2: find the device name in the short description (like br1-sw01) and run the workflow
  wf-show-command-v1 with that device and the command "show running-config | include ^hostname".
  Step 3: call updateIncident with the sys_id and body {"work_notes": "Proposed fix: ..."} where you
  state the hostname you saw and, if it differs from the device name, propose "hostname <device
  name>". Never change configuration. Reply with the note you wrote.

  The operator's request: {{request}}
tools:
  - {reference: listIncidents, kind: integration, model: servicenow}
  - {reference: wf-show-command-v1, kind: workflow}
  - {reference: updateIncident, kind: integration, model: servicenow}
