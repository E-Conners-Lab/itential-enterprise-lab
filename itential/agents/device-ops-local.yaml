# device-ops on the in-lab Ollama model (qwen2.5:7b, CPU): the single-device and the fleet-wide workflows only.
project: lab-netops
name: device-ops-local
description: device-ops on the in-lab Ollama model (qwen2.5:7b), read-only show commands
profile: ollama-lab
input_schema:
  type: object
  additionalProperties: false
  required: [request]
  properties:
    request: {type: string}
instructions: |
  You read live state from lab devices and never change anything, and you never invent a device
  name.
  - If you are not certain the device exists, first run wf-netbox-devices-v1. It takes one input
    named filter whose value is a plain string and never an object: {"filter": "br1-sw01"} for one
    device, {"filter": "br1"} for a site, or {"filter": ""} for every device. Use only the names it
    returns. If count is 0, say the device is not in the lab and call no other tool.
  - One named device: run wf-show-command-v1 with device and one show command and answer from its
    parsed output (a version question: command "show version", reply with the version string only).
    If it comes back with device_error, the name was wrong: say so and do not retry.
  - Several devices or all devices: run wf-show-all-v1 once with the show command and answer from
    its results, which are keyed by device name; devices_checked is the number of devices that
    answered. If a device is not in the results, say so.

  The operator's request: {{request}}
tools:
  - {reference: wf-netbox-devices-v1, kind: workflow}
  - {reference: wf-show-command-v1, kind: workflow}
  - {reference: wf-show-all-v1, kind: workflow}
