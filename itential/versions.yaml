# Single oracle for Phase 5 (PID S4, ADR 0035). Read by ansible/playbooks/itential-host.yml,
# itential.yml, images/fetch.sh itential and verify/test-05-itential.sh; tests/test_itential.py
# holds it to docs/image-manifest.md 3.5, docs/resource-budget.md, topology/ipam.yaml and
# tofu/itential. Never 'latest'. Since ADR 0063 (PID 1.30) the VM it describes is the dev stack
# `itential-dev`, the Copilot sandbox; production reads itential/ha2/versions.yaml for its topology.
upstream:
  dev_stack_repo: https://github.com/itential/itential-dev-stack
  dev_stack_commit: 2db4b448db683d80f16e532357972e3f3004c0cb # main on 2026-06-24, vendored 2026-09-07
  compose_sha256: f1107f418ebd8ffcc48da903fc425777774717bc00379a8d90535fb6127f5bf4 # itential/docker-compose.yml

docker_ce: 29.8.0-1~ubuntu.24.04~noble # download.docker.com stable, 2026-09-03

images:
  # Private ECR: tags listed with the owner's SSO session on the pull date (manifest 3.5, ADR 0020 amendment)
  # Listed 2026-09-07 with `aws ecr describe-images --profile product-ecr-pull-all-497639811223`; digests below.
  platform: # pushed 2026-09-03, 756 MB; same digest as 6.5.2-ecm-6.5.2-fai-1.1.0-gm-1.2.3-lcm-6.5.2-2
    repository: 497639811223.dkr.ecr.us-east-2.amazonaws.com/automation-platform-config-lcm-flowai
    tag: "6.5.2"
    digest: sha256:dab5ef7e4e07a9eb01fcee8320bf1313bda05abec8673040e995bf902a23ba98
  gateway5: # pushed 2026-09-02, 363 MB
    repository: 497639811223.dkr.ecr.us-east-2.amazonaws.com/automation-gateway5
    tag: 5.5.2-amd64
    digest: sha256:6b7940cb5dd2bcad809c1e43bcb009d9bc76512423cf7068945f3f0e8245936c
  gateway4: # pushed 2026-09-02, 173 MB; newest 4.4.x. Staged, not deployed (Gateway 4 deferred, ADR 0035)
    repository: 497639811223.dkr.ecr.us-east-2.amazonaws.com/automation-gateway
    tag: 4.4.1
    digest: sha256:ced4fcc36d09274299f0cb2537ff0f0340c18bf7f6fdd292a1ae08896f20e0e0
  # Public
  mongodb: {repository: docker.io/library/mongo, tag: "7.0.40"} # Platform 6 fully supports 7.0 (manifest 3.2); Docker Hub 2026-09-07
  redis: {repository: docker.io/library/redis, tag: "7.4.11"}
  mcp: {repository: ghcr.io/itential/itential-mcp, tag: v0.14.0} # release 2026-08-13; streamable HTTP transport
  # upstream dev-stack OpenLDAP: admin@itential and the group membership Gateway Manager needs (until Phase 7 AD)
  ldap: {repository: docker.io/osixia/openldap, tag: 1.4.0}
  # Gateway 5 distributed execution (ADR 0038): etcd is the shared store a runner node needs
  # (Gateway requires etcd v3.5); the runner is built on the VM from runner_base + the iagctl
  # binary of images.gateway5 (itential/gateway5-runner/Dockerfile). quay.io / Docker Hub 2026-09-07
  etcd: {repository: quay.io/coreos/etcd, tag: v3.5.21, digest: "sha256:a3ccd299377af4b9968d8cbaaf9722fe354297f11908f74a846075e1e5f4ee89"}
  # Phase 8 (ADR 0053): nginx is the load balancer in front of the Platform nodes, the role Itential's Deployer
  # documents for it. Docker Hub 2026-09-10; the stable line, alpine for a small surface.
  nginx: {repository: docker.io/library/nginx, tag: 1.30.4-alpine} # 2026-09-02
  # Exporters beside the dev-stack for the official Itential Platform Monitoring dashboard (ADR 0052); tags confirmed
  # on Docker Hub and GitHub releases 2026-09-10
  node_exporter: {repository: docker.io/prom/node-exporter, tag: v1.12.1} # 2026-07-14
  process_exporter: {repository: docker.io/ncabatoff/process-exporter, tag: 0.8.7} # 2025-04-21
  redis_exporter: {repository: docker.io/oliver006/redis_exporter, tag: v1.91.1} # 2026-09-07
  mongodb_exporter: {repository: docker.io/percona/mongodb_exporter, tag: 0.53.0} # 2026-08-20
  # glibc base for the runner: pyATS ships no musl (Alpine) or Python 3.14 wheels
  runner_base:
    repository: docker.io/library/python
    tag: 3.12.14-slim-trixie
    digest: "sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea"

vm:
  # itential-dev, never `itential` or `mcp`: since the S11 cut-over those names belong to production's load
  # balancer (.71) and tools VM (.81), and reusing either would repoint Claude Code or a verify at the sandbox.
  name: itential-dev
  vm_id: 205
  ip: 10.100.0.65
  cores: 8
  memory_mb: 24576
  disk_gb: 160

stack:
  # platform + mongodb + redis + gateway5 + mcp + openldap. Gateway 4 deferred (owner decision
  # 2026-09-07: Gateway 5 is the gateway; Golden Config is not in S4), openbao off (Vault in Phase 9)
  profiles: [platform, gateway5, mcp, ldap, monitoring] # monitoring = the Platform host exporters (ADR 0052)
  # itential/ldap/openldap.ldif, vendored from the same upstream commit
  ldif_sha256: 4d22e7a2a80dc5f3b6fabccf35b68e34fe6d6c9fd4c87842c2a6deca53f97cbc
  gateway5_cluster_id: lab
  inventory: lab # Inventory Manager inventory holding the NetBox network devices
  host_inventory: lab-hosts # the Ubuntu hosts (S4d.6, ADR 0047): reached by Gateway 5, never by Configuration Manager
  mongo_cache_gb: 4
  runner_image: gateway5-runner:5.5.2-py3.12.14 # local build tag on the VM (ADR 0038)

# --- The dev stack for Copilot prototyping (ADR 0063, PID S12). Production is read-only to Copilot, so it builds
# here instead. Only ansible/playbooks/vars/itential-dev.yml and the dev Makefile targets read this block; a play
# run without that overlay keeps its production defaults. Every secret is a new .env key with its own name, so a
# dev run can never regenerate production's ITENTIAL_ENCRYPTION_KEY (losing it loses every stored adapter
# secret), and the NetBox token is view-only, so a dev workflow that reserves a VLAN fails with 403 by design.
dev:
  hostname: itential-dev
  mcp_alias: mcp-dev # the dev MCP server runs as svc-copilot, not admin@itential
  copilot: {user: svc-copilot, group: copilot-builders, password_env: SVC_COPILOT_DEV_PASSWORD}
  netbox_token_env: NETBOX_DEV_RO_TOKEN
  encryption_key_env: ITENTIAL_DEV_ENCRYPTION_KEY

# Structured CLI output (PID S4c.7, ADR 0038): the parse step of Run Show Command on a Device is a Gateway 5
# runCode task whose pip packages are exactly these (one cached venv on the runner, ~790 MB). The
# NetBox platform slug of the node picks the engine. Versions from PyPI on 2026-09-07.
parsers:
  cisco:
    engine: genie # Cisco pyATS/Genie parsers, glibc + Python <= 3.13 only
    packages: ["pyats==26.8", "genie==26.8"]
    netbox_platforms: {ios-xe: iosxe, ios: ios, nx-os: nxos, ios-xr: iosxr}
  arista:
    engine: textfsm # ntc-templates through TextFSM
    packages: ["textfsm==2.1.0", "ntc-templates==9.2.0"]
    netbox_platforms: {eos: arista_eos, junos: juniper_junos}

# Open-source adapters (GitLab itentialopensource/adapters, manifest 3.2), installed into the
# platform's custom services mount from the tag's commit; npm deps resolved at install time.
# Only what the Platform itself requires an adapter for (ADR 0054 decision 2): the InventoryBroker
# consumes an adapter, so NetBox keeps one. adapter-servicenow was removed by S4f - the PDI is reached
# through the lab-servicenow Integration Model.
adapters:
  netbox:
    repo: https://gitlab.com/itentialopensource/adapters/adapter-netbox.git
    tag: v1.0.10 # commit c3bd5098, 2026-08-31
    export: Netbox

# Workflow names say what the workflow does, in the words an operator would use (ADR 0067): a verb and an
# object in Title Case, no `wf-` prefix and no version (git and the replay carry the version). The key is the
# stable handle the code uses; the value is the name the Platform, the agents and the operators see. Each file
# in itential/workflows/ is the name in lowercase with dashes (tests/test_workflow_names.py).
workflows:
  device_count: Count Devices in NetBox
  show_version: Get Device Software Version
  branch_vlan: Add Branch VLAN
  show_command: Run Show Command on a Device # S4c.7 (ADR 0038)
  show_all: Run Show Command on All Devices # S4d.5: one show command on every lab device, parsed per device (ADR 0046)
  config_push: Push Configuration with Approval # S4d: the only write path, Work Center approval (ADR 0040/0041)
  compliance_run: Run Nightly Compliance Check # S4d.1: target of the nightly schedule trigger
  backup_all: Back Up All Device Configs # S4d.2: every Configuration Manager device backed up (forEach), nightly
  branch_vlan_delete: Remove Branch VLAN # S4d.3: the LCM delete action; switch write through Push Configuration with Approval (ADR 0043)
  compliance_report: Summarize Compliance Results
  netbox_devices: List Devices from NetBox # S4d.5: run or read the plan, compact per-device summary for the agents (ADR 0046)

# The names before ADR 0067. The play deletes each one it still finds on a Platform, after importing the
# renamed documents, so a replay leaves no stale copy behind. Nothing may reuse one of these names.
retired_workflows:
  - wf-netbox-device-count-v1
  - wf-show-version-v1
  - wf-branch-vlan-v1
  - wf-show-command-v1
  - wf-show-all-v1
  - wf-config-push-v1
  - wf-compliance-run-v1
  - wf-backup-all-v1
  - wf-branch-vlan-delete-v1
  - wf-compliance-report-v1
  - wf-netbox-devices-v1

# --- Phase 6b: Platform coverage of the EVE-NG lab (PID S4d, ADR 0040). Built by
# ansible/playbooks/platform.yml from itential/golden-config/<deviceType>/{base.gc,device.j2};
# the tree deviceType selects the parser, the inventory keeps its netmiko names (measured 2026-09-07).
golden_config:
  documents: itential/golden-config
  trees:
    cisco-ios: {name: lab-cisco-ios, netmiko: cisco_ios, netbox_platform: ios-xe, mgmt_if: GigabitEthernet1}
    arista-eos: {name: lab-arista-eos, netmiko: arista_eos, netbox_platform: eos, mgmt_if: Management1}
  device_groups:
    site: [dc1, br1, br2, wan]
    role: [wan-edge, isp-core, spine, leaf, access, branch-switch]
  plan: lab-baseline
  schedule: {name: nightly compliance lab-baseline, at_utc: "03:00", repeat_unit: days, repeat_interval: 1}

# --- Phase 6: FlowAI (PID S4c, ADR 0037). Provider keys live in .env only; profiles are created
# by ansible/playbooks/flowai.yml through the Model Registry (write-only credentials).
llm:
  default_profile: anthropic
  # The Anthropic key is the owner's company key (ADR 0049): about $15 a week. verify/tokens.sh meters the last
  # 7 days from the Agent Session Manager at these list prices (claude-sonnet-5, 2026-09-09) and the agent
  # verifies refuse to start Anthropic sessions once the week is spent (ANTHROPIC_VERIFY=force overrides).
  budget: {provider: anthropic, weekly_usd: 15, input_usd_per_mtok: 2.00, output_usd_per_mtok: 10.00}
  profiles:
    - name: anthropic
      provider: anthropic
      model: claude-sonnet-5 # Model Registry listed 11 Claude models for the key on 2026-09-07
      env_key: ANTHROPIC_API_KEY
    # The Mac Mini's Ollama is Homebrew-managed, so it is recorded rather than pinned from here:
    # tested against ollama 0.23.3 (ADR 0060).
    #
    # gemma4:26b, not a Qwen (ADR 0061, measured by scripts/model-bakeoff.py). Every candidate scored
    # 9/9 on the tool-call shapes that caused the incidents of PR #32/#33, so correctness stopped
    # being the differentiator; thinking traces are. The Platform does not send Ollama's `think: false`
    # (a real session emitted 1820 output tokens), `PARAMETER think false` is not a Modelfile
    # parameter, and `/no_think` in the prompt is IGNORED by the Qwen family here - only gemma obeys
    # it. The prompt is the only lever the Platform gives us, so it decides the model.
    - name: ollama-mac
      provider: ollama
      # ADR 0060: every local model runs on the Mac Mini. `ollama.lab.internal` resolves to it
      # (topology/ipam.yaml home_lan.inference_host), so no raw home-LAN address appears here and
      # a DHCP reservation change is a one-line DNS edit rather than a hunt through the repo.
      base_url: http://ollama.lab.internal:11434
      model: gemma4:26b

agents:
  project: lab-netops
  documents: itential/agents

# --- S4d.2 (ADR 0042): command templates (MOP, read-only checks) per OS type and the nightly backups.
# Documents in itential/command-templates/<deviceType>.yaml; created through /mop/* by tasks/mop.yml.
mop:
  documents: itential/command-templates
  templates:
    cisco-ios: {command: lab-cisco-ios-checks, analytic: lab-cisco-ios-prepost}
    arista-eos: {command: lab-arista-eos-checks, analytic: lab-arista-eos-prepost}
  backup_schedule: {name: nightly backups lab, at_utc: "02:30", repeat_unit: days, repeat_interval: 1}

# --- S4d.3 (ADR 0043/0044): Lifecycle Manager model for the branch VLAN service and the JSON form on its approval
# task. Documents: itential/lcm/<model>.yaml (schema + actions naming their workflows; the name survives the
# itential.yml re-import, measured) and itential/forms/<form>.json (generated by itential/forms/build.py).
# Created through /lifecycle-manager and /json-forms by tasks/lcm.yml; one instance per existing NetBox branch VLAN.
lcm:
  documents: itential/lcm
  model: branch-vlan
  actions: {create: Add Branch VLAN, delete: Remove Branch VLAN}
  instance_name: "<branch>-<vlan_name>" # known before the run; the VID is chosen inside it
  netbox_vlan_groups: [br1-user, br2-user] # the VLAN groups itential.yml creates; their VLANs become instances
forms:
  documents: itential/forms
  approval: lab-branch-vlan-approval # ShowJsonForm on task 4a of Add Branch VLAN (read-only context + decision)

# --- S4d.4 (ADR 0045): Integration Models (OpenAPI) for NetBox and the ServiceNow PDI, registered as agent tools.
# Documents itential/integrations/<name>.json are generated by itential/integrations/build.py from a read-mostly
# operation list (the live NetBox schema is 322 paths / 14 MB: far too many tools for an agent). tasks/integrations.yml
# validates and creates each model (id = title:version), creates and starts the integration instance with the
# credentials from .env, and refreshes the Tool Registry. Servers: the instance's server settings, not the document's.
integrations:
  documents: itential/integrations
  models:
    netbox:
      title: lab-netbox
      version: "1.0.0"
      instance: netbox-api # integration (virtual adapter) name; the adapter instance stays NetBox
      auth: tokenAuth # OpenAPI security scheme in the document: apiKey header Authorization "Token <NETBOX_TOKEN>"
      server: {protocol: http, host: 10.100.0.64, port: 8080, base_path: ""}
      # Provenance (S4f.1, ADR 0054 decision 4). The operation ids are NetBox's own, as drf-spectacular
      # generates them and as this instance serves them at /api/schema/; the version is the pin that matters,
      # because a NetBox major can rename an operation id. Not link-checked: CI's lychee reads only *.md.
      spec: {url: "https://docs.netbox.dev/en/stable/integrations/rest-api/", taken: "4.7.0", kind: openapi}
      operations: [dcim_devices_list, dcim_devices_retrieve, dcim_interfaces_list, ipam_ip_addresses_list, ipam_vlans_list, dcim_sites_list,
                   dcim_racks_list, circuits_circuits_list, ipam_asns_list, ipam_vrfs_list, ipam_prefixes_list,  # S4e, ADR 0048
                   # S4f (ADR 0054): the writes Add Branch VLAN / Remove Branch VLAN reached through the adapter, and the
                   # journal entry ADR 0048 had to write from the runner because the adapter dropped the trailing
                   # slash. These are workflow operations: no read-tier agent lists them (ADR 0046, enforced in tests).
                   ipam_vlans_create, ipam_vlans_partial_update, ipam_vlans_destroy, extras_journal_entries_create]
      write_operations: [ipam_vlans_create, ipam_vlans_partial_update, ipam_vlans_destroy, extras_journal_entries_create]
    servicenow:
      title: lab-servicenow
      version: "1.0.0"
      instance: servicenow-api
      auth: BasicAuth # http basic: SNOW_USER / SNOW_PASSWORD (itential.integration on the PDI)
      server: {protocol: https, port: 443, base_path: ""} # host = <SNOW_INSTANCE>.service-now.com from .env
      # Provenance (S4f.1): ServiceNow publishes no OpenAPI document for the Table API, so this model is
      # written from the vendor's reference rather than trimmed from a specification. kind records that
      # honestly - "documentation" means a regeneration is a re-read by a person, not a re-run of a script.
      spec: {url: "https://www.servicenow.com/docs/bundle/zurich-api-reference/page/integrate/inbound-rest/concept/c_TableAPI.html",
             taken: "2026-09-08", kind: documentation}
      operations: [listIncidents, getIncident, updateIncident, listChangeRequests, getChangeRequest,
                   # S4f (ADR 0054): the change writes the workflows reached through genericAdapterRequest
                   createStandardChange, updateStandardChange, updateChangeRequest]

# --- S4d.6 (ADR 0047): the Ubuntu hosts as Gateway 5 inventory nodes in their own inventory (stack.host_inventory),
# so Configuration Manager (InventoryBroker publishes only stack.inventory) never backs them up or checks them.
# Nodes come from NetBox (active, primary address, these platforms); Gateway 5's netmiko driver takes platform linux.
# Password login for the automation user is enabled per host by ansible/playbooks/lab-endpoints.yml.
hosts:
  netbox_platforms: {ubuntu-24-04: linux}
  roles: [server, client]
  probe: ["uptime -p", "hostname"] # the reachability and uptime check (verify S4d.6, agents later)

# --- Phase 9a (PID S8.2-S8.3, ADR 0065): Vault holds the device and API credentials, read through Itential's
# built-in clients (the Platform's ITENTIAL_VAULT_* AppRole client, read-only; the Gateway's `vault` secret
# provider). One oracle for both environments: dev runs its own Vault container on itential-dev with dev-only
# secrets (ADR 0063), production runs the k3s chart (ADR 0026). tests/test_vault.py holds the plays to this block.
vault:
  image: {repository: docker.io/hashicorp/vault, tag: "2.0.4"} # ADR 0026; the chart's default app version
  chart: {repo: https://helm.releases.hashicorp.com, name: vault, version: "0.34.1"}
  port: 8200
  kv_mount: lab # KV v2; the Platform's and the Gateway's secrets endpoint is "<kv_mount>/data"
  approle_mount: approle
  # path under the mount -> keys, and the .env variable each key is seeded from (one way; .env stays the source)
  secrets:
    devices/automation:
      username: {value: automation}
      password: {env: AUTOMATION_PASSWORD, dev_env: CLAB_AUTOMATION_PASSWORD}
    services/netbox:
      token: {env: NETBOX_TOKEN} # dev: load_env_dev swaps the view-only NETBOX_DEV_RO_TOKEN in (ADR 0063)
      # the whole Authorization value: an integration instance resolves a $SECRET_ reference only when it is the
      # entire field (measured 2026-09-23), so the "Token " prefix has to live in Vault too
      header: {env: NETBOX_TOKEN, prefix: "Token "}
    services/servicenow:
      username: {env: SNOW_USER}
      password: {env: SNOW_PASSWORD}
      prod_only: true # ServiceNow stays off on dev (ADR 0063)
  # the two readers (ADR 0065 decisions 5 and 6); `bound_hosts` are the addresses a secret ID works from
  approles:
    itential-platform:
      policy_paths: [services/*]
      bound_hosts: [iap-01, iap-02] # production; dev binds to what the dev probe measures
    itential-gateway:
      policy_paths: [devices/*, services/netbox]
      bound_hosts: [iag-01]
  # What the Platform stores in place of a credential once vault_enabled is on (measured 2026-09-23): an adapter or
  # integration field resolves a $SECRET_ reference only when the reference is the WHOLE value. Not secrets.
  platform_refs:
    netbox_adapter_token: "$SECRET_services/netbox $KEY_token"
    netbox_integration_value: "$SECRET_services/netbox $KEY_header"
    servicenow_password: "$SECRET_services/servicenow $KEY_password"
  # Integration instances NO play creates (made by hand on production) whose credential Vault still holds: only the
  # authentication value is rewritten, everything else is read back and kept. Owner decision 2026-09-23.
  external_integrations:
    netbox-latest: {auth: tokenAuth, ref: netbox_integration_value} # the NX-OS pack's NetBox:latest instance
  device_password_alias: lab-automation-password # inventory nodes' itential_password -> $GATEWAYSECRET_(<this>)
  # the Gateway server resolves aliases (the runner never does), reading its AppRole secret ID from this file in
  # the server's working-directory volume; the server caches providers, so a change restarts server then runner
  gateway_secret_id_file: /etc/gateway/vault_secret_id
  # Gateway secret aliases, referenced as $GATEWAYSECRET_(<alias>)
  gateway_provider: lab-vault
  gateway_aliases:
    lab-automation-password: {path: devices/automation, key: password}
    lab-netbox-token: {path: services/netbox, key: token}
  dev:
    dir: /opt/vault-dev # on itential-dev: config, tls (the VM's lab-CA certificate), raft data, init output
    # The address, not the name: on itential-dev the name resolves to 127.0.1.1 (Ubuntu's /etc/hosts entry), for the
    # VM and for every container on it through Docker's DNS (measured 2026-09-23), while Vault listens on the OOB
    # address. The VM's lab-CA certificate carries the address as a SAN (itential-host.yml).
    url: https://10.100.0.65:8200
    # Measured 2026-09-23 (a temporary audit device): every request from the dev VM's containers reaches Vault from the
    # gateway of the vault-dev Docker network, because Docker relays traffic to a published port on the same host. So
    # dev's AppRole binding means "from this VM", not "from the Platform" or "from the Gateway" (both share the VM), and
    # the network's subnet is pinned here so the bound address is deliberate, not whatever Docker hands out.
    docker_subnet: 172.31.65.0/24
    docker_gateway: 172.31.65.1
  prod:
    namespace: vault
    vip: 10.100.0.41 # docs/ip-plan.md
    url: https://vault.lab.internal:8200
    # The owner's administrator login (ADR 0065, production step 5). Vault 2.0 requires a token for generate-root
    # (measured 2026-09-24: 403 without one), so once the root token is revoked this login is the only admin path:
    # the play creates the policy and the auth mount, the owner sets the password (make vault-admin-user), and the
    # root token may be revoked only after a login with it has been proven (make vault-revoke-root checks).
    admin:
      auth_mount: userpass
      user: lab-admin
      policy: lab-admin
      token_ttl: 1h
      token_max_ttl: 8h
