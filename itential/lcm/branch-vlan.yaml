# Lifecycle Manager resource model for the branch VLAN service (PID S4d.3, ADR 0043). Created and kept current
# by ansible/playbooks/tasks/lcm.yml (POST/PUT /lifecycle-manager/resources, then actions/validate).
# Actions name their workflows: the platform resolves the name to the current import when the action runs,
# so the delete + import of every wf-* by itential.yml never breaks the model (measured on 6.5.2).
# The workflows publish the job variable `instance` (this schema) themselves: no pre/post transformations.
name: branch-vlan
description: >-
  A user VLAN in a branch (br1, br2): reserved in NetBox and configured on the branch switch by
  wf-branch-vlan-v1 behind the Work Center approval form; retired by wf-branch-vlan-delete-v1 through the
  governed config push. Instances are named <branch>-<vlan_name> (itential/lcm/branch-vlan.yaml).
schema:
  $id: branch-vlan
  type: object
  additionalProperties: false
  required: [branch, vid, vlan_name, switch, netbox_vlan_id, status]
  properties:
    branch: {type: string, enum: [br1, br2], description: Branch site slug}
    vid: {type: integer, minimum: 11, maximum: 99, description: 802.1Q id chosen from the branch VLAN group}
    vlan_name: {type: string, minLength: 1, description: VLAN name in NetBox and on the switch}
    switch: {type: string, description: Inventory node the VLAN is configured on (<branch>-sw01)}
    netbox_vlan_id: {type: integer, description: NetBox VLAN object id (the reservation)}
    status: {type: string, enum: [reserved, active, deprecated, deleted], description: NetBox status; deleted once retired}
actions:
  - _id: "0c01"
    name: Create
    description: Reserve the VLAN in NetBox, approve on the form, configure the branch switch (wf-branch-vlan-v1)
    type: create
    workflow: wf-branch-vlan-v1
    preWorkflowJst: null
    postWorkflowJst: null
  - _id: "0d01"
    name: Delete
    description: Delete the NetBox VLAN and remove it from the switch through wf-config-push-v1 (wf-branch-vlan-delete-v1)
    type: delete
    workflow: wf-branch-vlan-delete-v1
    preWorkflowJst: null
    postWorkflowJst: null
