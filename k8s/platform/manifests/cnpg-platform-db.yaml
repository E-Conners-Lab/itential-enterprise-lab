# Proof cluster for PID S2.5: one instance on Longhorn, an empty `app` database. Later phases create their
# own Cluster per application.
#
# No WAL archiving, no ScheduledBackup, no ObjectStore (ADR 0064): the lab's CloudNativePG databases are
# rebuildable and are not backed up. Archiving both clusters to Garage filled Garage on 2026-09-15 and took
# Zabbix down. ansible/playbooks/k8s-platform.yml deletes the live ScheduledBackup and ObjectStore and removes
# the plugin from this Cluster, because dropping them from this file does not.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-db
  namespace: cnpg-system
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  storage:
    size: 10Gi
    storageClass: longhorn
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
