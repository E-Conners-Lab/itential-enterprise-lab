# Zabbix database on CloudNativePG (ADR 0051 decision 3): one instance on Longhorn. The chart reads the
# application secret zabbix-db-app (host, port, username, password, dbname).
#
# No WAL archiving, no ScheduledBackup, no ObjectStore (ADR 0064): the database holds only metric history,
# and the Zabbix configuration is rebuilt from the repo by ansible/playbooks/observability.yml. Archiving to
# Garage filled Garage on 2026-09-15, the unarchived WAL then filled this volume and Zabbix was down ~15 h.
# Without an archiver PostgreSQL recycles its WAL. 12Gi, not 10Gi: the live volume had to grow once so a full
# disk lets postgres start. ansible/playbooks/observability.yml deletes the live ScheduledBackup and
# ObjectStore and removes the plugin from this Cluster, because dropping them from this file does not.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: zabbix-db
  namespace: observability
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6
  bootstrap:
    initdb:
      database: zabbix
      owner: zabbix
  storage:
    size: 12Gi
    storageClass: longhorn
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {memory: 1Gi}
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 128MB
