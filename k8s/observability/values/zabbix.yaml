# zabbix-community/zabbix (ADR 0024/0051): server + web on the 7.0.30 images, database on the CloudNativePG
# cluster zabbix-db (secret zabbix-db-app), server trapper port on the zabbix VIP (shared with Traefik),
# web UI behind Traefik (k8s/observability/manifests). The image tag is set by the play from versions.yaml.
postgresql:
  enabled: false
postgresAccess:
  existingSecretName: zabbix-db-app # CloudNativePG application secret of cluster zabbix-db
  secretHostKey: host
  secretPortKey: port
  secretUserKey: username
  secretPasswordKey: password
  secretDBKey: dbname
zabbixServer:
  replicaCount: 1
  podAntiAffinity: false
  haNodesAutoClean:
    enabled: false # HA is off; the cleaner would pull an unpinned postgres:16 image
  service:
    type: LoadBalancer
    port: 10051
    annotations:
      metallb.io/loadBalancerIPs: 10.100.0.35
      metallb.io/allow-shared-ip: zabbix
  # Sized for the estate, not for the phase 7 estate. Measured 2026-09-11: at 1Gi the server sat at
  # 1000Mi and had been OOMKilled (exit 137) 12 times in 35 h - roughly every three hours, a steady climb
  # to the ceiling rather than a leak - which is what puts "Zabbix server is down" on the frontend, since
  # the web pod reports the server unreachable while it restarts. Phase 8 then added eleven production
  # VMs to poll, so 1Gi was going from marginal to insufficient.
  resources:
    requests: {cpu: 100m, memory: 768Mi}
    limits: {memory: 2Gi}
  extraEnv:
    - {name: ZBX_CACHESIZE, value: 64M}
    - {name: ZBX_STARTPINGERS, value: "2"}
    - {name: ZBX_STARTPOLLERS, value: "5"}
    - {name: ZBX_STARTHTTPPOLLERS, value: "2"}
  # HTTP agent items verify the lab CA: the image pins SSLCALocation to /var/lib/zabbix/ssl/ssl_ca (measured:
  # ZBX_SSLCALOCATION is ignored), so the lab-ca ConfigMap (hashed <subject_hash>.0 file) is mounted there
  extraVolumes:
    - name: lab-ca
      configMap: {name: lab-ca}
  extraVolumeMounts:
    - {name: lab-ca, mountPath: /var/lib/zabbix/ssl/ssl_ca, readOnly: true}
zabbixWeb:
  replicaCount: 1
  podAntiAffinity: false
  service:
    type: ClusterIP
    port: 80
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  extraEnv:
    - {name: PHP_TZ, value: UTC}
    - {name: ZBX_SERVER_NAME, value: itential-enterprise-lab}
    # Without these the frontend looks for a host called `zabbix-server`, which does not exist - the chart
    # names the Service `<release>-zabbix-server` - so every page shows "Zabbix server is not running" while
    # the server is perfectly healthy. Measured 2026-09-11: `zabbix-server` has no DNS record in the
    # namespace, `zabbix-zabbix-server` resolves. The API and the collected data are unaffected, which is
    # why S7.1 passed throughout and only the banner said otherwise.
    - {name: ZBX_SERVER_HOST, value: zabbix-zabbix-server}
    - {name: ZBX_SERVER_PORT, value: "10051"}
zabbixWebService:
  enabled: false # scheduled PDF reports need a Chrome pod; not part of S7
zabbixAgent:
  enabled: true # sidecar: the stock "Zabbix server" host stays green
  runAsSidecar: true
  runAsDaemonSet: false
  hostNetwork: false
  hostRootFsMount: false
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
zabbixProxy:
  enabled: false
zabbixJavaGateway:
  enabled: false
zabbixBrowserMonitoring:
  enabled: false
ingress:
  enabled: false # k8s/observability/manifests/ingress (Traefik, wildcard lab-CA certificate)
