# grafana/alloy, release alloy-logs (ADR 0051): a DaemonSet that ships every pod's logs to Loki through the
# Kubernetes API (no host mounts). Its own metrics are the job alloy-logs (one target per node).
controller:
  type: daemonset
alloy:
  resources:
    requests: {cpu: 20m, memory: 96Mi}
    limits: {memory: 256Mi}
  configMap:
    create: true
    content: |
      logging {
        level  = "warn"
        format = "logfmt"
      }

      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME_NODE")
        }
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        rule {
          target_label = "job"
          replacement  = "pods"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }
  extraEnv:
    - name: HOSTNAME_NODE
      valueFrom:
        fieldRef: {fieldPath: spec.nodeName}
configReloader:
  resources:
    requests: {cpu: 5m, memory: 16Mi}
