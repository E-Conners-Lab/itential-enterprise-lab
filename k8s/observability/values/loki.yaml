# grafana/loki (ADR 0024/0051): single binary on a Longhorn volume, filesystem storage, 7-day retention,
# no auth (in-cluster writers, Grafana and the verify through Traefik). The gateway, caches, canary and
# MinIO of the chart are off: the lab is one small tenant.
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
    allow_structured_metadata: true
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16
    reject_old_samples: true
    reject_old_samples_max_age: 168h
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
    working_directory: /var/loki/compactor
  ingester:
    chunk_encoding: snappy
  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi
    storageClass: longhorn
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {memory: 1Gi}
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
memcached:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
monitoring:
  serviceMonitor:
    enabled: false # the lab's ServiceMonitor (job loki) is in the play's scrape template
sidecar:
  rules:
    enabled: false
