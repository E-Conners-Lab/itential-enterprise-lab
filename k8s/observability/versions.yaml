# Single oracle for every version and address the phase-7 observability plays use (PID S7, ADR 0051).
# Values come from docs/image-manifest.md section 4.3 (ADR 0024/0051) and topology/ipam.yaml;
# tests/test_observability.py fails CI if this file drifts from either. Never 'latest'.
obs_namespace: observability

# MetalLB VIPs from topology/ipam.yaml (hostnames resolve through oob-gw's unbound).
vips: # 10.100.0.35 was zabbix until ADR 0071 (released)
  grafana: 10.100.0.36
  prometheus: 10.100.0.37 # alias alertmanager.lab.internal
  loki: 10.100.0.38 # Traefik (Loki API) + Alloy syslog 514/tcp+udp (shared IP)
  gnmic: 10.100.0.39

# Traefik (kube-system) terminates TLS with the phase-3 wildcard certificate; one extra LoadBalancer
# Service per VIP selects its pods (k8s/observability/manifests/traefik-vips.yaml).
traefik:
  namespace: kube-system
  selector: {app.kubernetes.io/name: traefik, app.kubernetes.io/instance: traefik-kube-system}

components:
  kube_prometheus_stack:
    chart_repo: https://prometheus-community.github.io/helm-charts
    chart_name: kube-prometheus-stack
    chart_version: 89.2.3
    app_version: v0.93.1 # prometheus-operator
    prometheus_version: v3.14.0
    alertmanager_version: v0.34.0
    grafana_version: 13.2.1
  snmp_exporter:
    chart_repo: https://prometheus-community.github.io/helm-charts
    chart_name: prometheus-snmp-exporter
    chart_version: 9.17.1
    app_version: v0.30.1
  blackbox_exporter:
    chart_repo: https://prometheus-community.github.io/helm-charts
    chart_name: prometheus-blackbox-exporter
    chart_version: 11.18.0
    app_version: v0.28.0
  loki:
    chart_repo: https://grafana.github.io/helm-charts
    chart_name: loki
    chart_version: 7.3.0
    app_version: 3.6.12
  alloy:
    chart_repo: https://grafana.github.io/helm-charts
    chart_name: alloy
    chart_version: 1.12.1
    app_version: v1.19.2
  gnmic:
    image: ghcr.io/openconfig/gnmic
    image_tag: 0.47.0
  itential_exporter:
    # the Python image itential/versions.yaml pins as runner_base; the exporter is a ConfigMap script (ADR 0051)
    image: docker.io/library/python
    image_tag: 3.12.14-slim-trixie
    digest: "sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea"

# The official Itential dashboard, vendored byte for byte (ADR 0052); tests/test_observability.py holds the file to the hash.
vendored_dashboards:
  itential-platform-monitoring:
    grafana_com_id: 25527
    revision: 3 # 2026-08-14, org Itential
    sha256: 01fca89a5afcfb98916c6b05d3593fd0dc524172148cde800bda3bce126a90d1
    uid: iap-platform-monitoring

storage: # Longhorn, Gi (docs/resource-budget.md section 4: telemetry volumes are rebuildable)
  prometheus: 10
  prometheus_retention: 10d
  prometheus_retention_size: 8GB
  loki: 10
  loki_retention: 168h
  grafana: 1
  alertmanager: 1
