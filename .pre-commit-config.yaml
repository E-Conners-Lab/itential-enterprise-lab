---
# Run `make bootstrap` once to install these hooks locally.
# Every hook here also runs in CI (.github/workflows/ci.yml); local is the fast path.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^verify/results/   # raw evidence is never rewritten
      - id: end-of-file-fixer
        exclude: ^verify/results/
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint.yml]

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        files: ^ansible/

  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt -check
        entry: tofu fmt -check -recursive tofu/
        language: system
        pass_filenames: false
        files: \.tf$
